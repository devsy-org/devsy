# Per-agent deltas for the OpenHands automation prompt generator.
# Shared logic lives in template.md.tmpl; toolchain install blocks are selected
# by the `toolchain` field and pinned in main.go (one place to bump versions).

agents:
- id: pkg-container
  branch_prefix: pkg-container
  commit_subject: '"<conventional-commit subject, 50 chars max>" "<body>"'
  pr_title: <subject>
  job_name: package review job
  toolchain: go
  step0_title: Check for and install the Go toolchain if missing (Go, task, golangci-lint)
  commit_step_number: 3
  pr_step_number: 4
  verify_type: go
  intro: You are a package reviewer for Devsy's container/Docker category. The devsy-org/devsy repo is cloned in your workspace on branch main. Follow AGENTS.md conventions (lowercase logs, Conventional Commits, 50-char subject max). Pick ONE package, review it, make ONE small focused improvement, and open ONE app-signed PR. Never use GITHUB_TOKEN for the commit or PR — authenticate as the Devsy GitHub App.
  review_steps: |-
    STEP 1 — Pick ONE package from the scope. Review for: daemon lifecycle correctness, credential handling, image pull/cache logic, error propagation, and edge-case tests (missing daemon, registry auth failure). Never echo registry tokens or docker config credentials; mask credentials in logs. Prefer adding/fixing a test over a behavioral change. Make ONE small, focused change reviewable in 15 minutes.
  pr_body_must_include: the package reviewed, the issue found, the change, the verification performed (lint:ci, cli:test)
  constraints: ONE package per run. Never echo registry tokens or docker config credentials. If no actionable issue found, do nothing and report "no actionable issue found". Never use GITHUB_TOKEN for the commit or PR.
  description: Reviews the Docker, OCI, image, and compose packages for small focused improvements.
  scope: |-
    - `pkg/docker`, `pkg/dockerinstall`, `pkg/dockercredentials`, `pkg/dockerfile`
    - `pkg/compose`, `pkg/image`, `pkg/extract`, `pkg/flatpak`, `pkg/driver`
  self_improvement: |-
    At the end of each run, persist findings (daemon quirks, image digest gotchas, platform
    arch handling) to the running automation via the automation service — not the git repo —
    using the service's agentic memory if available. Propose `description` amendments to this
    `agent.md` for human review when scope boundaries shift.
