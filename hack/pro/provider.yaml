name: devsy-pro
version: ##VERSION##
icon: https://dl.devsy.sh/assets/devsy.svg
description: Devsy Pro
options:
  DEVSY_CONFIG:
    global: true
    hidden: true
    required: true
    default: "${PROVIDER_FOLDER}/devsy-config.json"
binaries:
  PRO_PROVIDER:
    - os: linux
      arch: amd64
      path: https://github.com/devsy-org/devsy/releases/download/##VERSION##/devsy-linux-amd64
      checksum: ##CHECKSUM_LINUX_AMD64##
    - os: linux
      arch: arm64
      path: https://github.com/devsy-org/devsy/releases/download/##VERSION##/devsy-linux-arm64
      checksum: ##CHECKSUM_LINUX_ARM64##
    - os: darwin
      arch: amd64
      path: https://github.com/devsy-org/devsy/releases/download/##VERSION##/devsy-darwin-amd64
      checksum: ##CHECKSUM_DARWIN_AMD64##
    - os: darwin
      arch: arm64
      path: https://github.com/devsy-org/devsy/releases/download/##VERSION##/devsy-darwin-arm64
      checksum: ##CHECKSUM_DARWIN_ARM64##
    - os: windows
      arch: amd64
      path: https://github.com/devsy-org/devsy/releases/download/##VERSION##/devsy-windows-amd64.exe
      checksum: ##CHECKSUM_WINDOWS_AMD64##
exec:
  proxy:
    up: |-
      ${PRO_PROVIDER} platform provider up
    ssh: |-
      ${PRO_PROVIDER} platform provider ssh
    stop: |-
      ${PRO_PROVIDER} platform provider stop
    status: |-
      ${PRO_PROVIDER} platform provider status
    delete: |-
      ${PRO_PROVIDER} platform provider delete
    health: |-
      ${PRO_PROVIDER} platform provider health
    daemon:
      start: |-
        ${PRO_PROVIDER} platform provider daemon start
      status: |-
        ${PRO_PROVIDER} platform provider daemon status
    create:
      workspace: |-
        ${PRO_PROVIDER} platform provider create workspace
    get:
      workspace: |-
        ${PRO_PROVIDER} platform provider get workspace
      self: |-
        ${PRO_PROVIDER} platform provider get self
      version: |-
        ${PRO_PROVIDER} platform provider get version
    update:
      workspace: |-
        ${PRO_PROVIDER} platform provider update workspace
    watch:
      workspaces: |-
        ${PRO_PROVIDER} platform provider watch workspaces
    list:
      workspaces: |-
        ${PRO_PROVIDER} platform provider list workspaces
      projects: |-
        ${PRO_PROVIDER} platform provider list projects
      templates: |-
        ${PRO_PROVIDER} platform provider list templates
      clusters: |-
        ${PRO_PROVIDER} platform provider list clusters
