name: Pull Request

# Disposable diagnostic branch only. This branch is not a PR and is never merged.
# Its workflow_dispatch performs one bounded verification against immutable CI artifacts.
on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-linux-package-artifacts:
    name: Verify final-head Linux package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: "40297171031"
      SOURCE_HEAD_SHA: "69dad22e2c3274c1107d0ba03c433e1ce49c3378"
      LINUX_ARTIFACT_ID: "12639935552"
      LINUX_ARTIFACT_DIGEST: "sha256:0e950613095177239e17a38550a9c63055a5fc9a488f9eb58d4cb9c3e88b4b2c"
      FLATPAK_ARTIFACT_ID: "12640187992"
      FLATPAK_ARTIFACT_DIGEST: "sha256:4be8280adec67fde65021e6dec2cb8562af40b74c4e115630c6fe3d671ea4bae"
    steps:
      - name: Checkout verifier source at artifact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 69dad22e2c3274c1107d0ba03c433e1ce49c3378

      - name: Verify source run and artifact identities before download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/diag/1652-artifact-verification-69dad
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e \
            --argjson id "$SOURCE_RUN_ID" \
            --arg sha "$SOURCE_HEAD_SHA" \
            '.id == $id and .head_sha == $sha and .event == "pull_request" and .conclusion == "success"' \
            <<<"$run"

          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          jq -e \
            --argjson id "$LINUX_ARTIFACT_ID" \
            --arg digest "$LINUX_ARTIFACT_DIGEST" \
            'any(.artifacts[]; .id == $id and .name == "desktop-ubuntu-latest" and .digest == $digest and .expired == false)' \
            <<<"$artifacts"
          jq -e \
            --argjson id "$FLATPAK_ARTIFACT_ID" \
            --arg digest "$FLATPAK_ARTIFACT_DIGEST" \
            'any(.artifacts[]; .id == $id and .name == "Devsy-x86_64.flatpak" and .digest == $digest and .expired == false)' \
            <<<"$artifacts"

      - name: Download and checksum exact source artifacts
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          linux_zip="$RUNNER_TEMP/linux-artifact.zip"
          flatpak_zip="$RUNNER_TEMP/flatpak-artifact.zip"
          linux_dir="$RUNNER_TEMP/devsy-linux"
          flatpak_dir="$RUNNER_TEMP/devsy-flatpak"
          proof_dir="$RUNNER_TEMP/verification-proof"
          mkdir -p "$proof_dir" "$linux_dir" "$flatpak_dir"

          fetch_artifact_zip() {
            local artifact_id="$1"
            local output="$2"
            local headers="$RUNNER_TEMP/artifact-$artifact_id.headers"
            local response="$RUNNER_TEMP/artifact-$artifact_id.response"
            local status
            status=$(curl --silent --show-error \
              --dump-header "$headers" \
              --output "$response" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip")
            if [ "$status" != 302 ]; then
              rm -f "$headers" "$response"
              echo "::error::artifact API did not return a redirect (HTTP $status)"
              return 1
            fi

            local location
            location=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "$headers")
            rm -f "$headers" "$response"
            if [ -z "$location" ]; then
              echo "::error::artifact API redirect did not include a download location"
              return 1
            fi
            if ! curl --location --fail --silent --output "$output" "$location" 2>/dev/null; then
              unset location
              echo "::error::artifact archive transfer failed (URL redacted)"
              return 1
            fi
            unset location
          }

          fetch_artifact_zip "$LINUX_ARTIFACT_ID" "$linux_zip"
          printf '%s  %s\n' "${LINUX_ARTIFACT_DIGEST#sha256:}" "$linux_zip" | sha256sum --check
          fetch_artifact_zip "$FLATPAK_ARTIFACT_ID" "$flatpak_zip"
          printf '%s  %s\n' "${FLATPAK_ARTIFACT_DIGEST#sha256:}" "$flatpak_zip" | sha256sum --check

          unzip -q "$linux_zip" -d "$linux_dir"
          unzip -q "$flatpak_zip" -d "$flatpak_dir"
          test -s "$linux_dir/Devsy_linux_amd64.deb"
          test -s "$linux_dir/Devsy_linux_x86_64.AppImage"
          test -s "$linux_dir/Devsy_linux_x86_64.rpm"
          test -s "$flatpak_dir/Devsy.flatpak"

          deb_sha=$(sha256sum "$linux_dir/Devsy_linux_amd64.deb" | cut -d ' ' -f 1)
          appimage_sha=$(sha256sum "$linux_dir/Devsy_linux_x86_64.AppImage" | cut -d ' ' -f 1)
          rpm_sha=$(sha256sum "$linux_dir/Devsy_linux_x86_64.rpm" | cut -d ' ' -f 1)
          flatpak_sha=$(sha256sum "$flatpak_dir/Devsy.flatpak" | cut -d ' ' -f 1)
          test "$deb_sha" = dd9e5b6780a8fb2264a8a1f53792a7276edbb64906f6396d84a8e592bd743b34
          test "$appimage_sha" = 18dcb8362f7b3ff03538138f0e0715c29e3b484a4f6d0dab8613253ad9b2ebaa
          printf '%s  %s\n' \
            "$deb_sha" "$linux_dir/Devsy_linux_amd64.deb" \
            "$appimage_sha" "$linux_dir/Devsy_linux_x86_64.AppImage" \
            "$rpm_sha" "$linux_dir/Devsy_linux_x86_64.rpm" \
            "$flatpak_sha" "$flatpak_dir/Devsy.flatpak" \
            | tee "$proof_dir/package-sha256.txt"
          jq -n \
            --arg run "$SOURCE_RUN_ID" \
            --arg head "$SOURCE_HEAD_SHA" \
            --arg linuxId "$LINUX_ARTIFACT_ID" \
            --arg linuxDigest "$LINUX_ARTIFACT_DIGEST" \
            --arg flatpakId "$FLATPAK_ARTIFACT_ID" \
            --arg flatpakDigest "$FLATPAK_ARTIFACT_DIGEST" \
            --arg deb "$deb_sha" \
            --arg appimage "$appimage_sha" \
            --arg rpm "$rpm_sha" \
            --arg flatpak "$flatpak_sha" \
            '{source:{runId:$run,head:$head},artifacts:{linux:{id:$linuxId,zipSha256:$linuxDigest},flatpak:{id:$flatpakId,zipSha256:$flatpakDigest}},packages:{deb:{sha256:$deb},appimage:{sha256:$appimage},rpm:{sha256:$rpm},flatpak:{sha256:$flatpak}},scope:"Actual emitted package contents from head 69dad; verified AppImage runtime used only for extraction, application not launched, no native graphical acceptance implied."}' \
            > "$proof_dir/proof.json"

      - name: Install native package verification tools
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cpio desktop-file-utils flatpak ostree rpm unzip

      - name: Set up Go verifier
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify AppImage, DEB and RPM contents
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/verification-proof/linux-package-verification.log") 2>&1
          app_id=sh.devsy.app
          work="$RUNNER_TEMP/linux-package-check"
          linux="$RUNNER_TEMP/devsy-linux"
          rm -rf "$work"
          mkdir -p "$work"

          appimage="$linux/Devsy_linux_x86_64.AppImage"
          deb="$linux/Devsy_linux_amd64.deb"
          rpm="$linux/Devsy_linux_x86_64.rpm"
          mkdir "$work/appimage" && (cd "$work/appimage" && chmod +x "$appimage" && "$appimage" --appimage-extract >/dev/null)
          mkdir "$work/deb" && dpkg-deb -x "$deb" "$work/deb"
          mkdir "$work/rpm" && (cd "$work/rpm" && rpm2cpio "$rpm" | cpio -idm --quiet)

          appimage_root="$work/appimage/squashfs-root"
          go run ./hack/release_artifacts verify-linux-desktop \
            --app-id "$app_id" \
            --desktop-file "$appimage_root/$app_id.desktop" \
            --icon-root "$appimage_root/usr/share/icons/hicolor" \
            --require-file "$appimage_root/resources/app-icon.png" \
            --require-file "$appimage_root/devsy-desktop.png"
          for root in "$work/deb" "$work/rpm"; do
            go run ./hack/release_artifacts verify-linux-desktop \
              --app-id "$app_id" \
              --desktop-file "$root/usr/share/applications/$app_id.desktop" \
              --icon-root "$root/usr/share/icons/hicolor" \
              --require-file "$root/opt/Devsy/resources/app-icon.png"
          done
          desktop-file-validate \
            "$appimage_root/$app_id.desktop" \
            "$work/deb/usr/share/applications/$app_id.desktop" \
            "$work/rpm/usr/share/applications/$app_id.desktop"

      - name: Import and verify Flatpak export
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/verification-proof/flatpak-verification.log") 2>&1
          command -v flatpak ostree desktop-file-validate
          app_id=sh.devsy.app
          work="$RUNNER_TEMP/flatpak-bundle-check"
          rm -rf "$work"
          mkdir -p "$work"
          ostree init --repo="$work/repo" --mode=archive-z2
          flatpak build-import-bundle "$work/repo" "$RUNNER_TEMP/devsy-flatpak/Devsy.flatpak"
          ref=$(ostree refs --repo="$work/repo" | grep "^app/$app_id/" | head -n 1)
          test -n "$ref"
          ostree checkout --repo="$work/repo" --user-mode "$ref" "$work/files"
          export_root="$work/files/export/share"
          go run ./hack/release_artifacts verify-linux-desktop \
            --app-id "$app_id" \
            --desktop-file "$export_root/applications/$app_id.desktop" \
            --icon-root "$export_root/icons/hicolor"
          test -s "$export_root/icons/hicolor/128x128/apps/$app_id.png"
          desktop-file-validate "$export_root/applications/$app_id.desktop"
      - name: Upload bounded verification proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devsy-1652-artifact-verification-proof
          path: ${{ runner.temp }}/verification-proof/
          if-no-files-found: warn
          retention-days: 7
