name: Netlify Docs Preview Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose-netlify-preview:
    name: Diagnose failed Netlify docs preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout diagnostic branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch bounded deployment metadata and logs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: efb50055-f8d7-4150-9801-496da6d46bd8
          NETLIFY_DEPLOY_ID: 6adf6c182569d945284011d8
          NETLIFY_BUILD_ID: 6adf6c182569d945284011d6
          EXPECTED_COMMIT: 1c379a765070858a6912eeecfcbfec87d484c489
          EXPECTED_CONTEXT: deploy-preview
          EXPECTED_PR_NUMBER: "1725"
          EXPECTED_SITE_NAME: devsydev
        run: node .github/scripts/netlify-preview-diagnostic.mjs

      - name: Upload one sanitized diagnostic artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: netlify-docs-preview-diagnostic
          path: ${{ runner.temp }}/netlify-preview-diagnostic.jsonl
          if-no-files-found: error
          retention-days: 2
