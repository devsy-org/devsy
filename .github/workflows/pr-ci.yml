          python3 - "$proof_dir/proof.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          proof_path = Path(sys.argv[1])
          proof = json.loads(proof_path.read_text())
          candidates = proof.get("windowCandidates", {})
          windows = proof.get("verifiedWindows", {})
          errors = []

          def valid_window(window):
              return (
                  window.get("wmClass") == "sh.devsy.app" and window.get("title") == "Devsy" and
                  window.get("isHidden") is False and window.get("clientType") in (0, 1) and
                  isinstance(window.get("width"), int) and window["width"] > 0 and
                  isinstance(window.get("height"), int) and window["height"] > 0
              )

          default_candidates = candidates.get("wayland-default", [])
          default_windows = windows.get("wayland-default", [])
          if len(default_candidates) != 1 or len(default_windows) != 1 or \
             default_candidates[0] != default_windows[0] or not valid_window(default_windows[0]):
              errors.append("default Wayland candidate was not uniquely linked to the exact Devsy WM_CLASS/title and AppImage process")
              default_type = None
          else:
              default_type = default_windows[0]["clientType"]
          required = ["wayland-default", "x11"]
          if default_type == 1:
              required.append("wayland-forced")
              if not any(valid_window(item) and item.get("clientType") == 0 for item in windows.get("wayland-forced", [])):
                  errors.append("default X11-on-Wayland candidate was not followed by verified forced Wayland client type 0")
          elif default_type != 0:
              errors.append("default Wayland client type was not 0 or 1")
          if not any(valid_window(item) and item.get("clientType") == 1 for item in windows.get("x11", [])):
              errors.append("no verified X11 client window was observed")

          readiness = {}
          for backend in ("wayland", "x11"):
              path = proof_path.with_name(f"{backend}-shell-readiness.json")
              if not path.is_file():
                  errors.append(f"{backend} GNOME readiness proof is missing")
                  continue
              state = json.loads(path.read_text())
              readiness[backend] = state
              if not state.get("startupComplete") or not state.get("getWindowsSucceeded") or \
                 state.get("dbusOwnerPid") != state.get("shell", {}).get("pid") or \
                 not state.get("unsafeModeArgumentObserved"):
                  errors.append(f"{backend} GNOME unsafe-mode, D-Bus owner, startup, or GetWindows preflight failed")
          proof["gnomeReadiness"] = readiness
          cleanup_files = [
              "gnome-wayland-shell-cleanup.json",
              "gnome-x11-shell-cleanup.json",
              "wayland-default-process-before-cleanup.json",
              "x11-process-cleanup.json",
          ]
          if default_type == 1:
              cleanup_files.append("wayland-forced-process-before-cleanup.json")
          for filename in cleanup_files:
              path = proof_path.with_name(filename)
              if not path.is_file():
                  errors.append(f"owned process cleanup proof is missing: {filename}")
                  continue
              state = json.loads(path.read_text())
              if state.get("survivors") or state.get("remainingTree"):
                  errors.append(f"owned processes survived cleanup: {filename}")

          expected_hash = proof["appimage"]["sha256"]
          provenance = []
          linkages = {}
          for backend in required:
              candidates_for_backend = candidates.get(backend, [])
              observed = windows.get(backend, [])
              if len(candidates_for_backend) != 1 or len(observed) != 1 or \
                 candidates_for_backend[0] != observed[0] or not valid_window(observed[0]):
                  errors.append(f"{backend} candidate was not linked to the exact Devsy WM_CLASS/title and AppImage process")
                  continue
              screenshot = "wayland-default.png" if backend == "wayland-default" else \
                  "wayland-forced.png" if backend == "wayland-forced" else "x11.png"
              if not proof_path.with_name(screenshot).is_file():
                  errors.append(f"{backend} screenshot is missing")
              before_link_path = proof_path.with_name(f"{backend}-screenshot-before-link.json")
              after_link_path = proof_path.with_name(f"{backend}-screenshot-after-link.json")
              if not before_link_path.is_file() or not after_link_path.is_file():
                  errors.append(f"{backend} same-window screenshot linkage is missing")
                  continue
              before_link = json.loads(before_link_path.read_text())
              after_link = json.loads(after_link_path.read_text())
              if before_link != after_link:
                  errors.append(f"{backend} MetaWindow/AppImage PID identity changed around screenshot")
                  continue
              linkages[backend] = after_link

              before_path = proof_path.with_name(f"{backend}-process-before.json")
              after_path = proof_path.with_name(f"{backend}-process-after.json")
              if not before_path.is_file() or not after_path.is_file():
                  errors.append(f"{backend} is missing a before/after process snapshot")
                  continue
              before = json.loads(before_path.read_text())
              after = json.loads(after_path.read_text())
              before_root = next((item for item in before["processes"] if item["pid"] == before["rootPid"]), None)
              after_root = next((item for item in after["processes"] if item["pid"] == after["rootPid"]), None)
              same_process = bool(
                  before_root and after_root and
                  before["rootPid"] == after["rootPid"] and
                  before["rootStartTicks"] == after["rootStartTicks"] and
                  before_root["exe"] == after_root["exe"] and
                  before_root["exeSha256"] == after_root["exeSha256"] and
                  before_root["mount"] == after_root["mount"] and
                  before_root["appImageSha256"] == expected_hash and
                  after_root["appImageSha256"] == expected_hash
              )
              unexpected_app_processes = [
                  item for item in after["processes"]
                  if Path(item.get("exe", "")).name in {"devsy", "devsy-desktop"} and
                  item.get("appImageSha256") != expected_hash
              ]
              record = {
                  "backend": backend,
                  "windowIdentity": observed[0],
                  "windowPidLinkage": after_link,
                  "rootPid": after.get("rootPid"),
                  "rootStartTicks": after.get("rootStartTicks"),
                  "rootExecutable": after_root.get("exe") if after_root else None,
                  "rootExecutableSha256": after_root.get("exeSha256") if after_root else None,
                  "mount": after_root.get("mount") if after_root else None,
                  "appImageSha256": after_root.get("appImageSha256") if after_root else None,
                  "sameAppImageProcessBeforeAndAfterWindow": same_process,
                  "unexpectedDevsyProcesses": unexpected_app_processes,
              }
              provenance.append(record)
              if not same_process or unexpected_app_processes:
                  errors.append(f"{backend} process tree changed or contains a non-D485 Devsy process")
          proof["windowPidLinkage"] = linkages
          proof["windowProcessProvenance"] = provenance
          if errors:
              proof["sessionResult"] = "observed_with_acceptance_failures"
              proof["acceptanceErrors"] = errors
              proof["scope"] = "Raw GNOME candidates were retained separately; one or more exact WM_CLASS/title, MetaWindow PID, screenshot, readiness, or D485 AppImage-provenance checks failed."
              proof_path.write_text(json.dumps(proof, indent=2) + "\n")
              raise SystemExit("; ".join(errors))
          proof["sessionResult"] = "passed"
          proof["scope"] = "Exact Devsy WM_CLASS/title GNOME candidates were attributed only after their GetWindows IDs linked to MetaWindow PID/client-type/geometry and the audited D485 AppImage process tree before and after screenshots. GNOME app-id is retained as observed metadata, not standalone identity evidence. MetaWindow PID is corroborating fixture evidence, not cryptographic attestation. Software-rendered feasibility only; not the complete T4 Add/Remove/move/update acceptance matrix."
          proof_path.write_text(json.dumps(proof, indent=2) + "\n")
          PY
          printf 'GNOME feasibility: exact AppImage and same-window PID linkage observed in isolated GNOME sessions; software-rendered feasibility only.\n' \
            | tee "$proof_dir/result.txt"

      - name: Upload bounded GNOME feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devsy-1652-gnome-feasibility
          path: ${{ runner.temp }}/gnome-feasibility-proof/
          if-no-files-found: warn
          retention-days: 7
