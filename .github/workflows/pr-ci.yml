name: Pull Request

# Disposable diagnostic branch only. This workflow is dispatch-only and is never merged.
on:
  workflow_dispatch:

permissions: {}

jobs:
  gnome-appimage-feasibility:
    name: Launch the final-head AppImage in isolated GNOME sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: "40320261347"
      SOURCE_HEAD_SHA: "d485425ea9a6202a0024678511c64fa80cecdc87"
      LINUX_ARTIFACT_ID: "12648983963"
      LINUX_ARTIFACT_DIGEST: "sha256:13eb34d933bd0e9f32a13db3d954a54f632dde91a1fbdd3feed65a18a70ac916"
    steps:
      - name: Checkout exact source used for the AppImage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d485425ea9a6202a0024678511c64fa80cecdc87
          persist-credentials: false

      - name: Verify source run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/diag/1652-artifact-verification-69dad
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e \
            --argjson id "$SOURCE_RUN_ID" \
            --arg sha "$SOURCE_HEAD_SHA" \
            '.id == $id and .head_sha == $sha and .event == "pull_request" and .conclusion == "success"' \
            <<<"$run"

          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          jq -e \
            --argjson id "$LINUX_ARTIFACT_ID" \
            --arg digest "$LINUX_ARTIFACT_DIGEST" \
            'any(.artifacts[]; .id == $id and .name == "desktop-ubuntu-latest" and .digest == $digest and .expired == false)' \
            <<<"$artifacts"

      - name: Download and verify the exact Linux artifact once
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/linux-artifact.zip"
          artifact_dir="$RUNNER_TEMP/devsy-linux"
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          mkdir -p "$artifact_dir" "$proof_dir"
          headers="$RUNNER_TEMP/artifact.headers"
          response="$RUNNER_TEMP/artifact.response"
          status=$(curl --silent --show-error \
            --dump-header "$headers" \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LINUX_ARTIFACT_ID/zip")
          if [ "$status" != 302 ]; then
            rm -f "$headers" "$response"
            echo "::error::artifact API did not return a redirect (HTTP $status)"
            exit 1
          fi
          location=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "$headers")
          rm -f "$headers" "$response"
          if [ -z "$location" ]; then
            echo "::error::artifact API redirect did not include a download location"
            exit 1
          fi
          if ! curl --location --fail --silent --output "$artifact_zip" "$location" 2>/dev/null; then
            unset location
            echo "::error::artifact archive transfer failed (URL redacted)"
            exit 1
          fi
          unset location GH_TOKEN
          printf '%s  %s\n' "${LINUX_ARTIFACT_DIGEST#sha256:}" "$artifact_zip" | sha256sum --check
          unzip -q "$artifact_zip" -d "$artifact_dir"
          appimage="$artifact_dir/Devsy_linux_x86_64.AppImage"
          test -s "$appimage"
          appimage_sha=$(sha256sum "$appimage" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$appimage_sha" "$appimage" | tee "$proof_dir/appimage-sha256.txt"
          jq -n \
            --arg run "$SOURCE_RUN_ID" \
            --arg head "$SOURCE_HEAD_SHA" \
            --arg artifact "$LINUX_ARTIFACT_ID" \
            --arg zipDigest "$LINUX_ARTIFACT_DIGEST" \
            --arg appimage "$appimage_sha" \
            '{source:{runId:$run,head:$head},artifact:{id:$artifact,zipSha256:$zipDigest},appimage:{member:"Devsy_linux_x86_64.AppImage",sha256:$appimage},launchAttempts:[],windowCandidates:{},verifiedWindows:{},windowPidLinkage:{},sessionResult:"not_started",scope:"Exact D485 AppImage artifact integrity verified; no application launch or GNOME window candidate observed yet."}' \
            > "$proof_dir/proof.json"

      - name: Preflight GNOME package size before installing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          packages=(dbus-daemon gnome-shell gnome-screenshot libfuse2t64 mesa-utils x11-utils xdotool xwayland xvfb)
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          plan="$proof_dir/apt-plan.log"
          selected_file="$proof_dir/apt-selected-packages.txt"
          update_log="$proof_dir/apt-update.log"
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update 2>&1 | tee "$update_log"
          if grep -Eq '^(Err:|W:|E:)' "$update_log"; then
            echo "::error::APT update reported repository errors; refusing to use stale or partial package indexes"
            exit 1
          fi
          apt-get -s --no-install-recommends install "${packages[@]}" > "$plan"
          grep -E '^[0-9]+ upgraded,' "$plan"
          : > "$selected_file"
          declare -A selected_packages=()
          download_bytes=0
          installed_kib=0
          while read -r package version; do
            [ -n "$package" ] || continue
            if [[ -n "${selected_packages[$package]+x}" ]]; then
              echo "::error::APT simulation selected $package more than once"
              exit 1
            fi
            selected_packages["$package"]=1
            metadata=$(apt-cache show "$package=$version")
            sizes=$(printf '%s\n' "$metadata" | awk -v wanted_version="$version" '
              BEGIN { RS = ""; FS = "\n" }
              {
                paragraphs++
                versions = downloads = installs = 0
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^Version: /) {
                    actual_version = $i
                    sub(/^Version: /, "", actual_version)
                    versions++
                  } else if ($i ~ /^Size: /) {
                    download = $i
                    sub(/^Size: /, "", download)
                    downloads++
                  } else if ($i ~ /^Installed-Size: /) {
                    installed = $i
                    sub(/^Installed-Size: /, "", installed)
                    installs++
                  }
                }
              }
              END {
                if (paragraphs == 1 && versions == 1 && actual_version == wanted_version &&
                    downloads == 1 && installs == 1 &&
                    download ~ /^[0-9]+$/ && installed ~ /^[0-9]+$/)
                  print download, installed
              }')
            read -r package_bytes package_kib <<< "$sizes"
            if ! [[ "$package_bytes" =~ ^[0-9]+$ && "$package_kib" =~ ^[0-9]+$ ]]; then
              echo "::error::missing or ambiguous exact size metadata for $package=$version"
              exit 1
            fi
            printf '%s=%s\n' "$package" "$version" >> "$selected_file"
            download_bytes=$((download_bytes + package_bytes))
            installed_kib=$((installed_kib + package_kib))
          done < <(awk '$1 == "Inst" { package=$2; version=$3; if (version ~ /^\[/) version=$4; gsub(/[\[\]()]/, "", version); print package, version }' "$plan")
          planned_packages=${#selected_packages[@]}
          installed_bytes=$((installed_kib * 1024))
          printf 'APT preflight: planned_packages=%s download_bytes=%s installed_bytes=%s\n' \
            "$planned_packages" "$download_bytes" "$installed_bytes" \
            | tee "$proof_dir/size-preflight.txt"
          if (( planned_packages == 0 )); then
            echo "::error::APT simulation selected no packages; refusing an unbounded or empty GNOME install"
            exit 1
          fi
          if (( download_bytes == 0 )); then
            echo "::error::APT archive sizes are missing; refusing install"
            exit 1
          fi
          if (( download_bytes > 536870912 || installed_bytes > 2147483648 )); then
            echo "::error::GNOME probe dependencies exceed the 512 MiB download or 2 GiB installed-size cap"
            exit 1
          fi

      - name: Probe the selected package on Ubuntu archive endpoints
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          selected_file="$proof_dir/apt-selected-packages.txt"
          package="libjavascriptcoregtk-6.0-1"
          : >"$proof_dir/archive-probe.txt"
          policy_exit=0
          apt-cache policy "$package" \
            >"$proof_dir/apt-cache-policy.stdout.txt" \
            2>"$proof_dir/apt-cache-policy.stderr.txt" || policy_exit=$?
          printf 'apt_cache_policy_exit=%s\n' "$policy_exit" >>"$proof_dir/archive-probe.txt"
          source_files="$proof_dir/apt-source-files.txt"
          : >"$source_files"
          for source_path in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            source_name=${source_path##*/}
            if [[ -r "$source_path" ]]; then
              copy_exit=0
              cp "$source_path" "$proof_dir/$source_name" 2>"$proof_dir/$source_name.copy.stderr.txt" || copy_exit=$?
              printf '%s status=present copy_exit=%s\n' "$source_path" "$copy_exit" >>"$source_files"
            else
              printf '%s status=unavailable\n' "$source_path" >>"$source_files"
            fi
          done
          version_exit=0
          version=$(awk -F= -v package="$package" '$1 == package { count++; value=substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1; print value }' "$selected_file") || version_exit=$?
          printf 'selected_version_exit=%s\n' "$version_exit" >>"$proof_dir/archive-probe.txt"
          if (( version_exit != 0 )) || [[ -z "$version" ]]; then
            echo "::error::Selected package version is missing or ambiguous for $package"
            exit 1
          fi
          metadata_file="$proof_dir/apt-package-metadata.stdout.txt"
          metadata_exit=0
          apt-cache show "$package=$version" >"$metadata_file" 2>"$proof_dir/apt-package-metadata.stderr.txt" || metadata_exit=$?
          printf 'apt_cache_show_exit=%s\n' "$metadata_exit" >>"$proof_dir/archive-probe.txt"
          if (( metadata_exit != 0 )); then
            echo "::error::APT metadata lookup failed for $package=$version; see captured stdout/stderr and exit status."
            exit 1
          fi
          metadata_parse_exit=0
          record=$(awk -v wanted_package="$package" -v wanted_version="$version" '
            BEGIN { RS = ""; FS = "\n" }
            {
              stanzas++
              package_count = version_count = size_count = filename_count = hash_count = 0
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^Package: /) { actual_package = $i; sub(/^Package: /, "", actual_package); package_count++ }
                else if ($i ~ /^Version: /) { actual_version = $i; sub(/^Version: /, "", actual_version); version_count++ }
                else if ($i ~ /^Size: /) { size = $i; sub(/^Size: /, "", size); size_count++ }
                else if ($i ~ /^Filename: /) { filename = $i; sub(/^Filename: /, "", filename); filename_count++ }
                else if ($i ~ /^SHA256: /) { sha256 = $i; sub(/^SHA256: /, "", sha256); hash_count++ }
              }
            }
            END {
              if (stanzas == 1 && package_count == 1 && actual_package == wanted_package &&
                  version_count == 1 && actual_version == wanted_version && size_count == 1 &&
                  filename_count == 1 && hash_count == 1 && size ~ /^[0-9]+$/ && size + 0 > 0 &&
                  filename ~ /^pool\/[A-Za-z0-9._\/+:-]+\.deb$/ &&
                  length(sha256) == 64 && sha256 !~ /[^[:xdigit:]]/)
                print filename, size, tolower(sha256)
              else
                exit 1
            }' "$metadata_file" 2>"$proof_dir/apt-package-metadata-parser.stderr.txt") || metadata_parse_exit=$?
          printf 'metadata_parser_exit=%s\n' "$metadata_parse_exit" >>"$proof_dir/archive-probe.txt"
          if (( metadata_parse_exit != 0 )) || [[ -z "$record" ]]; then
            echo "::error::APT metadata is missing, duplicated, or invalid for $package=$version; see captured metadata and parser diagnostics."
            exit 1
          fi
          read -r filename expected_size expected_sha256 <<< "$record"
          max_bytes=8388608
          printf 'package=%s\nversion=%s\nsize=%s\nfilename=%s\nsha256=%s\nprobe_endpoint_name=azure-http\nprobe_endpoint_url=http://azure.archive.ubuntu.com/ubuntu\n' \
            "$package" "$version" "$expected_size" "$filename" "$expected_sha256" \
            >>"$proof_dir/archive-probe.txt"
          if (( expected_size > max_bytes )); then
            echo "::error::Selected $package=$version exceeds the 8 MiB mirror-probe limit"
            exit 1
          fi
          temp_dir=$(mktemp -d "$RUNNER_TEMP/archive-probe.XXXXXX")
          trap 'rm -rf "$temp_dir"' EXIT
          region=$(curl --fail --silent --show-error --noproxy '*' --connect-timeout 1 --max-time 2 --max-filesize 64 \
            -H 'Metadata:true' -H 'Accept:text/plain' \
            'http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text' \
            2>/dev/null || true)
          if [[ "$region" =~ ^[a-z0-9-]{1,32}$ ]]; then
            printf 'runner_region=%s\n' "$region" >>"$proof_dir/archive-probe.txt"
          else
            printf 'runner_region=unavailable\n' >>"$proof_dir/archive-probe.txt"
          fi
          for host in azure.archive.ubuntu.com archive.ubuntu.com; do
            dns_file="$temp_dir/$host.dns"
            dns_status=0
            timeout --signal=TERM --kill-after=1s 5s getent ahosts "$host" >"$dns_file" 2>/dev/null || dns_status=$?
            if (( dns_status == 0 )); then
              addresses=$(awk '!seen[$1]++ { printf "%s%s", separator, $1; separator="," } END { print "" }' "$dns_file")
              if [[ -n "$addresses" ]]; then
                printf '%s_dns_ips=%s\n%s_dns_status=ok\n' "$host" "$addresses" "$host" >>"$proof_dir/archive-probe.txt"
              else
                printf '%s_dns_status=no_addresses\n' "$host" >>"$proof_dir/archive-probe.txt"
              fi
            else
              printf '%s_dns_status=failed_%s\n' "$host" "$dns_status" >>"$proof_dir/archive-probe.txt"
            fi
          done
          probe() {
            name=$1
            url=$2
            file="$temp_dir/$name.deb"
            metrics="$proof_dir/$name-metrics.txt"
            curl_exit=0
            curl --fail --silent --show-error --location --max-redirs 5 --retry 0 \
              --connect-timeout 5 --max-time 20 --max-filesize "$max_bytes" \
              --proto '=http,https' --proto-redir '=http,https' \
              --output "$file" \
              --write-out 'http_status=%{http_code}\neffective_url=%{url_effective}\nremote_ip=%{remote_ip}\ntime_total=%{time_total}\nsize_download=%{size_download}\n' \
              "$url" >"$metrics" 2>"$proof_dir/$name-curl-error.txt" || curl_exit=$?
            printf 'curl_exit=%s\n' "$curl_exit" >>"$metrics"
            if (( curl_exit != 0 )) || [[ ! -f "$file" ]]; then
              printf 'verified=false\n' >>"$metrics"
              return 1
            fi
            actual_size=$(stat -c '%s' "$file")
            actual_sha256=$(sha256sum "$file")
            actual_sha256=${actual_sha256%% *}
            printf 'actual_size=%s\nactual_sha256=%s\n' "$actual_size" "$actual_sha256" >>"$metrics"
            if [[ "$actual_size" == "$expected_size" && "$actual_sha256" == "$expected_sha256" ]]; then
              printf 'verified=true\n' >>"$metrics"
              return 0
            fi
            printf 'verified=false\n' >>"$metrics"
            return 1
          }
          azure_ok=0
          official_ok=0
          probe azure-http "http://azure.archive.ubuntu.com/ubuntu/$filename" || azure_ok=$?
          probe official-https "https://archive.ubuntu.com/ubuntu/$filename" || official_ok=$?
          if (( azure_ok == 0 )); then
            printf 'result=azure_package_matches_signed_index\n' >>"$proof_dir/archive-probe.txt"
            exit 0
          fi
          if (( official_ok == 0 )); then
            printf 'result=azure_failed_official_package_matches_signed_index\n' >>"$proof_dir/archive-probe.txt"
            echo "::error::Azure package probe failed but official archive served the indexed bytes; stopping before APT install rather than switching the repository source."
          else
            printf 'result=both_package_probes_failed_or_mismatched\n' >>"$proof_dir/archive-probe.txt"
            echo "::error::Neither bounded package probe verified the bytes; stopping before APT install."
          fi
          exit 1

      - name: Install bounded GNOME probe dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          mapfile -t selected_specs < "$proof_dir/apt-selected-packages.txt"
          if ((${#selected_specs[@]})); then
            sudo apt-get install --no-install-recommends -y "${selected_specs[@]}"
          fi
          printf 'Selected exact APT package versions:\n'
          cat "$proof_dir/apt-selected-packages.txt"
          printf 'Installed package versions:\n' > "$proof_dir/installed-package-versions.txt"
          for spec in "${selected_specs[@]}"; do
            package="${spec%%=*}"
            selected_version="${spec#*=}"
            actual_version=$(dpkg-query -W -f="\${Version}" "$package")
            test "$actual_version" = "$selected_version"
            printf '%s=%s\n' "$package" "$actual_version" \
              | tee -a "$proof_dir/installed-package-versions.txt"
          done
          gnome-shell --version | tee "$proof_dir/gnome-versions.txt"
          dpkg-query -W -f="\${binary:Package} \${Version}\n" 'mutter*' | tee -a "$proof_dir/gnome-versions.txt"
      - name: Launch AppImage in isolated Wayland and X11 GNOME sessions
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          appimage="$RUNNER_TEMP/devsy-linux/Devsy_linux_x86_64.AppImage"
          profile="$RUNNER_TEMP/gnome-profile"
          mkdir -p "$profile"
          chmod +x "$appimage"
          export APPIMAGE_PATH="$appimage" PROOF_DIR="$proof_dir" VERIFY_WINDOW_SCRIPT="$proof_dir/verify-window.py"
          export HOME="$profile/home"
          export XDG_CONFIG_HOME="$profile/config"
          export XDG_DATA_HOME="$profile/data"
          export XDG_CACHE_HOME="$profile/cache"
          export XDG_STATE_HOME="$profile/state"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=swrast
          cat > "$proof_dir/verify-window.py" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          EXPECTED_WM_CLASS = "sh.devsy.app"
          EXPECTED_TITLE = "Devsy"

          def parse_candidates(text, expected_type="any"):
              blocks = re.findall(r"uint64\s+(\d+)\s*:\s*\{([^{}]*)\}", text, re.S)

              def property_value(block, key):
                  match = re.search(rf"['\"]?{re.escape(key)}['\"]?\s*:\s*<([^>]*)>", block)
                  return match.group(1).strip() if match else ""

              candidates = []
              for window_id, block in blocks:
                  title = property_value(block, "title").strip("'\"")
                  app_id = property_value(block, "app-id").strip("'\"")
                  wm_class = property_value(block, "wm-class").strip("'\"")
                  client_type_match = re.search(r"(?:u?int\d+)\s+(\d+)", property_value(block, "client-type"))
                  hidden = property_value(block, "is-hidden")
                  dimensions = {}
                  for key in ("width", "height"):
                      match = re.search(r"(?:u?int\d+)\s+(\d+)", property_value(block, key))
                      if match:
                          dimensions[key] = int(match.group(1))
                  if not client_type_match or title != EXPECTED_TITLE or wm_class != EXPECTED_WM_CLASS:
                      continue
                  client_type = int(client_type_match.group(1))
                  if client_type not in (0, 1) or (expected_type != "any" and client_type != int(expected_type)):
                      continue
                  if hidden != "false" or dimensions.get("width", 0) <= 0 or dimensions.get("height", 0) <= 0:
                      continue
                  candidates.append({
                      "windowId": window_id,
                      "title": title,
                      "appId": app_id,
                      "wmClass": wm_class,
                      "clientType": client_type,
                      "isHidden": False,
                      **dimensions,
                  })
              return candidates

          if len(sys.argv) > 1 and sys.argv[1] == "--self-test":
              actual = """({uint64 44739516: {'app-id': <'window:1'>, 'client-type': <uint32 1>, 'is-hidden': <false>, 'has-focus': <false>, 'width': <uint32 1000>, 'height': <uint32 737>, 'title': <'Devsy'>, 'wm-class': <'sh.devsy.app'>}},)"""
              candidate = parse_candidates(actual)
              assert len(candidate) == 1
              assert candidate[0] == {
                  "windowId": "44739516", "title": "Devsy", "appId": "window:1",
                  "wmClass": "sh.devsy.app", "clientType": 1, "isHidden": False,
                  "width": 1000, "height": 737,
              }
              assert parse_candidates(actual, "0") == []
              assert len(parse_candidates(actual.replace("<uint32 1>", "<uint32 0>"), "0")) == 1
              assert parse_candidates(actual.replace("sh.devsy.app", "other.app")) == []
              assert parse_candidates(actual.replace("'Devsy'", "'Other'")) == []
              assert parse_candidates(actual.replace("<false>", "<true>")) == []
              assert parse_candidates(actual.replace("<uint32 1000>", "<uint32 0>")) == []
              assert parse_candidates(actual.replace("<uint32 1>", "<uint32 2>")) == []
              arbitrary_id_only = actual.replace("window:1", "window:999").replace("sh.devsy.app", "other.app")
              assert parse_candidates(arbitrary_id_only) == []
              print("candidate fixtures passed: actual window:1 record is only a candidate; wrong class/title, hidden, invalid geometry/type, and arbitrary window-id-only records rejected")
              raise SystemExit(0)
          if len(sys.argv) > 1 and sys.argv[1] == "--attempt":
              backend = sys.argv[2]
              proof_path = Path(sys.argv[3])
              proof = json.loads(proof_path.read_text())
              proof.setdefault("launchAttempts", []).append(backend)
              proof["sessionResult"] = "appimage_launch_attempted"
              proof["scope"] = f"Exact AppImage process start attempted for {backend}; window candidate not yet observed."
              temporary = proof_path.with_suffix(".tmp")
              temporary.write_text(json.dumps(proof, indent=2) + "\n")
              temporary.replace(proof_path)
              raise SystemExit(0)

          if len(sys.argv) != 5:
              raise SystemExit("usage: verify-window.py OUTPUT EXPECTED_TYPE BACKEND PROOF_JSON")
          output_path = Path(sys.argv[1])
          expected_type = sys.argv[2]
          backend = sys.argv[3]
          proof_path = Path(sys.argv[4])
          candidates = parse_candidates(output_path.read_text(), expected_type)
          identity = {"candidateWindows": candidates}
          identity_path = proof_path.with_name(f"{backend}-window-identity.json")
          identity_path.write_text(json.dumps(identity, indent=2) + "\n")
          proof = json.loads(proof_path.read_text())
          proof.setdefault("windowCandidates", {})[backend] = candidates
          if len(candidates) == 1:
              proof["sessionResult"] = "candidate_observed_unattributed"
              proof["scope"] = f"Raw GNOME window candidate observed in private {backend} session; PID and exact-AppImage attribution pending."
          elif candidates:
              proof["sessionResult"] = "ambiguous_window_candidates"
              proof["scope"] = f"Multiple raw GNOME window candidates observed in private {backend} session; exact-AppImage attribution was not attempted."
          else:
              proof["sessionResult"] = "no_exact_window_candidate"
              proof["scope"] = f"No exact Devsy WM_CLASS/title candidate appeared in private {backend} GetWindows output."
          temporary = proof_path.with_suffix(".tmp")
          temporary.write_text(json.dumps(proof, indent=2) + "\n")
          temporary.replace(proof_path)
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one exact-WM_CLASS/title candidate, observed {len(candidates)}")
          print(json.dumps(identity, sort_keys=True))
          PY
          cat > "$proof_dir/verify-window-link.py" <<'PY'
          import ast
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          EVAL_CODE = "global.get_window_actors().map(a => { const w = a.meta_window; const r = w.get_frame_rect(); return [w.get_id(), w.get_pid(), w.get_client_type(), r.x, r.y, r.width, r.height]; })"
          IDENTITY_FIELDS = ("pid", "startTicks", "uid", "exe", "exeSha256", "mount", "appImagePath", "appImageSha256")
          EXPECTED_APPIMAGE = "Devsy_linux_x86_64.AppImage"
          EXPECTED_EXECUTABLE = "devsy-desktop"
          EXPECTED_WM_CLASS = "sh.devsy.app"
          EXPECTED_TITLE = "Devsy"

          def exact_app_process(record, expected_hash):
              mount = record.get("mount") or {}
              exe = Path(record.get("exe", ""))
              appimage_path = Path(record.get("appImagePath", ""))
              mountpoint = Path(mount.get("mountpoint", ""))
              exe_hash = record.get("exeSha256", "")
              return (
                  record.get("pid", 0) > 0 and record.get("startTicks", 0) > 0 and
                  record.get("uid") == os.getuid() and exe.name == EXPECTED_EXECUTABLE and
                  re.fullmatch(r"[0-9a-f]{64}", exe_hash) is not None and
                  mountpoint.is_absolute() and exe.parent == mountpoint and
                  mount.get("filesystem") == f"fuse.{EXPECTED_APPIMAGE}" and
                  mount.get("source") == EXPECTED_APPIMAGE and
                  appimage_path.is_absolute() and appimage_path.name == EXPECTED_APPIMAGE and
                  record.get("appImageSha256") == expected_hash
              )

          def linked_record(window, meta, before, after, expected_hash):
              if window.get("wmClass") != EXPECTED_WM_CLASS or window.get("title") != EXPECTED_TITLE:
                  raise ValueError("candidate is not the exact Devsy WM_CLASS/title")
              if str(meta[0]) != window["windowId"]:
                  raise ValueError("MetaWindow id differs from the GetWindows candidate id")
              if int(meta[1]) <= 0 or int(meta[2]) != window["clientType"]:
                  raise ValueError("MetaWindow PID or client type is invalid")
              if int(meta[5]) != window.get("width") or int(meta[6]) != window.get("height"):
                  raise ValueError("MetaWindow geometry differs from GetWindows geometry")
              if window.get("isHidden") is not False or int(meta[5]) <= 0 or int(meta[6]) <= 0:
                  raise ValueError("Devsy candidate is hidden or has empty geometry")
              pid = int(meta[1])
              records = []
              for snapshot in (before, after):
                  record = next((item for item in snapshot["processes"] if item["pid"] == pid), None)
                  if not record or not exact_app_process(record, expected_hash):
                      raise ValueError("MetaWindow PID is not owned by the exact mounted D485 AppImage process")
                  records.append(record)
              if any(records[0].get(key) != records[1].get(key) for key in IDENTITY_FIELDS):
                  raise ValueError("MetaWindow PID/start/UID/executable/mount/AppImage identity changed around screenshot")
              return {
                  "windowId": window["windowId"],
                  "appId": window["appId"],
                  "title": window["title"],
                  "wmClass": window["wmClass"],
                  "clientType": window["clientType"],
                  "isHidden": window["isHidden"],
                  "width": window["width"],
                  "height": window["height"],
                  "metaWindow": {"pid": pid, "clientType": int(meta[2]), "x": int(meta[3]),
                                 "y": int(meta[4]), "width": int(meta[5]), "height": int(meta[6])},
                  "appProcess": {key: records[1].get(key) for key in IDENTITY_FIELDS},
              }
          def attribution_matches(window, linked, expected_hash):
              if any(linked.get(key) != window.get(key) for key in
                     ("windowId", "appId", "title", "wmClass", "clientType", "isHidden", "width", "height")):
                  return False
              meta = linked.get("metaWindow") or {}
              process = linked.get("appProcess") or {}
              return (
                  meta.get("pid", 0) > 0 and meta.get("pid") == process.get("pid") and
                  meta.get("clientType") == window.get("clientType") and
                  meta.get("width") == window.get("width") and
                  meta.get("height") == window.get("height") and
                  exact_app_process(process, expected_hash)
              )

          def parse_tuple(raw):
              match = re.fullmatch(r"\((true|false),\s*('.*')\)", raw.strip())
              if not match:
                  raise ValueError(f"unexpected GNOME Eval result: {raw}")
              return match.group(1) == "true", ast.literal_eval(match.group(2))

          def call(*args):
              result = subprocess.run(["gdbus", "call", "--session", *args], text=True,
                                      capture_output=True, check=True, timeout=10)
              return result.stdout.strip()
          def meta_window_snapshot(backend, candidate_id, proof_dir, capture_label):
              base = Path(proof_dir) / f"{capture_label}-metawindow-eval"
              command = ["gdbus", "call", "--session", "--dest", "org.gnome.Shell",
                         "--object-path", "/org/gnome/Shell", "--method", "org.gnome.Shell.Eval",
                         EVAL_CODE]
              try:
                  result = subprocess.run(command, text=True, capture_output=True, timeout=10)
              except subprocess.TimeoutExpired as error:
                  stdout = error.stdout.decode(errors="replace") if isinstance(error.stdout, bytes) else (error.stdout or "")
                  stderr = error.stderr.decode(errors="replace") if isinstance(error.stderr, bytes) else (error.stderr or "")
                  (base.parent / f"{base.name}-stdout.txt").write_text(stdout)
                  (base.parent / f"{base.name}-stderr.txt").write_text(stderr)
                  (base.parent / f"{base.name}-decode.json").write_text(json.dumps({
                      "backend": backend, "capture": capture_label, "candidateWindowId": candidate_id,
                      "method": "org.gnome.Shell.Eval", "objectPath": "/org/gnome/Shell",
                      "expression": EVAL_CODE, "returnCode": None, "timedOut": True,
                      "decodedType": None, "decodedRows": None,
                  }, indent=2) + "\n")
                  raise SystemExit("GNOME Shell MetaWindow Eval timed out")
              (base.parent / f"{base.name}-stdout.txt").write_text(result.stdout)
              (base.parent / f"{base.name}-stderr.txt").write_text(result.stderr)
              diagnostic = {
                  "backend": backend, "capture": capture_label,
                  "candidateWindowId": candidate_id,
                  "method": "org.gnome.Shell.Eval", "objectPath": "/org/gnome/Shell",
                  "expression": EVAL_CODE, "returnCode": result.returncode, "evalSucceeded": None,
                  "decodedType": None, "decodedRows": None,
              }
              if result.returncode:
                  (base.parent / f"{base.name}-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
                  raise SystemExit(f"GNOME Shell MetaWindow Eval failed with exit code {result.returncode}")
              try:
                  success, encoded = parse_tuple(result.stdout)
              except (ValueError, SyntaxError) as error:
                  diagnostic["decodeError"] = str(error)
                  (base.parent / f"{base.name}-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
                  raise SystemExit("GNOME Shell MetaWindow Eval returned an invalid tuple")
              diagnostic["evalSucceeded"] = success
              if not success:
                  diagnostic["decodedType"] = type(encoded).__name__
                  diagnostic["evalError"] = encoded
                  (base.parent / f"{base.name}-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
                  raise SystemExit("GNOME Shell Eval refused MetaWindow inspection")
              try:
                  rows = json.loads(encoded)
              except (json.JSONDecodeError, TypeError) as error:
                  diagnostic["decodeError"] = str(error)
                  (base.parent / f"{base.name}-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
                  raise SystemExit("GNOME Shell MetaWindow Eval returned invalid JSON")
              diagnostic["decodedType"] = type(rows).__name__
              diagnostic["decodedRows"] = rows
              if not isinstance(rows, list) or any(
                  not isinstance(row, list) or len(row) != 7 or
                  any(type(value) is not int for value in row) for row in rows
              ):
                  diagnostic["shapeValid"] = False
                  (base.parent / f"{base.name}-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
                  raise SystemExit("GNOME Shell MetaWindow Eval returned an unexpected row shape")
              diagnostic["shapeValid"] = True
              diagnostic["decodedRowCount"] = len(rows)
              (base.parent / f"{base.name}-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
              return rows
          def find_meta_window_row(rows, candidate_id):
              matches = [row for row in rows if str(row[0]) == candidate_id]
              if len(matches) != 1:
                  raise ValueError("GetWindows candidate ID did not map to exactly one MetaWindow")
              return matches[0]



          def current_window(window_id):
              raw = call("--dest", "org.gnome.Shell", "--object-path", "/org/gnome/Shell/Introspect",
                         "--method", "org.gnome.Shell.Introspect.GetWindows")
              blocks = re.findall(r"uint64\s+(\d+)\s*:\s*\{([^{}]*)\}", raw, re.S)
              block = next((value for key, value in blocks if key == window_id), None)
              if block is None:
                  raise ValueError("candidate window disappeared from GetWindows")
              def prop(key):
                  match = re.search(rf"['\"]?{re.escape(key)}['\"]?\s*:\s*<([^>]*)>", block)
                  return match.group(1).strip() if match else ""
              app_id = prop("app-id").strip("'\"")
              title = prop("title").strip("'\"")
              wm_class = prop("wm-class").strip("'\"")
              hidden = prop("is-hidden")
              client_type = re.search(r"(?:u?int\d+)\s+(\d+)", prop("client-type"))
              width = re.search(r"(?:u?int\d+)\s+(\d+)", prop("width"))
              height = re.search(r"(?:u?int\d+)\s+(\d+)", prop("height"))
              if title != EXPECTED_TITLE or wm_class != EXPECTED_WM_CLASS or hidden != "false" or \
                 not client_type or not width or not height:
                  raise ValueError("live candidate no longer has exact visible Devsy WM_CLASS/title and geometry")
              return {"windowId": window_id, "title": title, "appId": app_id, "wmClass": wm_class,
                      "clientType": int(client_type.group(1)), "isHidden": False,
                      "width": int(width.group(1)), "height": int(height.group(1))}

          def main():
              if sys.argv[1] == "--self-test":
                  window = {"windowId": "17", "appId": "window:1", "title": EXPECTED_TITLE,
                            "wmClass": EXPECTED_WM_CLASS, "clientType": 1, "isHidden": False,
                            "width": 800, "height": 600}
                  process = {"pid": 91, "startTicks": 1000, "uid": os.getuid(),
                             "exe": "/tmp/.mount_D/devsy-desktop", "exeSha256": "a" * 64,
                             "mount": {"mountpoint": "/tmp/.mount_D",
                                       "filesystem": f"fuse.{EXPECTED_APPIMAGE}",
                                       "source": EXPECTED_APPIMAGE},
                             "appImagePath": f"/tmp/{EXPECTED_APPIMAGE}", "appImageSha256": "b" * 64}
                  before = {"processes": [process]}
                  after = {"processes": [dict(process)]}
                  good = [17, 91, 1, 0, 0, 800, 600]
                  assert linked_record(window, good, before, after, "b" * 64)["metaWindow"]["pid"] == 91
                  linked = linked_record(window, good, before, after, "b" * 64)
                  assert attribution_matches(window, linked, "b" * 64)
                  assert not attribution_matches(window, dict(linked, windowId="18"), "b" * 64)
                  assert not attribution_matches(window, linked, "c" * 64)
                  bad_snapshots = [
                      {"processes": [dict(process, startTicks=1001)]},
                      {"processes": [dict(process, uid=os.getuid() + 1)]},
                      {"processes": [dict(process, exe="/tmp/.mount_other/devsy-desktop")]},
                      {"processes": [dict(process, exeSha256="c" * 64)]},
                      {"processes": [dict(process, mount={"mountpoint": "/tmp/.mount_other",
                                                           "filesystem": f"fuse.{EXPECTED_APPIMAGE}",
                                                           "source": EXPECTED_APPIMAGE})]},
                      {"processes": [dict(process, appImagePath="/tmp/Devsy_linux_x86_64.AppImage",
                                          appImageSha256="c" * 64)]},
                  ]
                  invalid = [
                      ([18, 91, 1, 0, 0, 800, 600], before, after, "b" * 64),
                      ([17, 92, 1, 0, 0, 800, 600], before, after, "b" * 64),
                      ([17, 91, 0, 0, 0, 800, 600], before, after, "b" * 64),
                      ([17, 91, 1, 0, 0, 1, 1], before, after, "b" * 64),
                      (good, before, bad_snapshots[0], "b" * 64),
                      (good, before, bad_snapshots[1], "b" * 64),
                      (good, before, bad_snapshots[2], "b" * 64),
                      (good, before, bad_snapshots[3], "b" * 64),
                      (good, before, bad_snapshots[4], "b" * 64),
                      (good, before, bad_snapshots[5], "b" * 64),
                      (good, before, after, "c" * 64),
                  ]
                  for meta, prior, later, digest in invalid:
                      try:
                          linked_record(window, meta, prior, later, digest)
                      except (KeyError, TypeError, ValueError):
                          continue
                      raise AssertionError("invalid window/PID/AppImage provenance was accepted")
                  print("same-window PID/start/UID/executable/mount/hash and updater-handoff rejection fixtures passed")
                  return
              if sys.argv[1] == "capture":
                  identity_path = sys.argv[2]
                  before_path, after_path, expected_hash, output = sys.argv[3:]
                  identity_name = Path(identity_path).name
                  suffix = "-window-identity.json"
                  if not identity_name.endswith(suffix):
                      raise SystemExit("window identity path has an unexpected filename")
                  backend = identity_name[:-len(suffix)]
                  capture_label = Path(output).stem
                  candidates = json.loads(Path(identity_path).read_text())["candidateWindows"]
                  if len(candidates) != 1:
                      raise SystemExit("expected exactly one raw Devsy WM_CLASS/title candidate")
                  window = candidates[0]
                  current = current_window(window["windowId"])
                  if current != window:
                      raise SystemExit("live GetWindows candidate changed before MetaWindow attribution")
                  meta_windows = meta_window_snapshot(backend, window["windowId"], Path(identity_path).parent, capture_label)
                  try:
                      meta = find_meta_window_row(meta_windows, window["windowId"])
                  except ValueError as error:
                      raise SystemExit(str(error))
                  linked = linked_record(window, meta, json.loads(Path(before_path).read_text()),
                                         json.loads(Path(after_path).read_text()), expected_hash)
                  Path(output).write_text(json.dumps(linked, indent=2) + "\n")
                  print(json.dumps(linked, sort_keys=True))
                  return
              if sys.argv[1] == "compare":
                  before = json.loads(Path(sys.argv[2]).read_text())
                  after = json.loads(Path(sys.argv[3]).read_text())
                  if before != after:
                      raise SystemExit("window/PID/process identity changed around screenshot")
                  print("same candidate window and exact AppImage process identity observed before and after screenshot")
                  return
              if sys.argv[1] == "attribute":
                  _, _, identity_path, linked_path, proof_path, backend, screenshot_path = sys.argv
                  candidates = json.loads(Path(identity_path).read_text())["candidateWindows"]
                  linked = json.loads(Path(linked_path).read_text())
                  proof = json.loads(Path(proof_path).read_text())
                  candidate = candidates[0] if len(candidates) == 1 else {}
                  if len(candidates) != 1 or proof.get("windowCandidates", {}).get(backend) != candidates or \
                     not attribution_matches(candidate, linked, proof["appimage"]["sha256"]) or \
                     not Path(screenshot_path).is_file() or Path(screenshot_path).stat().st_size == 0:
                      raise SystemExit("candidate lacks same-window D485 PID/process linkage or screenshot")
                  proof.setdefault("verifiedWindows", {})[backend] = [candidates[0]]
                  proof.setdefault("windowPidLinkage", {})[backend] = linked
                  proof["applicationLaunched"] = True
                  proof["sessionResult"] = "window_attributed"
                  proof["scope"] = f"GNOME candidate for {backend} was linked to the audited exact-AppImage process tree and screenshot; remaining checks pending."
                  Path(proof_path).write_text(json.dumps(proof, indent=2) + "\n")
                  print(f"verified window attribution recorded for {backend}")
                  return
              raise SystemExit("usage: verify-window-link.py --self-test|capture|compare|attribute")

          if __name__ == "__main__":
              main()
          PY
          chmod 700 "$proof_dir/verify-window-link.py"
          export WINDOW_LINK_SCRIPT="$proof_dir/verify-window-link.py"
          python3 "$proof_dir/verify-window-link.py" --self-test
          chmod 700 "$proof_dir/verify-window.py"
          python3 "$proof_dir/verify-window.py" --self-test
          cat > "$proof_dir/process-audit.py" <<'PY'
          import hashlib
          import json
          import os
          import re
          import signal
          import stat
          import sys
          import time
          from pathlib import Path

          HASH_CACHE = {}

          def hash_file(path):
              info = os.stat(path)
              key = (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns)
              if key not in HASH_CACHE:
                  digest = hashlib.sha256()
                  with open(path, "rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(chunk)
                  HASH_CACHE[key] = digest.hexdigest()
              return HASH_CACHE[key]

          def mount_info(root, exe):
              target = exe.removesuffix(" (deleted)")
              matches = []
              try:
                  lines = (root / "mountinfo").read_text().splitlines()
              except OSError:
                  return None
              for line in lines:
                  before, separator, after = line.partition(" - ")
                  if not separator:
                      continue
                  fields = before.split()
                  mountpoint = re.sub(r"\\([0-7]{3})", lambda m: chr(int(m.group(1), 8)), fields[4])
                  if target == mountpoint or target.startswith(mountpoint.rstrip("/") + "/"):
                      after_fields = after.split()
                      matches.append((len(mountpoint), {
                          "mountpoint": mountpoint,
                          "filesystem": after_fields[0],
                          "source": after_fields[1] if len(after_fields) > 1 else "",
                      }))
              return max(matches, key=lambda match: match[0])[1] if matches else None

          def proc_record(pid, detailed=False):
              root = Path("/proc") / str(pid)
              try:
                  raw_stat = (root / "stat").read_text()
                  fields = raw_stat[raw_stat.rfind(")") + 2:].split()
                  exe = os.readlink(root / "exe")
                  record = {
                      "pid": pid,
                      "ppid": int(fields[1]),
                      "pgrp": int(fields[2]),
                      "sid": int(fields[3]),
                      "startTicks": int(fields[19]),
                      "uid": root.stat().st_uid,
                      "exe": exe,
                  }
                  if not detailed:
                      return record
                  env = {}
                  for item in (root / "environ").read_bytes().split(b"\0"):
                      key, separator, value = item.partition(b"=")
                      if separator and key in {b"APPIMAGE", b"DISPLAY", b"WAYLAND_DISPLAY", b"XDG_RUNTIME_DIR", b"XAUTHORITY"}:
                          env[key.decode()] = value.decode(errors="replace")
                  image_path = env.get("APPIMAGE")
                  record.update({
                      "exeSha256": hash_file(root / "exe"),
                      "argv": [x.decode(errors="replace") for x in (root / "cmdline").read_bytes().split(b"\0") if x],
                      "mount": mount_info(root, exe),
                      "appImagePath": image_path,
                      "appImageSha256": hash_file(image_path) if image_path and Path(image_path).is_file() else None,
                      "display": env.get("DISPLAY"),
                      "waylandDisplay": env.get("WAYLAND_DISPLAY"),
                      "runtimeDir": env.get("XDG_RUNTIME_DIR"),
                      "xauthorityPath": env.get("XAUTHORITY"),
                  })
                  return record
              except (OSError, ValueError, IndexError):
                  return None

          def all_processes(detailed=False):
              records = {}
              for entry in Path("/proc").iterdir():
                  if entry.name.isdigit():
                      record = proc_record(int(entry.name), detailed)
                      if record:
                          records[record["pid"]] = record
              return records


          def owned_tree(root_pid, records):
              root = records.get(root_pid)
              if not root:
                  return []
              children = {}
              for record in records.values():
                  if record["uid"] == root["uid"]:
                      children.setdefault(record["ppid"], []).append(record["pid"])
              selected = {root_pid}
              pending = [root_pid]
              while pending:
                  parent = pending.pop()
                  for child in children.get(parent, []):
                      if child not in selected:
                          selected.add(child)
                          pending.append(child)
              selected.update(record["pid"] for record in records.values()
                              if record["uid"] == root["uid"] and
                              (record["sid"] == root["sid"] or record["pgrp"] == root_pid))
              return [records[pid] for pid in sorted(selected) if pid in records]

          def write_json(path, value):
              Path(path).write_text(json.dumps(value, indent=2) + "\n")

          def version_hints(path):
              try:
                  return re.findall(r"current=([^ ]+)", Path(path).read_text())
              except OSError:
                  return []

          def find_display(shell_pid, shell_log, output):
              shell = proc_record(shell_pid)
              if not shell:
                  raise SystemExit("owned Mutter process is missing")
              log_matches = re.findall(r"Using public X11 display ([^,\s]+)", Path(shell_log).read_text())
              records = all_processes()
              members = owned_tree(shell_pid, records)
              candidates = []
              for basic in members:
                  try:
                      args = [arg.decode(errors="replace") for arg in (Path("/proc") / str(basic["pid"]) / "cmdline").read_bytes().split(b"\0") if arg]
                  except OSError:
                      continue
                  if Path(basic["exe"]).name != "Xwayland" and not any("Xwayland" in arg for arg in args):
                      continue
                  record = proc_record(basic["pid"], detailed=True)
                  if not record:
                      continue
                  args = record["argv"]
                  displays = [arg for arg in args if re.fullmatch(r":\d+(?:\.\d+)?", arg)]
                  auth = None
                  if "-auth" in args:
                      index = args.index("-auth")
                      if index + 1 < len(args):
                          auth = args[index + 1]
                  if not auth:
                      auth = record["xauthorityPath"]
                  candidates.append((record, displays[0] if displays else None, auth))
              if len(log_matches) != 1 or len(candidates) != 1:
                  raise SystemExit("could not uniquely identify the owned nested Xwayland display")
              xwayland, display, auth = candidates[0]
              if not display or display != log_matches[0] or xwayland["sid"] != shell["sid"]:
                  raise SystemExit("nested Xwayland display did not match the owned Mutter session")
              auth_path = Path(auth).resolve(strict=True) if auth else None
              if not auth_path or not auth_path.is_file() or auth_path.stat().st_uid != shell["uid"]:
                  raise SystemExit("owned nested Xwayland authority file is unavailable")
              display_number = display[1:].split(".", 1)[0]
              socket_path = Path("/tmp/.X11-unix") / f"X{display_number}"
              if not socket_path.exists() or not stat.S_ISSOCK(socket_path.stat().st_mode):
                  raise SystemExit("nested Xwayland socket is missing")
              info = {
                  "display": display,
                  "xwaylandPid": xwayland["pid"],
                  "xwaylandStartTicks": xwayland["startTicks"],
                  "xwaylandExe": xwayland["exe"],
                  "xauthorityPath": str(auth_path),
                  "xauthorityMode": oct(stat.S_IMODE(auth_path.stat().st_mode)),
                  "socketPath": str(socket_path),
                  "shellPid": shell_pid,
                  "shellStartTicks": shell["startTicks"],
              }
              write_json(output, info)
              print(json.dumps(info, sort_keys=True))

          def snapshot(root_pid, image_path, log_path, output):
              records = all_processes()
              members = owned_tree(root_pid, records)
              if not members:
                  raise SystemExit("AppImage root process disappeared before process snapshot")
              members = [proc_record(item["pid"], detailed=True) for item in members]
              members = [item for item in members if item]
              image_sha = hash_file(image_path)
              proof = {
                  "rootPid": root_pid,
                  "rootStartTicks": next(item["startTicks"] for item in members if item["pid"] == root_pid),
                  "appImagePath": image_path,
                  "appImageSha256": image_sha,
                  "reportedVersions": version_hints(log_path),
                  "processes": members,
              }
              write_json(output, proof)
              print(json.dumps({"rootPid": root_pid, "processCount": len(members),
                                "reportedVersions": proof["reportedVersions"],
                                "appImageSha256": image_sha}, sort_keys=True))

          def stop_tree(root_pid, baseline_path, output):
              baseline = json.loads(Path(baseline_path).read_text()) if Path(baseline_path).is_file() else {}
              expected_start = baseline.get("rootStartTicks")
              known = {
                  record["pid"]: {"startTicks": record["startTicks"], "uid": record["uid"]}
                  for record in baseline.get("processes", [])
              }

              def refresh():
                  records = all_processes()
                  current = owned_tree(root_pid, records)
                  root = next((item for item in current if item["pid"] == root_pid), None)
                  if root and expected_start is not None and root["startTicks"] != expected_start:
                      raise SystemExit("AppImage root PID was reused; refusing to signal it")
                  if root is None:
                      tracked = []
                      for pid, identity in known.items():
                          record = records.get(pid)
                          if record and record["startTicks"] == identity["startTicks"] and record["uid"] == identity["uid"]:
                              tracked.extend(owned_tree(pid, records))
                      current = list({record["pid"]: record for record in tracked}.values())
                  for record in current:
                      known.setdefault(record["pid"], {
                          "startTicks": record["startTicks"],
                          "uid": record["uid"],
                      })
                  return records, current

              def signal_known(records, sig):
                  for pid in sorted(known, key=lambda value: value == root_pid):
                      identity = known[pid]
                      record = records.get(pid)
                      if not record or record["startTicks"] != identity["startTicks"] or record["uid"] != identity["uid"]:
                          continue
                      if expected_start is not None and pid == root_pid and identity["startTicks"] != expected_start:
                          continue
                      try:
                          os.kill(pid, sig)
                      except ProcessLookupError:
                          pass

              def survivors_now():
                  records = all_processes()
                  return [
                      {"pid": pid, **identity, "exe": records[pid]["exe"]}
                      for pid, identity in known.items()
                      if pid in records and records[pid]["startTicks"] == identity["startTicks"] and
                      records[pid]["uid"] == identity["uid"]
                  ]

              records, current = refresh()
              signal_known(records, signal.SIGTERM)
              deadline = time.monotonic() + 5
              while time.monotonic() < deadline:
                  records, current = refresh()
                  if not current and not survivors_now():
                      break
                  signal_known(records, signal.SIGTERM)
                  time.sleep(0.2)
              records, current = refresh()
              signal_known(records, signal.SIGKILL)
              deadline = time.monotonic() + 5
              while time.monotonic() < deadline:
                  records, current = refresh()
                  survivors = survivors_now()
                  if not survivors and not current:
                      break
                  time.sleep(0.2)
              records, current = refresh()
              survivors = survivors_now()
              result = {"rootPid": root_pid, "trackedProcessCount": len(known),
                        "survivors": survivors, "remainingTree": current}
              write_json(output, result)
              print(json.dumps(result, sort_keys=True))
              if survivors or current:
                  raise SystemExit("owned AppImage processes survived bounded cleanup")

          if sys.argv[1] == "display":
              find_display(int(sys.argv[2]), sys.argv[3], sys.argv[4])
          elif sys.argv[1] == "snapshot":
              snapshot(int(sys.argv[2]), sys.argv[3], sys.argv[4], sys.argv[5])
          elif sys.argv[1] == "stop":
              stop_tree(int(sys.argv[2]), sys.argv[3], sys.argv[4])
          else:
              raise SystemExit("usage: process-audit.py display|snapshot|stop ...")
          PY
          chmod 700 "$proof_dir/process-audit.py"
          cat > "$proof_dir/verify-gnome-shell.py" <<'PY'
          import json
          import ast
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          def process_identity(pid):
              root = Path("/proc") / str(pid)
              raw = (root / "stat").read_text()
              fields = raw[raw.rfind(")") + 2:].split()
              return {"pid": int(pid), "startTicks": int(fields[19]), "uid": root.stat().st_uid,
                      "exe": os.readlink(root / "exe"),
                      "argv": [arg.decode(errors="replace") for arg in (root / "cmdline").read_bytes().split(b"\0") if arg]}

          def dbus(*args):
              result = subprocess.run(["gdbus", "call", "--session", *args], text=True,
                                      capture_output=True, timeout=5)
              if result.returncode:
                  raise RuntimeError(result.stderr.strip() or "D-Bus call failed")
              return result.stdout.strip()

          def eval_result(raw):
              match = re.fullmatch(r"\((true|false),\s*('.*')\)", raw)
              if not match:
                  raise RuntimeError(f"unexpected Shell Eval result: {raw}")
              value = ast.literal_eval(match.group(2))
              return match.group(1) == "true", value
          def bus_owner():
              owner = dbus("--dest", "org.freedesktop.DBus", "--object-path", "/org/freedesktop/DBus",
                           "--method", "org.freedesktop.DBus.GetNameOwner", "org.gnome.Shell")
              owner_match = re.search(r"\('([^']+)'", owner)
              if not owner_match:
                  raise RuntimeError(f"could not parse org.gnome.Shell owner: {owner}")
              owner_name = owner_match.group(1)
              reply = dbus("--dest", "org.freedesktop.DBus", "--object-path", "/org/freedesktop/DBus",
                           "--method", "org.freedesktop.DBus.GetConnectionUnixProcessID", owner_name)
              pid_match = re.search(r"uint32\s+(\d+)", reply)
              if not pid_match:
                  raise RuntimeError(f"could not parse Shell owner PID: {reply}")
              return owner_name, int(pid_match.group(1))

          if len(sys.argv) > 1 and sys.argv[1] == "--self-test":
              assert eval_result("(true, 'false')") == (True, "false")
              assert eval_result("(true, 'true')") == (True, "true")
              assert eval_result("(false, 'error')") == (False, "error")
              print("GNOME Eval tuple cases passed")
              raise SystemExit(0)

          def main():
              backend, pid, output = sys.argv[1], int(sys.argv[2]), Path(sys.argv[3])
              deadline = time.monotonic() + 60
              expected = None
              attempts = []
              while time.monotonic() < deadline:
                  try:
                      identity = process_identity(pid)
                      if Path(identity["exe"]).name != "gnome-shell" or identity["uid"] != os.getuid():
                          raise RuntimeError("GNOME Shell executable or UID differs from the owned runner")
                      if "--unsafe-mode" not in identity["argv"]:
                          raise RuntimeError("owned GNOME Shell was not started with --unsafe-mode")
                      if expected is not None and identity != expected:
                          raise RuntimeError("owned GNOME Shell process identity changed during startup")
                      expected = identity
                      owner_name, owner_pid = bus_owner()
                      if owner_pid != pid:
                          raise RuntimeError(f"org.gnome.Shell D-Bus owner PID {owner_pid} != launched PID {pid}")
                      eval_raw = dbus("--dest", "org.gnome.Shell", "--object-path", "/org/gnome/Shell",
                                      "--method", "org.gnome.Shell.Eval", "Main.layoutManager._startingUp")
                      eval_ok, startup_value = eval_result(eval_raw)
                      attempts.append({"ownerPid": owner_pid, "eval": eval_raw})
                      if not eval_ok:
                          raise RuntimeError("GNOME Shell refused source-backed startup readiness evaluation")
                      if startup_value == "false":
                          try:
                              windows = dbus("--dest", "org.gnome.Shell", "--object-path", "/org/gnome/Shell/Introspect",
                                             "--method", "org.gnome.Shell.Introspect.GetWindows")
                          except RuntimeError as error:
                              if "org.freedesktop.DBus.Error.AccessDenied" in str(error):
                                  raise RuntimeError("GetWindows returned AccessDenied after --unsafe-mode") from error
                              raise
                          verified_owner, verified_owner_pid = bus_owner()
                          if verified_owner != owner_name or verified_owner_pid != pid:
                              raise RuntimeError("org.gnome.Shell D-Bus owner changed during readiness check")
                          if process_identity(pid) != expected:
                              raise RuntimeError("GNOME Shell process identity changed after startup readiness")
                          result = {
                              "backend": backend,
                              "shell": expected,
                              "dbusOwner": verified_owner,
                              "dbusOwnerPid": verified_owner_pid,
                              "unsafeModeArgumentObserved": True,
                              "startupComplete": True,
                              "startupState": "Main.layoutManager._startingUp=false",
                              "getWindowsSucceeded": True,
                              "getWindowsResult": windows,
                              "startupPolls": attempts,
                              "sources": [
                                  "https://raw.githubusercontent.com/GNOME/gnome-shell/46.0/js/ui/main.js",
                                  "https://raw.githubusercontent.com/GNOME/gnome-shell/46.0/js/ui/shellDBus.js",
                                  "https://raw.githubusercontent.com/GNOME/gnome-shell/46.0/data/dbus-interfaces/org.gnome.Shell.xml",
                                  "https://raw.githubusercontent.com/GNOME/gnome-shell/46.0/js/misc/introspect.js",
                              ],
                          }
                          output.write_text(json.dumps(result, indent=2) + "\n")
                          print(json.dumps({"backend": backend, "pid": pid, "startupComplete": True,
                                            "getWindowsSucceeded": True}, sort_keys=True))
                          return
                  except RuntimeError as error:
                      attempts.append({"error": str(error)})
                      if "AccessDenied" in str(error) or "unsafe-mode" in str(error) or "identity changed" in str(error):
                          break
                  except (OSError, subprocess.TimeoutExpired, ValueError, IndexError) as error:
                      attempts.append({"error": str(error)})
                  if subprocess.run(["kill", "-0", str(pid)], capture_output=True).returncode:
                      attempts.append({"error": "owned GNOME Shell exited before readiness"})
                      break
                  time.sleep(0.5)
              output.write_text(json.dumps({"backend": backend, "shellPid": pid,
                                            "startupComplete": False, "attempts": attempts}, indent=2) + "\n")
              raise SystemExit("owned GNOME Shell did not reach startup-complete with introspection available")

          if __name__ == "__main__":
              main()
          PY
