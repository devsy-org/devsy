              display_json="$PROOF_DIR/nested-wayland-display.json"
              for attempt in $(seq 1 60); do
                if python3 "$PROCESS_AUDIT_SCRIPT" display "$shell_pid" "$PROOF_DIR/gnome-wayland-shell.log" "$display_json" \
                  >>"$PROOF_DIR/nested-display-discovery.log" 2>&1; then
                  break
                fi
                sleep 0.5
              done
              test -s "$display_json"
              nested_display=$(jq -er ".display" "$display_json")
              nested_auth=$(jq -er ".xauthorityPath" "$display_json")
              timeout 10s env DISPLAY="$nested_display" XAUTHORITY="$nested_auth" xdpyinfo >"$PROOF_DIR/nested-xdpyinfo.txt"
              timeout 30s env DISPLAY="$nested_display" XAUTHORITY="$nested_auth" glxinfo -B | tee "$PROOF_DIR/nested-software-renderer.txt"
              export DISPLAY="$nested_display" XAUTHORITY="$nested_auth"
              python3 "$SHELL_READY_SCRIPT" wayland "$shell_pid" "$PROOF_DIR/wayland-shell-readiness.json"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$shell_pid" "$APPIMAGE_PATH" \
                "$PROOF_DIR/gnome-wayland-shell.log" "$shell_baseline"
              start_app() {
                backend=$1
                logfile=$2
                app_baseline="$PROOF_DIR/$backend-process-before.json"
                app_binding="$PROOF_DIR/$backend-root-binding.json"
                shift 2
                setsid "$APPIMAGE_PATH" "$@" >"$logfile" 2>&1 &
                app_pid=$!
                python3 "$VERIFY_WINDOW_SCRIPT" --attempt "$backend" "$PROOF_DIR/proof.json"
                python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$logfile" "$app_baseline"
                python3 "$WINDOW_LINK_SCRIPT" pin "$app_baseline" "$PROOF_DIR/proof.json" "$APPIMAGE_PATH" "$app_binding"
              }
              observe_app() {
                backend=$1
                expected_type=$2
                output="$PROOF_DIR/$backend-windows.txt"
                identity="$PROOF_DIR/$backend-window-identity.json"
                for attempt in $(seq 1 60); do
                  if gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell/Introspect \
                    --method org.gnome.Shell.Introspect.GetWindows >"$output" 2>"$output.err" \
                    && python3 "$VERIFY_WINDOW_SCRIPT" "$output" "$expected_type" "$backend" "$PROOF_DIR/proof.json" \
                      >"$PROOF_DIR/$backend-window-match.json" 2>"$PROOF_DIR/$backend-window-parser.err"; then
                    break
                  fi
                  sleep 0.5
                done
                test -s "$identity"
                python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-$backend.log" \
                  "$PROOF_DIR/$backend-process-after.json"
                cat "$output" >"$PROOF_DIR/$backend-window-observation.txt"
              }
              capture_app_screenshot() {
                backend=$1
                image=$2
                logfile=$3
                screen_before="$PROOF_DIR/$backend-screenshot-before.json"
                screen_after="$PROOF_DIR/$backend-screenshot-after.json"
                link_before="$PROOF_DIR/$backend-screenshot-before-link.json"
                link_after="$PROOF_DIR/$backend-screenshot-after-link.json"
                receipt="$PROOF_DIR/$backend-screenshot-window-dbus-receipt.json"
                python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$logfile" "$screen_before"
                python3 "$WINDOW_LINK_SCRIPT" capture before "$PROOF_DIR/$backend-window-identity.json" \
                  "$app_binding" "$screen_before" "$screen_before" "$link_before"
                python3 "$WINDOW_LINK_SCRIPT" screenshot "$backend" "$image" "$link_before" "$PROOF_DIR"
                python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$logfile" "$screen_after"
                python3 "$WINDOW_LINK_SCRIPT" capture after "$PROOF_DIR/$backend-window-identity.json" \
                  "$app_binding" "$screen_before" "$screen_after" "$link_after"
                python3 "$WINDOW_LINK_SCRIPT" compare "$link_before" "$link_after"
                python3 "$WINDOW_LINK_SCRIPT" attribute "$PROOF_DIR/$backend-window-identity.json" \
                  "$link_before" "$link_after" "$receipt" "$PROOF_DIR/proof.json" \
                  "$backend" "$image" "$app_binding"
                printf "backend=%s screenshot=%s\n" "$backend" "$image" >"$PROOF_DIR/$backend-screenshot-linkage.txt"
              }
              start_app wayland-default "$PROOF_DIR/devsy-wayland-default.log"
              observe_app wayland-default any
              default_client_type=$(jq -er ".candidateWindows[0].clientType" "$PROOF_DIR/wayland-default-window-identity.json")
              printf "backend=wayland client-type=%s launchargs=none(default) app_pid=%s\n" "$default_client_type" "$app_pid" \
                >"$PROOF_DIR/wayland-default-launch-mode.txt"
              capture_app_screenshot wayland-default "$PROOF_DIR/wayland-default.png" \
                "$PROOF_DIR/devsy-wayland-default.log"
              if [ "$default_client_type" = 0 ]; then
                :
              elif [ "$default_client_type" = 1 ]; then
                cleanup_app
                start_app wayland-forced "$PROOF_DIR/devsy-wayland-forced.log" --ozone-platform=wayland --enable-features=UseOzonePlatform
                observe_app wayland-forced 0
                printf "backend=wayland client-type=0 launchargs=--ozone-platform=wayland --enable-features=UseOzonePlatform (forced probe; not default behavior) app_pid=%s\n" "$app_pid" \
                  >"$PROOF_DIR/wayland-forced-launch-mode.txt"
                capture_app_screenshot wayland-forced "$PROOF_DIR/wayland-forced.png" \
                  "$PROOF_DIR/devsy-wayland-forced.log"
              else
                echo "Unexpected default Wayland client-type: $default_client_type" >&2
                exit 1
              fi
              test -s "$PROOF_DIR/wayland-default.png"
              if [ "$default_client_type" = 0 ]; then
                printf "backend=wayland client-type=0 launchargs=none(default) app_pid=%s\n" "$app_pid" \
                  >"$PROOF_DIR/wayland-default-launch-mode.txt"
              fi
              cleanup_app
            '
          }
          run_wayland_session

          run_x11_session() {
            local runtime="$profile/x11-runtime"
            mkdir -p "$runtime"
            chmod 700 "$runtime"
            export XDG_RUNTIME_DIR="$runtime"
            # shellcheck disable=SC2016
            dbus-run-session -- bash -euo pipefail -c '
              host_display="$DISPLAY"
              unset WAYLAND_DISPLAY
              setsid gnome-shell --unsafe-mode --x11 --display="$host_display" --sm-disable >"$PROOF_DIR/gnome-x11-shell.log" 2>&1 &
              shell_pid=$!
              shell_baseline="$PROOF_DIR/gnome-x11-shell-process-before.json"
              app_pid=
              app_baseline=
              cleanup_app() {
                if [ -n "$app_pid" ]; then
                  python3 "$PROCESS_AUDIT_SCRIPT" stop "$app_pid" "$app_baseline" "$PROOF_DIR/x11-process-cleanup.json" || return $?
                  wait "$app_pid" 2>/dev/null || true
                  app_pid=
                fi
              }
              cleanup() {
                status=0
                cleanup_app || status=$?
                if [ -s "$shell_baseline" ]; then
                  python3 "$PROCESS_AUDIT_SCRIPT" stop "$shell_pid" "$shell_baseline" \
                    "$PROOF_DIR/gnome-x11-shell-cleanup.json" || status=$?
                else
                  kill -- "-$shell_pid" 2>/dev/null || true
                fi
                wait "$shell_pid" 2>/dev/null || true
                return "$status"
              }
              trap cleanup EXIT
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$shell_pid" "$APPIMAGE_PATH" \
                "$PROOF_DIR/gnome-x11-shell.log" "$shell_baseline"
              gnome-shell --version | tee "$PROOF_DIR/gnome-x11-version.txt"
              python3 "$SHELL_READY_SCRIPT" x11 "$shell_pid" "$PROOF_DIR/x11-shell-readiness.json"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$shell_pid" "$APPIMAGE_PATH" \
                "$PROOF_DIR/gnome-x11-shell.log" "$shell_baseline"
              setsid "$APPIMAGE_PATH" >"$PROOF_DIR/devsy-x11.log" 2>&1 &
              app_pid=$!
              app_baseline="$PROOF_DIR/x11-process-before.json"
              app_binding="$PROOF_DIR/x11-root-binding.json"
              python3 "$VERIFY_WINDOW_SCRIPT" --attempt x11 "$PROOF_DIR/proof.json"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-x11.log" "$app_baseline"
              python3 "$WINDOW_LINK_SCRIPT" pin "$app_baseline" "$PROOF_DIR/proof.json" "$APPIMAGE_PATH" "$app_binding"
              output="$PROOF_DIR/x11-windows.txt"
              identity="$PROOF_DIR/x11-window-identity.json"
              for attempt in $(seq 1 60); do
                if gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell/Introspect \
                  --method org.gnome.Shell.Introspect.GetWindows >"$output" 2>"$output.err" \
                  && python3 "$VERIFY_WINDOW_SCRIPT" "$output" 1 x11 "$PROOF_DIR/proof.json" \
                    >"$PROOF_DIR/x11-window-match.json" 2>"$PROOF_DIR/x11-window-parser.err"; then
                  break
                fi
                sleep 0.5
              done
              test -s "$identity"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-x11.log" "$PROOF_DIR/x11-process-after.json"
              cat "$output" >"$PROOF_DIR/x11-window-observation.txt"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-x11.log" "$PROOF_DIR/x11-screenshot-before.json"
              python3 "$WINDOW_LINK_SCRIPT" capture before "$identity" "$app_binding" \
                "$PROOF_DIR/x11-screenshot-before.json" "$PROOF_DIR/x11-screenshot-before.json" \
                "$PROOF_DIR/x11-screenshot-before-link.json"
              python3 "$WINDOW_LINK_SCRIPT" screenshot x11 "$PROOF_DIR/x11.png" \
                "$PROOF_DIR/x11-screenshot-before-link.json" "$PROOF_DIR"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-x11.log" "$PROOF_DIR/x11-screenshot-after.json"
              python3 "$WINDOW_LINK_SCRIPT" capture after "$identity" "$app_binding" \
                "$PROOF_DIR/x11-screenshot-before.json" "$PROOF_DIR/x11-screenshot-after.json" \
                "$PROOF_DIR/x11-screenshot-after-link.json"
              python3 "$WINDOW_LINK_SCRIPT" compare "$PROOF_DIR/x11-screenshot-before-link.json" \
                "$PROOF_DIR/x11-screenshot-after-link.json"
              python3 "$WINDOW_LINK_SCRIPT" attribute "$identity" \
                "$PROOF_DIR/x11-screenshot-before-link.json" "$PROOF_DIR/x11-screenshot-after-link.json" \
                "$PROOF_DIR/x11-screenshot-window-dbus-receipt.json" "$PROOF_DIR/proof.json" \
                x11 "$PROOF_DIR/x11.png" "$app_binding"
              cleanup_app
            '
          }
          run_x11_session
          python3 - "$proof_dir/proof.json" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          proof_path = Path(sys.argv[1])
          proof = json.loads(proof_path.read_text())
          candidates = proof.get("windowCandidates", {})
          windows = proof.get("verifiedWindows", {})
          errors = []

          def valid_window(window, client_type=None):
              return (
                  window.get("wmClass") == "sh.devsy.app" and window.get("title") == "Devsy" and
                  window.get("isHidden") is False and window.get("hasFocus") is True and
                  (client_type is None or window.get("clientType") == client_type) and
                  isinstance(window.get("width"), int) and window["width"] > 0 and
                  isinstance(window.get("height"), int) and window["height"] > 0
              )

          def linked_candidate(backend, client_type=None):
              raw = candidates.get(backend, [])
              verified = windows.get(backend, [])
              if len(raw) != 1 or len(verified) != 1 or \
                 any(raw[0].get(key) != verified[0].get(key) for key in
                     ("windowId", "appId", "wmClass", "title", "clientType", "isHidden")) or \
                 not valid_window(verified[0], client_type):
                  errors.append(f"{backend} raw candidate was not linked to a focused exact Devsy window")
                  return None
              return verified[0]

          default_window = linked_candidate("wayland-default")
          default_type = default_window.get("clientType") if default_window else None
          required = ["wayland-default", "x11"]
          if default_type == 1:
              required.append("wayland-forced")
              linked_candidate("wayland-forced", 0)
          elif default_type != 0:
              errors.append("default Wayland client type was not 0 or 1")
          linked_candidate("x11", 1)

          readiness = {}
          for backend in ("wayland", "x11"):
              path = proof_path.with_name(f"{backend}-shell-readiness.json")
              if not path.is_file():
                  errors.append(f"{backend} GNOME readiness proof is missing")
                  continue
              state = json.loads(path.read_text())
              readiness[backend] = state
              if not state.get("startupComplete") or not state.get("getWindowsSucceeded") or \
                 state.get("dbusOwnerPid") != state.get("shell", {}).get("pid") or \
                 not state.get("unsafeModeArgumentObserved"):
                  errors.append(f"{backend} GNOME unsafe-mode, D-Bus owner, startup, or GetWindows preflight failed")
          proof["gnomeReadiness"] = readiness
          cleanup_files = [
              "gnome-wayland-shell-cleanup.json", "gnome-x11-shell-cleanup.json",
              "wayland-default-process-before-cleanup.json", "x11-process-cleanup.json",
          ]
          if default_type == 1:
              cleanup_files.append("wayland-forced-process-before-cleanup.json")
          for filename in cleanup_files:
              path = proof_path.with_name(filename)
              if not path.is_file():
                  errors.append(f"owned process cleanup proof is missing: {filename}")
                  continue
              state = json.loads(path.read_text())
              if state.get("survivors") or state.get("remainingTree"):
                  errors.append(f"owned processes survived cleanup: {filename}")

          expected_hash = proof.get("appimage", {}).get("sha256")
          provenance = []
          linkages = {}
          for backend in required:
              candidate = candidates.get(backend, [])
              observed = windows.get(backend, [])
              if len(candidate) != 1 or len(observed) != 1:
                  continue
              screenshot = "wayland-default.png" if backend == "wayland-default" else \
                  "wayland-forced.png" if backend == "wayland-forced" else "x11.png"
              receipt = proof_path.with_name(f"{backend}-screenshot-window-dbus-receipt.json")
              before_link = proof_path.with_name(f"{backend}-screenshot-before-link.json")
              after_link = proof_path.with_name(f"{backend}-screenshot-after-link.json")
              paths = [
                  proof_path.with_name(f"{backend}-root-binding.json"),
                  proof_path.with_name(f"{backend}-process-before.json"),
                  proof_path.with_name(f"{backend}-process-after.json"),
                  proof_path.with_name(f"{backend}-screenshot-before.json"),
                  proof_path.with_name(f"{backend}-screenshot-after.json"),
                  before_link, after_link, receipt, proof_path.with_name(screenshot),
              ]
              if any(not path.is_file() for path in paths):
                  errors.append(f"{backend} immutable binding, process snapshots, focused linkage, receipt, or PNG is missing")
                  continue
              command = [
                  sys.executable, os.environ["WINDOW_LINK_SCRIPT"], "verify-backend",
                  proof_path.with_name(f"{backend}-window-identity.json"),
                  paths[0], paths[1], paths[2], paths[3], paths[4], paths[5], paths[6],
                  paths[7], paths[8], str(expected_hash),
              ]
              result = subprocess.run(command, text=True, capture_output=True, timeout=20)
              if result.returncode:
                  errors.append(f"{backend} backend provenance/receipt/PNG validation failed: {result.stderr.strip()}")
                  continue
              report = json.loads(result.stdout)
              linkages[backend] = report["linkage"]
              provenance.append({"backend": backend, **report})
          proof["windowPidLinkage"] = linkages
          proof["windowProcessProvenance"] = provenance
          if errors:
              proof["sessionResult"] = "observed_with_acceptance_failures"
              proof["acceptanceErrors"] = errors
              proof["scope"] = "GNOME candidates remain distinct from verified windows; focused-window, immutable AppImage binding, ScreenshotWindow receipt, PNG, readiness, or cleanup acceptance failed."
              proof_path.write_text(json.dumps(proof, indent=2) + "\n")
              raise SystemExit("; ".join(errors))
          proof["sessionResult"] = "passed"
          proof["scope"] = "Raw exact WM_CLASS/title candidates were activated and verified as the focused GNOME window; MetaWindow IDs/PIDs were linked through actual process ancestry to the immutable D485 AppImage mount/executable binding before and after ScreenshotWindow captures. GNOME app-id is observed metadata, not standalone identity evidence. MetaWindow PID is corroborating fixture evidence, not cryptographic attestation. Software-rendered feasibility only; not the complete T4 Add/Remove/move/update acceptance matrix."
          proof_path.write_text(json.dumps(proof, indent=2) + "\n")
          PY
          printf 'GNOME feasibility: exact AppImage and same-window PID linkage observed in isolated GNOME sessions; software-rendered feasibility only.\n' \
            | tee "$proof_dir/result.txt"

      - name: Upload bounded GNOME feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devsy-1652-gnome-feasibility
          path: ${{ runner.temp }}/gnome-feasibility-proof/
          if-no-files-found: warn
          retention-days: 7
