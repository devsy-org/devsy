name: Pull Request

# Disposable diagnostic branch only. This workflow is dispatch-only and is never merged.
on:
  workflow_dispatch:

permissions: {}

jobs:
  gnome-appimage-feasibility:
    name: Launch the final-head AppImage in isolated GNOME sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: "40320261347"
      SOURCE_HEAD_SHA: "d485425ea9a6202a0024678511c64fa80cecdc87"
      LINUX_ARTIFACT_ID: "12648983963"
      LINUX_ARTIFACT_DIGEST: "sha256:13eb34d933bd0e9f32a13db3d954a54f632dde91a1fbdd3feed65a18a70ac916"
    steps:
      - name: Checkout exact source used for the AppImage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d485425ea9a6202a0024678511c64fa80cecdc87
          persist-credentials: false

      - name: Verify source run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/diag/1652-artifact-verification-69dad
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e \
            --argjson id "$SOURCE_RUN_ID" \
            --arg sha "$SOURCE_HEAD_SHA" \
            '.id == $id and .head_sha == $sha and .event == "pull_request" and .conclusion == "success"' \
            <<<"$run"

          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          jq -e \
            --argjson id "$LINUX_ARTIFACT_ID" \
            --arg digest "$LINUX_ARTIFACT_DIGEST" \
            'any(.artifacts[]; .id == $id and .name == "desktop-ubuntu-latest" and .digest == $digest and .expired == false)' \
            <<<"$artifacts"

      - name: Download and verify the exact Linux artifact once
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/linux-artifact.zip"
          artifact_dir="$RUNNER_TEMP/devsy-linux"
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          mkdir -p "$artifact_dir" "$proof_dir"
          headers="$RUNNER_TEMP/artifact.headers"
          response="$RUNNER_TEMP/artifact.response"
          status=$(curl --silent --show-error \
            --dump-header "$headers" \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LINUX_ARTIFACT_ID/zip")
          if [ "$status" != 302 ]; then
            rm -f "$headers" "$response"
            echo "::error::artifact API did not return a redirect (HTTP $status)"
            exit 1
          fi
          location=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "$headers")
          rm -f "$headers" "$response"
          if [ -z "$location" ]; then
            echo "::error::artifact API redirect did not include a download location"
            exit 1
          fi
          if ! curl --location --fail --silent --output "$artifact_zip" "$location" 2>/dev/null; then
            unset location
            echo "::error::artifact archive transfer failed (URL redacted)"
            exit 1
          fi
          unset location GH_TOKEN
          printf '%s  %s\n' "${LINUX_ARTIFACT_DIGEST#sha256:}" "$artifact_zip" | sha256sum --check
          unzip -q "$artifact_zip" -d "$artifact_dir"
          appimage="$artifact_dir/Devsy_linux_x86_64.AppImage"
          test -s "$appimage"
          appimage_sha=$(sha256sum "$appimage" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$appimage_sha" "$appimage" | tee "$proof_dir/appimage-sha256.txt"
          jq -n \
            --arg run "$SOURCE_RUN_ID" \
            --arg head "$SOURCE_HEAD_SHA" \
            --arg artifact "$LINUX_ARTIFACT_ID" \
            --arg zipDigest "$LINUX_ARTIFACT_DIGEST" \
            --arg appimage "$appimage_sha" \
            '{source:{runId:$run,head:$head},artifact:{id:$artifact,zipSha256:$zipDigest},appimage:{member:"Devsy_linux_x86_64.AppImage",sha256:$appimage},launchAttempts:[],windowCandidates:{},verifiedWindows:{},windowPidLinkage:{},sessionResult:"not_started",scope:"Exact D485 AppImage artifact integrity verified; no application launch or GNOME window candidate observed yet."}' \
            > "$proof_dir/proof.json"

      - name: Preflight GNOME package size before installing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          packages=(dbus-daemon gnome-shell libfuse2t64 mesa-utils x11-utils xwayland xvfb)
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          plan="$proof_dir/apt-plan.log"
          selected_file="$proof_dir/apt-selected-packages.txt"
          update_log="$proof_dir/apt-update.log"
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update 2>&1 | tee "$update_log"
          if grep -Eq '^(Err:|W:|E:)' "$update_log"; then
            echo "::error::APT update reported repository errors; refusing to use stale or partial package indexes"
            exit 1
          fi
          apt-get -s --no-install-recommends install "${packages[@]}" > "$plan"
          grep -E '^[0-9]+ upgraded,' "$plan"
          : > "$selected_file"
          declare -A selected_packages=()
          download_bytes=0
          installed_kib=0
          while read -r package version; do
            [ -n "$package" ] || continue
            if [[ -n "${selected_packages[$package]+x}" ]]; then
              echo "::error::APT simulation selected $package more than once"
              exit 1
            fi
            selected_packages["$package"]=1
            metadata=$(apt-cache show "$package=$version")
            sizes=$(printf '%s\n' "$metadata" | awk -v wanted_version="$version" '
              BEGIN { RS = ""; FS = "\n" }
              {
                paragraphs++
                versions = downloads = installs = 0
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^Version: /) {
                    actual_version = $i
                    sub(/^Version: /, "", actual_version)
                    versions++
                  } else if ($i ~ /^Size: /) {
                    download = $i
                    sub(/^Size: /, "", download)
                    downloads++
                  } else if ($i ~ /^Installed-Size: /) {
                    installed = $i
                    sub(/^Installed-Size: /, "", installed)
                    installs++
                  }
                }
              }
              END {
                if (paragraphs == 1 && versions == 1 && actual_version == wanted_version &&
                    downloads == 1 && installs == 1 &&
                    download ~ /^[0-9]+$/ && installed ~ /^[0-9]+$/)
                  print download, installed
              }')
            read -r package_bytes package_kib <<< "$sizes"
            if ! [[ "$package_bytes" =~ ^[0-9]+$ && "$package_kib" =~ ^[0-9]+$ ]]; then
              echo "::error::missing or ambiguous exact size metadata for $package=$version"
              exit 1
            fi
            printf '%s=%s\n' "$package" "$version" >> "$selected_file"
            download_bytes=$((download_bytes + package_bytes))
            installed_kib=$((installed_kib + package_kib))
          done < <(awk '$1 == "Inst" { package=$2; version=$3; if (version ~ /^\[/) version=$4; gsub(/[\[\]()]/, "", version); print package, version }' "$plan")
          planned_packages=${#selected_packages[@]}
          installed_bytes=$((installed_kib * 1024))
          printf 'APT preflight: planned_packages=%s download_bytes=%s installed_bytes=%s\n' \
            "$planned_packages" "$download_bytes" "$installed_bytes" \
            | tee "$proof_dir/size-preflight.txt"
          if (( planned_packages == 0 )); then
            echo "::error::APT simulation selected no packages; refusing an unbounded or empty GNOME install"
            exit 1
          fi
          if (( download_bytes == 0 )); then
            echo "::error::APT archive sizes are missing; refusing install"
            exit 1
          fi
          if (( download_bytes > 536870912 || installed_bytes > 2147483648 )); then
            echo "::error::GNOME probe dependencies exceed the 512 MiB download or 2 GiB installed-size cap"
            exit 1
          fi

      - name: Probe the selected package on Ubuntu archive endpoints
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          selected_file="$proof_dir/apt-selected-packages.txt"
          package="libjavascriptcoregtk-6.0-1"
          : >"$proof_dir/archive-probe.txt"
          policy_exit=0
          apt-cache policy "$package" \
            >"$proof_dir/apt-cache-policy.stdout.txt" \
            2>"$proof_dir/apt-cache-policy.stderr.txt" || policy_exit=$?
          printf 'apt_cache_policy_exit=%s\n' "$policy_exit" >>"$proof_dir/archive-probe.txt"
          source_files="$proof_dir/apt-source-files.txt"
          : >"$source_files"
          for source_path in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            source_name=${source_path##*/}
            if [[ -r "$source_path" ]]; then
              copy_exit=0
              cp "$source_path" "$proof_dir/$source_name" 2>"$proof_dir/$source_name.copy.stderr.txt" || copy_exit=$?
              printf '%s status=present copy_exit=%s\n' "$source_path" "$copy_exit" >>"$source_files"
            else
              printf '%s status=unavailable\n' "$source_path" >>"$source_files"
            fi
          done
          version_exit=0
          version=$(awk -F= -v package="$package" '$1 == package { count++; value=substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1; print value }' "$selected_file") || version_exit=$?
          printf 'selected_version_exit=%s\n' "$version_exit" >>"$proof_dir/archive-probe.txt"
          if (( version_exit != 0 )) || [[ -z "$version" ]]; then
            echo "::error::Selected package version is missing or ambiguous for $package"
            exit 1
          fi
          metadata_file="$proof_dir/apt-package-metadata.stdout.txt"
          metadata_exit=0
          apt-cache show "$package=$version" >"$metadata_file" 2>"$proof_dir/apt-package-metadata.stderr.txt" || metadata_exit=$?
          printf 'apt_cache_show_exit=%s\n' "$metadata_exit" >>"$proof_dir/archive-probe.txt"
          if (( metadata_exit != 0 )); then
            echo "::error::APT metadata lookup failed for $package=$version; see captured stdout/stderr and exit status."
            exit 1
          fi
          metadata_parse_exit=0
          record=$(awk -v wanted_package="$package" -v wanted_version="$version" '
            BEGIN { RS = ""; FS = "\n" }
            {
              stanzas++
              package_count = version_count = size_count = filename_count = hash_count = 0
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^Package: /) { actual_package = $i; sub(/^Package: /, "", actual_package); package_count++ }
                else if ($i ~ /^Version: /) { actual_version = $i; sub(/^Version: /, "", actual_version); version_count++ }
                else if ($i ~ /^Size: /) { size = $i; sub(/^Size: /, "", size); size_count++ }
                else if ($i ~ /^Filename: /) { filename = $i; sub(/^Filename: /, "", filename); filename_count++ }
                else if ($i ~ /^SHA256: /) { sha256 = $i; sub(/^SHA256: /, "", sha256); hash_count++ }
              }
            }
            END {
              if (stanzas == 1 && package_count == 1 && actual_package == wanted_package &&
                  version_count == 1 && actual_version == wanted_version && size_count == 1 &&
                  filename_count == 1 && hash_count == 1 && size ~ /^[0-9]+$/ && size + 0 > 0 &&
                  filename ~ /^pool\/[A-Za-z0-9._\/+:-]+\.deb$/ &&
                  length(sha256) == 64 && sha256 !~ /[^[:xdigit:]]/)
                print filename, size, tolower(sha256)
              else
                exit 1
            }' "$metadata_file" 2>"$proof_dir/apt-package-metadata-parser.stderr.txt") || metadata_parse_exit=$?
          printf 'metadata_parser_exit=%s\n' "$metadata_parse_exit" >>"$proof_dir/archive-probe.txt"
          if (( metadata_parse_exit != 0 )) || [[ -z "$record" ]]; then
            echo "::error::APT metadata is missing, duplicated, or invalid for $package=$version; see captured metadata and parser diagnostics."
            exit 1
          fi
          read -r filename expected_size expected_sha256 <<< "$record"
          max_bytes=8388608
          printf 'package=%s\nversion=%s\nsize=%s\nfilename=%s\nsha256=%s\nprobe_endpoint_name=azure-http\nprobe_endpoint_url=http://azure.archive.ubuntu.com/ubuntu\n' \
            "$package" "$version" "$expected_size" "$filename" "$expected_sha256" \
            >>"$proof_dir/archive-probe.txt"
          if (( expected_size > max_bytes )); then
            echo "::error::Selected $package=$version exceeds the 8 MiB mirror-probe limit"
            exit 1
          fi
          temp_dir=$(mktemp -d "$RUNNER_TEMP/archive-probe.XXXXXX")
          trap 'rm -rf "$temp_dir"' EXIT
          region=$(curl --fail --silent --show-error --noproxy '*' --connect-timeout 1 --max-time 2 --max-filesize 64 \
            -H 'Metadata:true' -H 'Accept:text/plain' \
            'http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text' \
            2>/dev/null || true)
          if [[ "$region" =~ ^[a-z0-9-]{1,32}$ ]]; then
            printf 'runner_region=%s\n' "$region" >>"$proof_dir/archive-probe.txt"
          else
            printf 'runner_region=unavailable\n' >>"$proof_dir/archive-probe.txt"
          fi
          for host in azure.archive.ubuntu.com archive.ubuntu.com; do
            dns_file="$temp_dir/$host.dns"
            dns_status=0
            timeout --signal=TERM --kill-after=1s 5s getent ahosts "$host" >"$dns_file" 2>/dev/null || dns_status=$?
            if (( dns_status == 0 )); then
              addresses=$(awk '!seen[$1]++ { printf "%s%s", separator, $1; separator="," } END { print "" }' "$dns_file")
              if [[ -n "$addresses" ]]; then
                printf '%s_dns_ips=%s\n%s_dns_status=ok\n' "$host" "$addresses" "$host" >>"$proof_dir/archive-probe.txt"
              else
                printf '%s_dns_status=no_addresses\n' "$host" >>"$proof_dir/archive-probe.txt"
              fi
            else
              printf '%s_dns_status=failed_%s\n' "$host" "$dns_status" >>"$proof_dir/archive-probe.txt"
            fi
          done
          probe() {
            name=$1
            url=$2
            file="$temp_dir/$name.deb"
            metrics="$proof_dir/$name-metrics.txt"
            curl_exit=0
            curl --fail --silent --show-error --location --max-redirs 5 --retry 0 \
              --connect-timeout 5 --max-time 20 --max-filesize "$max_bytes" \
              --proto '=http,https' --proto-redir '=http,https' \
              --output "$file" \
              --write-out 'http_status=%{http_code}\neffective_url=%{url_effective}\nremote_ip=%{remote_ip}\ntime_total=%{time_total}\nsize_download=%{size_download}\n' \
              "$url" >"$metrics" 2>"$proof_dir/$name-curl-error.txt" || curl_exit=$?
            printf 'curl_exit=%s\n' "$curl_exit" >>"$metrics"
            if (( curl_exit != 0 )) || [[ ! -f "$file" ]]; then
              printf 'verified=false\n' >>"$metrics"
              return 1
            fi
            actual_size=$(stat -c '%s' "$file")
            actual_sha256=$(sha256sum "$file")
            actual_sha256=${actual_sha256%% *}
            printf 'actual_size=%s\nactual_sha256=%s\n' "$actual_size" "$actual_sha256" >>"$metrics"
            if [[ "$actual_size" == "$expected_size" && "$actual_sha256" == "$expected_sha256" ]]; then
              printf 'verified=true\n' >>"$metrics"
              return 0
            fi
            printf 'verified=false\n' >>"$metrics"
            return 1
          }
          azure_ok=0
          official_ok=0
          probe azure-http "http://azure.archive.ubuntu.com/ubuntu/$filename" || azure_ok=$?
          probe official-https "https://archive.ubuntu.com/ubuntu/$filename" || official_ok=$?
          if (( azure_ok == 0 )); then
            printf 'result=azure_package_matches_signed_index\n' >>"$proof_dir/archive-probe.txt"
            exit 0
          fi
          if (( official_ok == 0 )); then
            printf 'result=azure_failed_official_package_matches_signed_index\n' >>"$proof_dir/archive-probe.txt"
            echo "::error::Azure package probe failed but official archive served the indexed bytes; stopping before APT install rather than switching the repository source."
          else
            printf 'result=both_package_probes_failed_or_mismatched\n' >>"$proof_dir/archive-probe.txt"
            echo "::error::Neither bounded package probe verified the bytes; stopping before APT install."
          fi
          exit 1

      - name: Install bounded GNOME probe dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          mapfile -t selected_specs < "$proof_dir/apt-selected-packages.txt"
          if ((${#selected_specs[@]})); then
            sudo apt-get install --no-install-recommends -y "${selected_specs[@]}"
          fi
          printf 'Selected exact APT package versions:\n'
          cat "$proof_dir/apt-selected-packages.txt"
          printf 'Installed package versions:\n' > "$proof_dir/installed-package-versions.txt"
          for spec in "${selected_specs[@]}"; do
            package="${spec%%=*}"
            selected_version="${spec#*=}"
            actual_version=$(dpkg-query -W -f="\${Version}" "$package")
            test "$actual_version" = "$selected_version"
            printf '%s=%s\n' "$package" "$actual_version" \
              | tee -a "$proof_dir/installed-package-versions.txt"
          done
          gnome-shell --version | tee "$proof_dir/gnome-versions.txt"
          dpkg-query -W -f="\${binary:Package} \${Version}\n" 'mutter*' | tee -a "$proof_dir/gnome-versions.txt"
      - name: Launch AppImage in isolated Wayland and X11 GNOME sessions
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          appimage="$RUNNER_TEMP/devsy-linux/Devsy_linux_x86_64.AppImage"
          profile="$RUNNER_TEMP/gnome-profile"
          mkdir -p "$profile"
          chmod +x "$appimage"
          export APPIMAGE_PATH="$appimage" PROOF_DIR="$proof_dir" VERIFY_WINDOW_SCRIPT="$proof_dir/verify-window.py"
          export HOME="$profile/home"
          export XDG_CONFIG_HOME="$profile/config"
          export XDG_DATA_HOME="$profile/data"
          export XDG_CACHE_HOME="$profile/cache"
          export XDG_STATE_HOME="$profile/state"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=swrast
          cat > "$proof_dir/verify-window.py" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          EXPECTED_WM_CLASS = "sh.devsy.app"
          EXPECTED_TITLE = "Devsy"

          def parse_candidates(text, expected_type="any"):
              blocks = re.findall(r"uint64\s+(\d+)\s*:\s*\{([^{}]*)\}", text, re.S)

              def property_value(block, key):
                  match = re.search(rf"['\"]?{re.escape(key)}['\"]?\s*:\s*<([^>]*)>", block)
                  return match.group(1).strip() if match else ""

              candidates = []
              for window_id, block in blocks:
                  title = property_value(block, "title").strip("'\"")
                  app_id = property_value(block, "app-id").strip("'\"")
                  wm_class = property_value(block, "wm-class").strip("'\"")
                  client_type_match = re.search(r"(?:u?int\d+)\s+(\d+)", property_value(block, "client-type"))
                  hidden = property_value(block, "is-hidden")
                  focus = property_value(block, "has-focus")
                  if focus not in ("true", "false"):
                      continue
                  dimensions = {"hasFocus": focus == "true"}
                  for key in ("width", "height"):
                      match = re.search(r"(?:u?int\d+)\s+(\d+)", property_value(block, key))
                      if match:
                          dimensions[key] = int(match.group(1))
                  if not client_type_match or title != EXPECTED_TITLE or wm_class != EXPECTED_WM_CLASS:
                      continue
                  client_type = int(client_type_match.group(1))
                  if client_type not in (0, 1) or (expected_type != "any" and client_type != int(expected_type)):
                      continue
                  if hidden != "false" or dimensions.get("width", 0) <= 0 or dimensions.get("height", 0) <= 0:
                      continue
                  candidates.append({
                      "windowId": window_id,
                      "title": title,
                      "appId": app_id,
                      "wmClass": wm_class,
                      "clientType": client_type,
                      "isHidden": False,
                      **dimensions,
                  })
              return candidates

          if len(sys.argv) > 1 and sys.argv[1] == "--self-test":
              actual = """({uint64 44739516: {'app-id': <'window:1'>, 'client-type': <uint32 1>, 'is-hidden': <false>, 'has-focus': <false>, 'width': <uint32 1000>, 'height': <uint32 737>, 'title': <'Devsy'>, 'wm-class': <'sh.devsy.app'>}},)"""
              candidate = parse_candidates(actual)
              assert len(candidate) == 1
              assert candidate[0] == {
                  "windowId": "44739516", "title": "Devsy", "appId": "window:1",
                  "wmClass": "sh.devsy.app", "clientType": 1, "isHidden": False,
                  "hasFocus": False, "width": 1000, "height": 737,
              }
              assert parse_candidates(actual, "0") == []
              assert len(parse_candidates(actual.replace("<uint32 1>", "<uint32 0>"), "0")) == 1
              assert parse_candidates(actual.replace("sh.devsy.app", "other.app")) == []
              assert parse_candidates(actual.replace("'Devsy'", "'Other'")) == []
              assert parse_candidates(actual.replace("<false>", "<true>")) == []
              assert parse_candidates(actual.replace("<uint32 1000>", "<uint32 0>")) == []
              assert parse_candidates(actual.replace("<uint32 1>", "<uint32 2>")) == []
              arbitrary_id_only = actual.replace("window:1", "window:999").replace("sh.devsy.app", "other.app")
              assert parse_candidates(arbitrary_id_only) == []
              print("candidate fixtures passed: actual window:1 record is only a candidate; wrong class/title, hidden, invalid geometry/type, and arbitrary window-id-only records rejected")
              raise SystemExit(0)
          if len(sys.argv) > 1 and sys.argv[1] == "--attempt":
              backend = sys.argv[2]
              proof_path = Path(sys.argv[3])
              proof = json.loads(proof_path.read_text())
              proof.setdefault("launchAttempts", []).append(backend)
              proof["sessionResult"] = "appimage_launch_attempted"
              proof["scope"] = f"Exact AppImage process start attempted for {backend}; window candidate not yet observed."
              temporary = proof_path.with_suffix(".tmp")
              temporary.write_text(json.dumps(proof, indent=2) + "\n")
              temporary.replace(proof_path)
              raise SystemExit(0)

          if len(sys.argv) != 5:
              raise SystemExit("usage: verify-window.py OUTPUT EXPECTED_TYPE BACKEND PROOF_JSON")
          output_path = Path(sys.argv[1])
          expected_type = sys.argv[2]
          backend = sys.argv[3]
          proof_path = Path(sys.argv[4])
          candidates = parse_candidates(output_path.read_text(), expected_type)
          identity = {"candidateWindows": candidates}
          identity_path = proof_path.with_name(f"{backend}-window-identity.json")
          identity_path.write_text(json.dumps(identity, indent=2) + "\n")
          proof = json.loads(proof_path.read_text())
          proof.setdefault("windowCandidates", {})[backend] = candidates
          if len(candidates) == 1:
              proof["sessionResult"] = "candidate_observed_unattributed"
              proof["scope"] = f"Raw GNOME window candidate observed in private {backend} session; PID and exact-AppImage attribution pending."
          elif candidates:
              proof["sessionResult"] = "ambiguous_window_candidates"
              proof["scope"] = f"Multiple raw GNOME window candidates observed in private {backend} session; exact-AppImage attribution was not attempted."
          else:
              proof["sessionResult"] = "no_exact_window_candidate"
              proof["scope"] = f"No exact Devsy WM_CLASS/title candidate appeared in private {backend} GetWindows output."
          temporary = proof_path.with_suffix(".tmp")
          temporary.write_text(json.dumps(proof, indent=2) + "\n")
          temporary.replace(proof_path)
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one exact-WM_CLASS/title candidate, observed {len(candidates)}")
          print(json.dumps(identity, sort_keys=True))
          PY
          cat > "$proof_dir/verify-window-link.py" <<'PY'
          import ast
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          ACTIVATE_CODE = lambda window_id: (
              "(() => { const w = global.get_window_actors().map(a => a.meta_window)"
              f".find(w => w.get_id() === {int(window_id)}); if (!w) return false;"
              "w.activate(global.get_current_time()); return true; })()"
          )
          FOCUS_CODE = (
              "(() => { const w = global.display.get_focus_window(); if (!w) return null;"
              "const r = w.get_frame_rect(); return [w.get_id(), w.get_pid(), w.get_client_type(),"
              "r.x, r.y, r.width, r.height]; })()"
          )
          EVAL_CODE = "global.get_window_actors().map(a => { const w = a.meta_window; const r = w.get_frame_rect(); return [w.get_id(), w.get_pid(), w.get_client_type(), r.x, r.y, r.width, r.height]; })"
          EXPECTED_APPIMAGE = "Devsy_linux_x86_64.AppImage"
          EXPECTED_EXECUTABLE = "devsy-desktop"
          EXPECTED_WM_CLASS = "sh.devsy.app"
          EXPECTED_TITLE = "Devsy"
          MOUNT_FIELDS = ("mountId", "device", "filesystemRoot", "mountpoint", "filesystem", "source")
          PROCESS_FIELDS = ("pid", "ppid", "startTicks", "uid", "exe", "exeSha256", "mount", "mountNamespace")

          def digest(value):
              return re.fullmatch(r"[0-9a-f]{64}", str(value or "")) is not None

          def exact_mount(mount, expected):
              if not isinstance(mount, dict) or any(mount.get(key) != expected.get(key) for key in MOUNT_FIELDS):
                  return False
              return (
                  isinstance(mount.get("mountId"), int) and mount["mountId"] > 0 and
                  re.fullmatch(r"\d+:\d+", str(mount.get("device", ""))) is not None and
                  Path(mount.get("filesystemRoot", "")).is_absolute() and
                  Path(mount.get("mountpoint", "")).is_absolute() and
                  mount.get("filesystem") == f"fuse.{EXPECTED_APPIMAGE}" and
                  mount.get("source") == EXPECTED_APPIMAGE
              )

          def exact_app_process(record, binding, require_initial_env=False):
              if not isinstance(record, dict):
                  return False
              expected = binding["mount"]
              mount = record.get("mount") or {}
              exe = Path(record.get("exe", ""))
              mountpoint = Path(expected.get("mountpoint", ""))
              appimage_path = record.get("appImagePath")
              appimage_hash = record.get("appImageSha256")
              try:
                  inside_mount = os.path.commonpath((str(mountpoint), str(exe))) == str(mountpoint)
              except ValueError:
                  inside_mount = False
              return (
                  record.get("pid", 0) > 0 and record.get("startTicks", 0) > 0 and
                  record.get("uid") == binding["uid"] and exe.is_absolute() and inside_mount and
                  digest(record.get("exeSha256")) and exact_mount(mount, expected) and
                  record.get("mountNamespace") == binding["mountNamespace"] and
                  (appimage_path is None or appimage_path == binding["appImagePath"]) and
                  (appimage_hash is None or appimage_hash == binding["appImageSha256"]) and
                  (not require_initial_env or (
                      appimage_path == binding["appImagePath"] and
                      appimage_hash == binding["appImageSha256"]
                  ))
              )

          def validate_snapshot(snapshot, binding, initial=False):
              if snapshot.get("appImagePath") != binding["appImagePath"] or \
                 snapshot.get("appImageSha256") != binding["appImageSha256"]:
                  raise ValueError("top-level AppImage path/hash differs from the immutable launch binding")
              if snapshot.get("rootPid") != binding["pid"] or \
                 snapshot.get("rootStartTicks") != binding["startTicks"]:
                  raise ValueError("AppImage root PID/start time changed")
              root = next((item for item in snapshot.get("processes", []) if item.get("pid") == binding["pid"]), None)
              if not root or any(root.get(key) != binding[key] for key in
                                 ("startTicks", "uid", "exe", "exeSha256", "mountNamespace")) or \
                 not exact_app_process(root, binding, require_initial_env=initial):
                  raise ValueError("AppImage root process no longer matches its initial mount/executable binding")
              return root

          def pin_binding(snapshot, proof, expected_path):
              expected_path = str(Path(expected_path))
              expected_hash = proof.get("appimage", {}).get("sha256")
              if not Path(expected_path).is_absolute() or Path(expected_path).name != EXPECTED_APPIMAGE or not digest(expected_hash):
                  raise ValueError("source AppImage path or expected artifact digest is invalid")
              if snapshot.get("appImagePath") != expected_path or snapshot.get("appImageSha256") != expected_hash:
                  raise ValueError("initial process snapshot does not match the independently verified source AppImage")
              root = next((item for item in snapshot.get("processes", []) if item.get("pid") == snapshot.get("rootPid")), None)
              if not root or root.get("appImagePath") != expected_path or root.get("appImageSha256") != expected_hash:
                  raise ValueError("initial AppImage root lacks exact APPIMAGE path/hash provenance")
              mount = root.get("mount") or {}
              exe = Path(root.get("exe", ""))
              mountpoint = Path(mount.get("mountpoint", ""))
              if exe.name != EXPECTED_EXECUTABLE or exe.parent != mountpoint or not digest(root.get("exeSha256")) or \
                 not isinstance(root.get("startTicks"), int) or root["startTicks"] <= 0 or \
                 not isinstance(root.get("uid"), int) or root["uid"] != os.getuid() or \
                 not isinstance(root.get("mountNamespace"), str) or \
                 not root["mountNamespace"] or not exact_mount(mount, mount):
                  raise ValueError("initial AppImage root lacks executable, birth, UID, or FUSE mount-instance identity")
              binding = {
                  "version": 1, "appImagePath": expected_path, "appImageSha256": expected_hash,
                  "pid": root["pid"], "startTicks": root["startTicks"], "uid": root["uid"],
                  "exe": root["exe"], "exeSha256": root["exeSha256"],
                  "mount": {key: mount[key] for key in MOUNT_FIELDS},
                  "mountNamespace": root["mountNamespace"],
              }
              validate_snapshot(snapshot, binding, initial=True)
              return binding

          def process_chain(pid, snapshot, binding):
              records = {item["pid"]: item for item in snapshot.get("processes", [])}
              chain = []
              seen = set()
              current = pid
              while current not in seen:
                  seen.add(current)
                  record = records.get(current)
                  if not record or not exact_app_process(record, binding):
                      raise ValueError("MetaWindow PID ancestry leaves the exact AppImage mount/namespace")
                  chain.append(record)
                  if current == binding["pid"]:
                      return chain
                  current = record.get("ppid")
                  if not isinstance(current, int) or current <= 0:
                      break
              raise ValueError("MetaWindow PID is not an actual descendant of the bound AppImage root")

          def linked_record(candidate, window, meta, before, after, binding, focus_before, focus_after):
              if candidate.get("wmClass") != EXPECTED_WM_CLASS or candidate.get("title") != EXPECTED_TITLE or \
                 window.get("wmClass") != EXPECTED_WM_CLASS or window.get("title") != EXPECTED_TITLE:
                  raise ValueError("candidate is not the exact Devsy WM_CLASS/title")
              if any(candidate.get(key) != window.get(key) for key in
                     ("windowId", "appId", "wmClass", "title", "clientType", "isHidden")):
                  raise ValueError("live GetWindows identity differs from its raw candidate")
              if not window.get("hasFocus") or window.get("isHidden") is not False:
                  raise ValueError("candidate is not the visible focused Shell window")
              if str(meta[0]) != window["windowId"] or int(meta[1]) <= 0 or int(meta[2]) != window["clientType"]:
                  raise ValueError("MetaWindow ID/PID/client type differs from GetWindows")
              if int(meta[5]) != window.get("width") or int(meta[6]) != window.get("height") or \
                 int(meta[5]) <= 0 or int(meta[6]) <= 0:
                  raise ValueError("MetaWindow geometry differs from focused GetWindows geometry")
              if focus_before != focus_after or str(focus_before[0]) != window["windowId"] or \
                 focus_before[1] != meta[1] or focus_before[2] != meta[2] or \
                 focus_before[5] != meta[5] or focus_before[6] != meta[6]:
                  raise ValueError("focused Shell window differs from the MetaWindow candidate")
              pid = int(meta[1])
              validated = []
              for snapshot in (before, after):
                  validate_snapshot(snapshot, binding)
                  chain = process_chain(pid, snapshot, binding)
                  target = chain[0]
                  if Path(target["exe"]).name != EXPECTED_EXECUTABLE or \
                     target.get("exeSha256") != binding["exeSha256"]:
                      raise ValueError("MetaWindow PID is not the expected bound Devsy executable")
                  validated.append((target, chain))
              def chain_identity(chain):
                  return [[record.get(key) for key in PROCESS_FIELDS] for record in chain]
              if chain_identity(validated[0][1]) != chain_identity(validated[1][1]):
                  raise ValueError("AppImage descendant ancestry changed around screenshot")
              if any(validated[0][0].get(key) != validated[1][0].get(key) for key in PROCESS_FIELDS):
                  raise ValueError("MetaWindow process identity changed around screenshot")
              return {
                  "candidate": candidate, "window": window,
                  "metaWindow": {"windowId": str(meta[0]), "pid": pid, "clientType": int(meta[2]),
                                 "x": int(meta[3]), "y": int(meta[4]), "width": int(meta[5]), "height": int(meta[6])},
                  "focus": {"windowId": str(focus_before[0]), "pid": int(focus_before[1]),
                            "clientType": int(focus_before[2]), "x": int(focus_before[3]),
                            "y": int(focus_before[4]), "width": int(focus_before[5]),
                            "height": int(focus_before[6])},
                  "appProcess": {key: validated[1][0].get(key) for key in PROCESS_FIELDS},
                  "rootBinding": binding,
              }

          def attribution_matches(candidate, linked, binding):
              window = linked.get("window") or {}
              meta = linked.get("metaWindow") or {}
              focus = linked.get("focus") or {}
              return (
                  linked.get("candidate") == candidate and
                  all(candidate.get(key) == window.get(key) for key in
                      ("windowId", "appId", "title", "wmClass", "clientType", "isHidden")) and
                  window.get("wmClass") == EXPECTED_WM_CLASS and window.get("title") == EXPECTED_TITLE and
                  window.get("isHidden") is False and window.get("hasFocus") is True and
                  window.get("width", 0) > 0 and window.get("height", 0) > 0 and
                  meta.get("windowId") == candidate.get("windowId") and meta.get("pid", 0) > 0 and
                  meta.get("pid") == focus.get("pid") and meta.get("pid") == (linked.get("appProcess") or {}).get("pid") and
                  focus.get("windowId") == candidate.get("windowId") and
                  focus.get("clientType") == window.get("clientType") and
                  linked.get("rootBinding") == binding
              )

          def parse_tuple(raw):
              match = re.fullmatch(r"\((true|false),\s*('.*')\)", raw.strip())
              if not match:
                  raise ValueError(f"unexpected GNOME Eval result: {raw}")
              return match.group(1) == "true", ast.literal_eval(match.group(2))

          def call(*args):
              result = subprocess.run(["gdbus", "call", "--session", *args], text=True,
                                      capture_output=True, check=True, timeout=10)
              return result.stdout.strip()
          def shell_eval(backend, expression, label):
              base = Path(label)
              command = ["gdbus", "call", "--session", "--dest", "org.gnome.Shell",
                         "--object-path", "/org/gnome/Shell", "--method", "org.gnome.Shell.Eval",
                         expression]
              try:
                  result = subprocess.run(command, text=True, capture_output=True, timeout=10)
              except subprocess.TimeoutExpired as error:
                  stdout = error.stdout.decode(errors="replace") if isinstance(error.stdout, bytes) else (error.stdout or "")
                  stderr = error.stderr.decode(errors="replace") if isinstance(error.stderr, bytes) else (error.stderr or "")
                  result_code, timed_out = None, True
              else:
                  stdout, stderr = result.stdout, result.stderr
                  result_code, timed_out = result.returncode, False
              base.with_name(base.name + "-stdout.txt").write_text(stdout)
              base.with_name(base.name + "-stderr.txt").write_text(stderr)
              diagnostic = {
                  "backend": backend, "method": "org.gnome.Shell.Eval", "objectPath": "/org/gnome/Shell",
                  "expression": expression, "returnCode": result_code, "timedOut": timed_out,
                  "evalSucceeded": None, "decodedType": None, "decodedValue": None,
              }
              if timed_out or result_code:
                  base.with_name(base.name + "-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
                  raise SystemExit("GNOME Shell Eval timed out or failed")
              try:
                  success, encoded = parse_tuple(stdout)
                  diagnostic["evalSucceeded"] = success
                  diagnostic["decodedType"] = type(encoded).__name__
                  if success:
                      value = json.loads(encoded)
                      diagnostic["decodedType"] = type(value).__name__
                      diagnostic["decodedValue"] = value
                  else:
                      diagnostic["decodedValue"] = encoded
                      value = None
              except (ValueError, SyntaxError, json.JSONDecodeError, TypeError) as error:
                  diagnostic["decodeError"] = str(error)
                  base.with_name(base.name + "-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
                  raise SystemExit("GNOME Shell Eval returned invalid tuple or single-layer JSON")
              base.with_name(base.name + "-decode.json").write_text(json.dumps(diagnostic, indent=2) + "\n")
              if not success:
                  raise SystemExit("GNOME Shell Eval refused the requested observation")
              return value

          def meta_window_snapshot(backend, candidate_id, proof_dir, capture_label):
              rows = shell_eval(backend, EVAL_CODE, Path(proof_dir) / f"{capture_label}-metawindow")
              if not isinstance(rows, list) or any(
                  not isinstance(row, list) or len(row) != 7 or
                  any(type(value) is not int for value in row) for row in rows
              ):
                  raise SystemExit("GNOME Shell MetaWindow Eval returned an unexpected row shape")
              return rows

          def focus_snapshot(backend, proof_dir, capture_label):
              result = shell_eval(backend, FOCUS_CODE, Path(proof_dir) / f"{capture_label}-focus")
              if result is None:
                  return None
              if not isinstance(result, list) or len(result) != 7 or any(type(value) is not int for value in result):
                  raise SystemExit("GNOME Shell focused-window Eval returned an unexpected row shape")
              return result

          def find_meta_window_row(rows, candidate_id):
              matches = [row for row in rows if str(row[0]) == candidate_id]
              if len(matches) != 1:
                  raise ValueError("GetWindows candidate ID did not map to exactly one MetaWindow")
              return matches[0]

          def current_window(window_id):
              raw = call("--dest", "org.gnome.Shell", "--object-path", "/org/gnome/Shell/Introspect",
                         "--method", "org.gnome.Shell.Introspect.GetWindows")
              blocks = re.findall(r"uint64\s+(\d+)\s*:\s*\{([^{}]*)\}", raw, re.S)
              block = next((value for key, value in blocks if key == window_id), None)
              if block is None:
                  raise ValueError("candidate window disappeared from GetWindows")
              def prop(key):
                  match = re.search(rf"['\"]?{re.escape(key)}['\"]?\s*:\s*<([^>]*)>", block)
                  return match.group(1).strip() if match else ""
              app_id = prop("app-id").strip("'\"")
              title = prop("title").strip("'\"")
              wm_class = prop("wm-class").strip("'\"")
              hidden = prop("is-hidden")
              focus = prop("has-focus")
              client_type = re.search(r"(?:u?int\d+)\s+(\d+)", prop("client-type"))
              width = re.search(r"(?:u?int\d+)\s+(\d+)", prop("width"))
              height = re.search(r"(?:u?int\d+)\s+(\d+)", prop("height"))
              if title != EXPECTED_TITLE or wm_class != EXPECTED_WM_CLASS or hidden != "false" or \
                 focus not in ("true", "false") or not client_type or not width or not height:
                  raise ValueError("live candidate no longer has exact visible Devsy WM_CLASS/title and geometry")
              return {"windowId": window_id, "title": title, "appId": app_id, "wmClass": wm_class,
                      "clientType": int(client_type.group(1)), "isHidden": False, "hasFocus": focus == "true",
                      "width": int(width.group(1)), "height": int(height.group(1))}

          def focused_candidate(backend, window_id, label, activate):
              if activate:
                  activated = shell_eval(
                      backend, ACTIVATE_CODE(window_id), Path(label).with_name(Path(label).name + "-activate")
                  )
                  if activated is not True:
                      raise SystemExit("GNOME Shell did not activate the exact candidate MetaWindow")
              deadline = time.monotonic() + 8
              last = None
              attempt = 0
              while time.monotonic() < deadline:
                  attempt += 1
                  focus = focus_snapshot(backend, Path(label).parent, f"{Path(label).name}-{attempt:02d}")
                  try:
                      window = current_window(window_id)
                  except (ValueError, subprocess.CalledProcessError, subprocess.TimeoutExpired):
                      window = None
                  if window and focus and window["hasFocus"] and str(focus[0]) == window_id and \
                     focus[2] == window["clientType"] and focus[5] == window["width"] and focus[6] == window["height"]:
                      return focus, window
                  last = {"focus": focus, "window": window}
                  time.sleep(0.25)
              raise SystemExit(f"exact candidate did not become the focused Shell window: {last}")

          def png_dimensions(path):
              import binascii
              import struct
              import zlib
              data = Path(path).read_bytes()
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise ValueError("ScreenshotWindow output is not a PNG")
              offset, width, height, bit_depth, color_type, compressed = 8, 0, 0, 0, 0, bytearray()
              seen_header = seen_end = seen_palette = seen_idat = idat_closed = False
              palette_entries = 0
              while offset + 12 <= len(data):
                  size = struct.unpack(">I", data[offset:offset + 4])[0]
                  kind = data[offset + 4:offset + 8]
                  end = offset + 12 + size
                  if end > len(data):
                      raise ValueError("PNG chunk is truncated")
                  payload = data[offset + 8:offset + 8 + size]
                  expected_crc = struct.unpack(">I", data[offset + 8 + size:end])[0]
                  if binascii.crc32(kind + payload) & 0xffffffff != expected_crc:
                      raise ValueError("PNG chunk CRC is invalid")
                  if not seen_header and kind != b"IHDR":
                      raise ValueError("PNG IHDR is not the first chunk")
                  if kind == b"IHDR":
                      if seen_header or size != 13 or offset != 8:
                          raise ValueError("PNG has an invalid IHDR")
                      width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack(">IIBBBBB", payload)
                      if width <= 0 or height <= 0 or width > 8192 or height > 8192 or \
                         width * height > 16_000_000 or compression or filtering or interlace:
                          raise ValueError("PNG dimensions or encoding are unsupported")
                      seen_header = True
                  elif kind == b"PLTE":
                      if not seen_header or seen_palette or seen_idat or size == 0 or size > 768 or size % 3:
                          raise ValueError("PNG palette is invalid or out of order")
                      seen_palette = True
                      palette_entries = size // 3
                  elif kind == b"IDAT":
                      if not seen_header or idat_closed:
                          raise ValueError("PNG IDAT ordering is invalid")
                      seen_idat = True
                      compressed.extend(payload)
                  elif kind == b"IEND":
                      if size or not seen_header or not seen_idat:
                          raise ValueError("PNG IEND is invalid")
                      seen_end = True
                      if end != len(data):
                          raise ValueError("PNG has trailing data")
                      break
                  elif not kind[0] & 0x20:
                      raise ValueError("PNG contains an unknown critical chunk")
                  elif seen_idat:
                      idat_closed = True
                  offset = end
              if not seen_header or not seen_end:
                  raise ValueError("PNG is incomplete")
              channels = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}.get(color_type)
              allowed_depths = {0: (1, 2, 4, 8, 16), 2: (8, 16), 3: (1, 2, 4, 8), 4: (8, 16), 6: (8, 16)}
              if channels is None or bit_depth not in allowed_depths[color_type] or \
                 (color_type == 3 and (not seen_palette or palette_entries > 1 << bit_depth)):
                  raise ValueError("PNG color type, palette, or bit depth is invalid")
              expected_size = height * (1 + (width * channels * bit_depth + 7) // 8)
              decoder = zlib.decompressobj()
              decoded = decoder.decompress(bytes(compressed), expected_size + 1)
              if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(decoded) != expected_size:
                  raise ValueError("PNG image data does not decode to its declared dimensions")
              row_size = (width * channels * bit_depth + 7) // 8
              if any(decoded[row * (row_size + 1)] > 4 for row in range(height)):
                  raise ValueError("PNG scanline filter is invalid")
              return {"width": width, "height": height, "bytes": len(data)}

          def run_bounded(command, timeout):
              try:
                  return subprocess.run(command, text=True, capture_output=True, timeout=timeout)
              except subprocess.TimeoutExpired as error:
                  stdout = error.stdout.decode(errors="replace") if isinstance(error.stdout, bytes) else (error.stdout or "")
                  stderr = error.stderr.decode(errors="replace") if isinstance(error.stderr, bytes) else (error.stderr or "")
                  return subprocess.CompletedProcess(command, None, stdout, stderr)
          def screenshot_window(backend, screenshot_path, link_path, proof_dir):
              target = Path(screenshot_path)
              target.unlink(missing_ok=True)
              link = json.loads(Path(link_path).read_text())
              focus = link["focus"]
              base = Path(proof_dir) / f"{backend}-screenshot-window-dbus"
              readiness_name = "wayland" if backend.startswith("wayland-") else "x11"
              readiness = json.loads((Path(proof_dir) / f"{readiness_name}-shell-readiness.json").read_text())
              shell_pid = readiness.get("shell", {}).get("pid")
              owner_command = [
                  "gdbus", "call", "--session", "--dest", "org.freedesktop.DBus",
                  "--object-path", "/org/freedesktop/DBus", "--method",
                  "org.freedesktop.DBus.GetNameOwner", "org.gnome.Shell.Screenshot",
              ]
              owner_result = run_bounded(owner_command, 10)
              owner = re.search(r"\('([^']+)'", owner_result.stdout)
              owner_pid = None
              owner_pid_stdout = ""
              owner_pid_stderr = ""
              owner_pid_return = None
              if owner_result.returncode == 0 and owner:
                  owner_pid_result = run_bounded([
                      "gdbus", "call", "--session", "--dest", "org.freedesktop.DBus",
                      "--object-path", "/org/freedesktop/DBus", "--method",
                      "org.freedesktop.DBus.GetConnectionUnixProcessID", owner.group(1),
                  ], 10)
                  owner_pid_stdout = owner_pid_result.stdout
                  owner_pid_stderr = owner_pid_result.stderr
                  owner_pid_return = owner_pid_result.returncode
                  match = re.search(r"uint32\s+(\d+)", owner_pid_stdout)
                  if owner_pid_result.returncode == 0 and match:
                      owner_pid = int(match.group(1))
              base.with_name(base.name + "-owner-stdout.txt").write_text(owner_result.stdout)
              base.with_name(base.name + "-owner-stderr.txt").write_text(owner_result.stderr)
              base.with_name(base.name + "-owner-pid-stdout.txt").write_text(owner_pid_stdout)
              base.with_name(base.name + "-owner-pid-stderr.txt").write_text(owner_pid_stderr)
              receipt = {
                  "backend": backend, "service": "org.gnome.Shell.Screenshot",
                  "objectPath": "/org/gnome/Shell/Screenshot", "method": "ScreenshotWindow",
                  "includeFrame": True, "includeCursor": False, "flash": False,
                  "requestedPath": str(target), "focusedWindowId": focus["windowId"],
                  "focusedPid": focus["pid"], "privateShellPid": shell_pid,
                  "serviceOwner": owner.group(1) if owner else None, "serviceOwnerPid": owner_pid,
                  "serviceOwnerReturnCode": owner_result.returncode,
                  "serviceOwnerPidReturnCode": owner_pid_return,
                  "methodInvoked": False, "returnCode": None, "success": False, "filenameUsed": None,
              }
              stdout, stderr = "", "ScreenshotWindow was not invoked."
              if owner_result.returncode == 0 and owner and owner_pid_return == 0 and owner_pid == shell_pid:
                  command = ["gdbus", "call", "--session", "--dest", "org.gnome.Shell.Screenshot",
                             "--object-path", "/org/gnome/Shell/Screenshot",
                             "--method", "org.gnome.Shell.Screenshot.ScreenshotWindow",
                             "true", "false", "false", str(target)]
                  receipt["methodInvoked"] = True
                  try:
                      result = subprocess.run(command, text=True, capture_output=True, timeout=30)
                      stdout, stderr, receipt["returnCode"] = result.stdout, result.stderr, result.returncode
                  except subprocess.TimeoutExpired as error:
                      stdout = error.stdout.decode(errors="replace") if isinstance(error.stdout, bytes) else (error.stdout or "")
                      stderr = error.stderr.decode(errors="replace") if isinstance(error.stderr, bytes) else (error.stderr or "")
                      receipt["timedOut"] = True
              else:
                  stderr = "ScreenshotWindow was blocked because the screenshot service owner was not the private GNOME Shell."
              base.with_name(base.name + "-stdout.txt").write_text(stdout)
              base.with_name(base.name + "-stderr.txt").write_text(stderr)
              if receipt["methodInvoked"] and receipt["returnCode"] == 0:
                  try:
                      success, filename = parse_tuple(stdout)
                      receipt["success"], receipt["filenameUsed"] = success, filename
                  except (ValueError, SyntaxError) as error:
                      receipt["decodeError"] = str(error)
              if receipt["success"] and receipt["filenameUsed"] == str(target) and target.is_file():
                  try:
                      receipt["png"] = png_dimensions(target)
                      import hashlib
                      receipt["pngSha256"] = hashlib.sha256(target.read_bytes()).hexdigest()
                  except (OSError, ValueError) as error:
                      receipt["pngError"] = str(error)
              receipt_path = base.with_name(base.name + "-receipt.json")
              receipt_path.write_text(json.dumps(receipt, indent=2) + "\n")
              if not receipt["methodInvoked"] or receipt["serviceOwnerPid"] != receipt["privateShellPid"] or \
                 receipt["returnCode"] != 0 or not receipt["success"] or receipt["filenameUsed"] != str(target) or \
                 not receipt.get("png"):
                  raise SystemExit("private ScreenshotWindow owner, receipt, exact output path, or decoded PNG validation failed")
              print(json.dumps(receipt, sort_keys=True))
          def validate_receipt(receipt_path, screenshot_path, before_link, after_link, backend):
              receipt = json.loads(Path(receipt_path).read_text())
              target = Path(screenshot_path)
              readiness_name = "wayland" if backend.startswith("wayland-") else "x11"
              readiness = json.loads((Path(receipt_path).parent / f"{readiness_name}-shell-readiness.json").read_text())
              shell_pid = readiness.get("shell", {}).get("pid")
              if receipt.get("service") != "org.gnome.Shell.Screenshot" or \
                 receipt.get("objectPath") != "/org/gnome/Shell/Screenshot" or \
                 receipt.get("method") != "ScreenshotWindow" or receipt.get("methodInvoked") is not True or \
                 receipt.get("serviceOwnerPid") != shell_pid or receipt.get("privateShellPid") != shell_pid or \
                 receipt.get("success") is not True or receipt.get("returnCode") != 0 or \
                 receipt.get("requestedPath") != str(target) or receipt.get("filenameUsed") != str(target):
                  raise ValueError("ScreenshotWindow receipt does not prove exact private-shell service, output path, and PNG")
              before_focus = before_link.get("focus") or {}
              after_focus = after_link.get("focus") or {}
              if before_focus != after_focus or receipt.get("focusedWindowId") != before_focus.get("windowId") or \
                 receipt.get("focusedPid") != before_focus.get("pid"):
                  raise ValueError("ScreenshotWindow receipt is not bound to the same focused MetaWindow and PID")
              for suffix in ("stdout.txt", "stderr.txt", "owner-stdout.txt", "owner-stderr.txt",
                             "owner-pid-stdout.txt", "owner-pid-stderr.txt"):
                  if not Path(receipt_path).with_name(Path(receipt_path).name.replace("receipt.json", suffix)).is_file():
                      raise ValueError("raw ScreenshotWindow service ownership or D-Bus output is missing")
              owner_stdout = Path(receipt_path).with_name(Path(receipt_path).name.replace("receipt.json", "owner-stdout.txt")).read_text()
              owner_pid_stdout = Path(receipt_path).with_name(Path(receipt_path).name.replace("receipt.json", "owner-pid-stdout.txt")).read_text()
              owner_match = re.search(r"\('([^']+)'", owner_stdout)
              owner_pid_match = re.search(r"uint32\s+(\d+)", owner_pid_stdout)
              if receipt.get("serviceOwnerReturnCode") != 0 or receipt.get("serviceOwnerPidReturnCode") != 0 or \
                 not owner_match or owner_match.group(1) != receipt.get("serviceOwner") or \
                 not owner_pid_match or int(owner_pid_match.group(1)) != receipt.get("serviceOwnerPid"):
                  raise ValueError("Screenshot service owner receipt differs from raw D-Bus ownership queries")
              raw_stdout_path = Path(receipt_path).with_name(Path(receipt_path).name.replace("receipt.json", "stdout.txt"))
              try:
                  raw_success, raw_filename = parse_tuple(raw_stdout_path.read_text())
              except (ValueError, SyntaxError) as error:
                  raise ValueError("raw ScreenshotWindow D-Bus reply is malformed") from error
              if (raw_success, raw_filename) != (receipt["success"], receipt["filenameUsed"]):
                  raise ValueError("ScreenshotWindow receipt differs from the preserved raw D-Bus reply")
              png = png_dimensions(target)
              import hashlib
              if receipt.get("png") != png or receipt.get("pngSha256") != hashlib.sha256(target.read_bytes()).hexdigest():
                  raise ValueError("ScreenshotWindow receipt does not match the decoded PNG bytes")
              return receipt

          def validate_backend(identity_path, binding_path, initial_path, observed_path,
                               before_path, after_path, before_link_path, after_link_path,
                               receipt_path, screenshot_path, expected_hash):
              binding = json.loads(Path(binding_path).read_text())
              initial_snapshot = json.loads(Path(initial_path).read_text())
              derived_binding = pin_binding(initial_snapshot, {"appimage": {"sha256": expected_hash}},
                                            binding.get("appImagePath", ""))
              if binding != derived_binding:
                  raise ValueError("immutable AppImage binding differs from the initial independently verified root")
              for path, initial in ((initial_path, True), (observed_path, False),
                                    (before_path, False), (after_path, False)):
                  validate_snapshot(json.loads(Path(path).read_text()), binding, initial=initial)
              candidate_list = json.loads(Path(identity_path).read_text()).get("candidateWindows", [])
              if len(candidate_list) != 1:
                  raise ValueError("backend did not retain exactly one raw window candidate")
              candidate = candidate_list[0]
              before_link = json.loads(Path(before_link_path).read_text())
              after_link = json.loads(Path(after_link_path).read_text())
              before = json.loads(Path(before_path).read_text())
              after = json.loads(Path(after_path).read_text())
              if before_link != after_link:
                  raise ValueError("same-window MetaWindow/process linkage changed around screenshot")
              if not attribution_matches(candidate, after_link, binding):
                  raise ValueError("raw candidate lacks focused same-window PID and immutable-root attribution")
              meta = after_link["metaWindow"]
              meta_row = [int(meta["windowId"]), meta["pid"], meta["clientType"], meta["x"], meta["y"],
                          meta["width"], meta["height"]]
              focus = after_link["focus"]
              focus_row = [int(focus["windowId"]), focus["pid"], focus["clientType"], focus["x"],
                           focus["y"], focus["width"], focus["height"]]
              recomputed = linked_record(candidate, after_link["window"], meta_row, before, after,
                                         binding, focus_row, focus_row)
              if recomputed != after_link:
                  raise ValueError("preserved linkage differs from actual before/after AppImage process snapshots")
              backend_name = Path(identity_path).name.removesuffix("-window-identity.json")
              receipt = validate_receipt(receipt_path, screenshot_path, before_link, after_link, backend_name)
              for snapshot_path in (before_path, after_path):
                  snapshot = json.loads(Path(snapshot_path).read_text())
                  for record in snapshot.get("processes", []):
                      if Path(record.get("exe", "")).name in {"devsy", EXPECTED_EXECUTABLE}:
                          process_chain(record["pid"], snapshot, binding)
              return {
                  "identity": candidate, "rootBinding": binding, "linkage": after_link,
                  "screenshotReceipt": receipt,
                  "processSnapshots": {"initial": initial_path, "observed": observed_path,
                                       "before": before_path, "after": after_path},
              }

          def main():
              if len(sys.argv) < 2:
                  raise SystemExit("usage: verify-window-link.py pin|validate-snapshot|capture|screenshot|compare|attribute|verify-backend")
              command = sys.argv[1]
              if command == "--self-test":
                  assert parse_tuple("(true, '[[1,2,3,4,5,6,7]]')") == (True, "[[1,2,3,4,5,6,7]]")
                  assert ACTIVATE_CODE(17).endswith("})()")
                  print("Eval tuple and activation expression fixtures passed")
                  return
              if command == "pin":
                  _, _, snapshot_path, proof_path, expected_path, output_path = sys.argv
                  binding = pin_binding(json.loads(Path(snapshot_path).read_text()),
                                        json.loads(Path(proof_path).read_text()), expected_path)
                  Path(output_path).write_text(json.dumps(binding, indent=2) + "\n")
                  print(json.dumps(binding, sort_keys=True))
                  return
              if command == "validate-snapshot":
                  _, _, snapshot_path, binding_path, initial = sys.argv
                  validate_snapshot(json.loads(Path(snapshot_path).read_text()),
                                    json.loads(Path(binding_path).read_text()), initial == "true")
                  print("snapshot matches immutable launch binding")
                  return
              if command == "capture":
                  _, _, stage, identity_path, binding_path, before_path, after_path, output = sys.argv
                  if stage not in ("before", "after"):
                      raise SystemExit("capture stage must be before or after")
                  identity = json.loads(Path(identity_path).read_text())
                  candidates = identity.get("candidateWindows", [])
                  if len(candidates) != 1:
                      raise SystemExit("expected exactly one raw Devsy window candidate")
                  candidate = candidates[0]
                  binding = json.loads(Path(binding_path).read_text())
                  before = json.loads(Path(before_path).read_text())
                  after = json.loads(Path(after_path).read_text())
                  validate_snapshot(before, binding)
                  validate_snapshot(after, binding)
                  label = Path(output).with_suffix("")
                  backend = Path(identity_path).name.removesuffix("-window-identity.json")
                  focus_before, _ = focused_candidate(
                      backend, candidate["windowId"], label, stage == "before"
                  )
                  focus_after, current = focused_candidate(
                      backend, candidate["windowId"], label.with_name(label.name + "-confirm"), False
                  )
                  rows = meta_window_snapshot(backend, candidate["windowId"], Path(identity_path).parent, label.name)
                  meta = find_meta_window_row(rows, candidate["windowId"])
                  linked = linked_record(candidate, current, meta, before, after, binding, focus_before, focus_after)
                  Path(output).write_text(json.dumps(linked, indent=2) + "\n")
                  print(json.dumps(linked, sort_keys=True))
                  return
              if command == "screenshot":
                  _, _, backend, screenshot_path, before_link, proof_dir = sys.argv
                  screenshot_window(backend, screenshot_path, before_link, proof_dir)
                  return
              if command == "compare":
                  before = json.loads(Path(sys.argv[2]).read_text())
                  after = json.loads(Path(sys.argv[3]).read_text())
                  if before != after:
                      raise SystemExit("window/PID/process identity changed around screenshot")
                  print("same focused candidate window and exact AppImage process identity observed before and after screenshot")
                  return
              if command == "attribute":
                  _, _, identity_path, before_link_path, after_link_path, receipt_path, proof_path, backend, screenshot_path, binding_path = sys.argv
                  proof = json.loads(Path(proof_path).read_text())
                  candidates = json.loads(Path(identity_path).read_text()).get("candidateWindows", [])
                  before_link = json.loads(Path(before_link_path).read_text())
                  after_link = json.loads(Path(after_link_path).read_text())
                  binding = json.loads(Path(binding_path).read_text())
                  if len(candidates) != 1 or proof.get("windowCandidates", {}).get(backend) != candidates or \
                     before_link != after_link or not attribution_matches(candidates[0], after_link, binding):
                      raise SystemExit("candidate lacks stable focused-window and immutable AppImage process linkage")
                  validate_receipt(receipt_path, screenshot_path, before_link, after_link, backend)
                  proof.setdefault("verifiedWindows", {})[backend] = [after_link["window"]]
                  proof.setdefault("windowPidLinkage", {})[backend] = after_link
                  proof["applicationLaunched"] = True
                  proof["sessionResult"] = "window_attributed"
                  proof["scope"] = f"GNOME candidate for {backend} was linked to the immutable AppImage process binding and focused-window ScreenshotWindow receipt; remaining checks pending."
                  Path(proof_path).write_text(json.dumps(proof, indent=2) + "\n")
                  print(f"verified window attribution recorded for {backend}")
                  return
              if command == "verify-backend":
                  _, _, identity, binding, initial, observed, before, after, before_link, after_link, receipt, screenshot, expected_hash = sys.argv
                  print(json.dumps(validate_backend(identity, binding, initial, observed, before, after,
                                                    before_link, after_link, receipt, screenshot, expected_hash),
                                   sort_keys=True))
                  return
              raise SystemExit("unknown verify-window-link command: " + command)

          if __name__ == "__main__":
              main()
