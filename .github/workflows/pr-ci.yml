name: Pull Request

# Disposable diagnostic branch only. This workflow is dispatch-only and is never merged.
on:
  workflow_dispatch:

permissions: {}

jobs:
  gnome-appimage-feasibility:
    name: Launch the final-head AppImage in isolated GNOME sessions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN_ID: "40320261347"
      SOURCE_HEAD_SHA: "d485425ea9a6202a0024678511c64fa80cecdc87"
      LINUX_ARTIFACT_ID: "12648983963"
      LINUX_ARTIFACT_DIGEST: "sha256:13eb34d933bd0e9f32a13db3d954a54f632dde91a1fbdd3feed65a18a70ac916"
    steps:
      - name: Checkout exact source used for the AppImage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: d485425ea9a6202a0024678511c64fa80cecdc87
          persist-credentials: false

      - name: Verify source run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/diag/1652-artifact-verification-69dad
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e \
            --argjson id "$SOURCE_RUN_ID" \
            --arg sha "$SOURCE_HEAD_SHA" \
            '.id == $id and .head_sha == $sha and .event == "pull_request" and .conclusion == "success"' \
            <<<"$run"

          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          jq -e \
            --argjson id "$LINUX_ARTIFACT_ID" \
            --arg digest "$LINUX_ARTIFACT_DIGEST" \
            'any(.artifacts[]; .id == $id and .name == "desktop-ubuntu-latest" and .digest == $digest and .expired == false)' \
            <<<"$artifacts"

      - name: Download and verify the exact Linux artifact once
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/linux-artifact.zip"
          artifact_dir="$RUNNER_TEMP/devsy-linux"
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          mkdir -p "$artifact_dir" "$proof_dir"
          headers="$RUNNER_TEMP/artifact.headers"
          response="$RUNNER_TEMP/artifact.response"
          status=$(curl --silent --show-error \
            --dump-header "$headers" \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LINUX_ARTIFACT_ID/zip")
          if [ "$status" != 302 ]; then
            rm -f "$headers" "$response"
            echo "::error::artifact API did not return a redirect (HTTP $status)"
            exit 1
          fi
          location=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "$headers")
          rm -f "$headers" "$response"
          if [ -z "$location" ]; then
            echo "::error::artifact API redirect did not include a download location"
            exit 1
          fi
          if ! curl --location --fail --silent --output "$artifact_zip" "$location" 2>/dev/null; then
            unset location
            echo "::error::artifact archive transfer failed (URL redacted)"
            exit 1
          fi
          unset location GH_TOKEN
          printf '%s  %s\n' "${LINUX_ARTIFACT_DIGEST#sha256:}" "$artifact_zip" | sha256sum --check
          unzip -q "$artifact_zip" -d "$artifact_dir"
          appimage="$artifact_dir/Devsy_linux_x86_64.AppImage"
          test -s "$appimage"
          appimage_sha=$(sha256sum "$appimage" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$appimage_sha" "$appimage" | tee "$proof_dir/appimage-sha256.txt"
          jq -n \
            --arg run "$SOURCE_RUN_ID" \
            --arg head "$SOURCE_HEAD_SHA" \
            --arg artifact "$LINUX_ARTIFACT_ID" \
            --arg zipDigest "$LINUX_ARTIFACT_DIGEST" \
            --arg appimage "$appimage_sha" \
            '{source:{runId:$run,head:$head},artifact:{id:$artifact,zipSha256:$zipDigest},appimage:{member:"Devsy_linux_x86_64.AppImage",sha256:$appimage},launchAttempts:[],observedWindows:{},sessionResult:"not_started",scope:"Exact D485 AppImage artifact integrity verified; no application launch or GNOME window observed yet."}' \
            > "$proof_dir/proof.json"

      - name: Preflight GNOME package size before installing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          packages=(dbus-daemon gnome-shell gnome-screenshot libfuse2t64 mesa-utils x11-utils xdotool xwayland xvfb)
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          plan="$proof_dir/apt-plan.log"
          selected_file="$proof_dir/apt-selected-packages.txt"
          update_log="$proof_dir/apt-update.log"
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update 2>&1 | tee "$update_log"
          if grep -Eq '^(Err:|W:|E:)' "$update_log"; then
            echo "::error::APT update reported repository errors; refusing to use stale or partial package indexes"
            exit 1
          fi
          apt-get -s --no-install-recommends install "${packages[@]}" > "$plan"
          grep -E '^[0-9]+ upgraded,' "$plan"
          : > "$selected_file"
          declare -A selected_packages=()
          download_bytes=0
          installed_kib=0
          while read -r package version; do
            [ -n "$package" ] || continue
            if [[ -n "${selected_packages[$package]+x}" ]]; then
              echo "::error::APT simulation selected $package more than once"
              exit 1
            fi
            selected_packages["$package"]=1
            metadata=$(apt-cache show "$package=$version")
            sizes=$(printf '%s\n' "$metadata" | awk -v wanted_version="$version" '
              BEGIN { RS = ""; FS = "\n" }
              {
                paragraphs++
                versions = downloads = installs = 0
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^Version: /) {
                    actual_version = $i
                    sub(/^Version: /, "", actual_version)
                    versions++
                  } else if ($i ~ /^Size: /) {
                    download = $i
                    sub(/^Size: /, "", download)
                    downloads++
                  } else if ($i ~ /^Installed-Size: /) {
                    installed = $i
                    sub(/^Installed-Size: /, "", installed)
                    installs++
                  }
                }
              }
              END {
                if (paragraphs == 1 && versions == 1 && actual_version == wanted_version &&
                    downloads == 1 && installs == 1 &&
                    download ~ /^[0-9]+$/ && installed ~ /^[0-9]+$/)
                  print download, installed
              }')
            read -r package_bytes package_kib <<< "$sizes"
            if ! [[ "$package_bytes" =~ ^[0-9]+$ && "$package_kib" =~ ^[0-9]+$ ]]; then
              echo "::error::missing or ambiguous exact size metadata for $package=$version"
              exit 1
            fi
            printf '%s=%s\n' "$package" "$version" >> "$selected_file"
            download_bytes=$((download_bytes + package_bytes))
            installed_kib=$((installed_kib + package_kib))
          done < <(awk '$1 == "Inst" { package=$2; version=$3; if (version ~ /^\[/) version=$4; gsub(/[\[\]()]/, "", version); print package, version }' "$plan")
          planned_packages=${#selected_packages[@]}
          installed_bytes=$((installed_kib * 1024))
          printf 'APT preflight: planned_packages=%s download_bytes=%s installed_bytes=%s\n' \
            "$planned_packages" "$download_bytes" "$installed_bytes" \
            | tee "$proof_dir/size-preflight.txt"
          if (( planned_packages == 0 )); then
            echo "::error::APT simulation selected no packages; refusing an unbounded or empty GNOME install"
            exit 1
          fi
          if (( download_bytes == 0 )); then
            echo "::error::APT archive sizes are missing; refusing install"
            exit 1
          fi
          if (( download_bytes > 536870912 || installed_bytes > 2147483648 )); then
            echo "::error::GNOME probe dependencies exceed the 512 MiB download or 2 GiB installed-size cap"
            exit 1
          fi

      - name: Install bounded GNOME probe dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          mapfile -t selected_specs < "$proof_dir/apt-selected-packages.txt"
          if ((${#selected_specs[@]})); then
            sudo apt-get install --no-install-recommends -y "${selected_specs[@]}"
          fi
          printf 'Selected exact APT package versions:\n'
          cat "$proof_dir/apt-selected-packages.txt"
          printf 'Installed package versions:\n' > "$proof_dir/installed-package-versions.txt"
          for spec in "${selected_specs[@]}"; do
            package="${spec%%=*}"
            selected_version="${spec#*=}"
            actual_version=$(dpkg-query -W -f="\${Version}" "$package")
            test "$actual_version" = "$selected_version"
            printf '%s=%s\n' "$package" "$actual_version" \
              | tee -a "$proof_dir/installed-package-versions.txt"
          done
          gnome-shell --version | tee "$proof_dir/gnome-versions.txt"
          dpkg-query -W -f="\${binary:Package} \${Version}\n" 'mutter*' | tee -a "$proof_dir/gnome-versions.txt"
      - name: Launch AppImage in isolated Wayland and X11 GNOME sessions
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gnome-feasibility-proof"
          appimage="$RUNNER_TEMP/devsy-linux/Devsy_linux_x86_64.AppImage"
          profile="$RUNNER_TEMP/gnome-profile"
          mkdir -p "$profile"
          chmod +x "$appimage"
          export APPIMAGE_PATH="$appimage" PROOF_DIR="$proof_dir" VERIFY_WINDOW_SCRIPT="$proof_dir/verify-window.py"
          export HOME="$profile/home"
          export XDG_CONFIG_HOME="$profile/config"
          export XDG_DATA_HOME="$profile/data"
          export XDG_CACHE_HOME="$profile/cache"
          export XDG_STATE_HOME="$profile/state"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=swrast
          cat > "$proof_dir/verify-window.py" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          if sys.argv[1] == "--attempt":
              backend = sys.argv[2]
              proof_path = Path(sys.argv[3])
              proof = json.loads(proof_path.read_text())
              proof.setdefault("launchAttempts", []).append(backend)
              proof["sessionResult"] = "launch_attempted_no_window"
              proof["scope"] = f"AppImage process start attempted for {backend}; no GNOME window observed yet."
              temporary = proof_path.with_suffix(".tmp")
              temporary.write_text(json.dumps(proof, indent=2) + "\n")
              temporary.replace(proof_path)
              raise SystemExit(0)

          if len(sys.argv) != 5:
              raise SystemExit("usage: verify-window.py OUTPUT EXPECTED_TYPE BACKEND PROOF_JSON")
          text = Path(sys.argv[1]).read_text()
          expected_type = sys.argv[2]
          backend = sys.argv[3]
          proof_path = Path(sys.argv[4])
          window_blocks = re.findall(r"uint64\s+(\d+)\s*:\s*\{([^{}]*)\}", text, re.S)

          def property_value(block, key):
              match = re.search(rf"['\"]?{re.escape(key)}['\"]?\s*:\s*<([^>]*)>", block)
              return match.group(1).strip() if match else ""

          matches = []
          for window_id, block in window_blocks:
              title = property_value(block, "title").strip("'\"")
              app_id = property_value(block, "app-id").strip("'\"")
              wm_class = property_value(block, "wm-class").strip("'\"")
              client_type_match = re.search(r"(?:u?int\d+)\s+(\d+)", property_value(block, "client-type"))
              if not client_type_match or not re.search(r"devsy", " ".join((title, app_id, wm_class)), re.I):
                  continue
              client_type = int(client_type_match.group(1))
              if expected_type != "any" and client_type != int(expected_type):
                  continue
              matches.append({
                  "windowId": window_id,
                  "title": title,
                  "appId": app_id,
                  "wmClass": wm_class,
                  "clientType": client_type,
              })

          if not matches:
              raise SystemExit("no GNOME window matched Devsy identity and expected client type")
          identity = {"matchingWindows": matches}
          identity_path = proof_path.with_name(f"{backend}-window-identity.json")
          identity_path.write_text(json.dumps(identity, indent=2) + "\n")
          proof = json.loads(proof_path.read_text())
          proof.setdefault("observedWindows", {})[backend] = matches
          proof["applicationLaunched"] = True
          proof["sessionResult"] = "partial"
          proof["scope"] = f"Devsy window observed in private {backend} GNOME session; remaining checks pending."
          temporary = proof_path.with_suffix(".tmp")
          temporary.write_text(json.dumps(proof, indent=2) + "\n")
          temporary.replace(proof_path)
          print(json.dumps(identity, sort_keys=True))
          PY
          chmod 700 "$proof_dir/verify-window.py"
          cat > "$proof_dir/process-audit.py" <<'PY'
          import hashlib
          import json
          import os
          import re
          import signal
          import stat
          import sys
          import time
          from pathlib import Path

          HASH_CACHE = {}

          def hash_file(path):
              info = os.stat(path)
              key = (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns)
              if key not in HASH_CACHE:
                  digest = hashlib.sha256()
                  with open(path, "rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(chunk)
                  HASH_CACHE[key] = digest.hexdigest()
              return HASH_CACHE[key]

          def mount_info(root, exe):
              target = exe.removesuffix(" (deleted)")
              matches = []
              try:
                  lines = (root / "mountinfo").read_text().splitlines()
              except OSError:
                  return None
              for line in lines:
                  before, separator, after = line.partition(" - ")
                  if not separator:
                      continue
                  fields = before.split()
                  mountpoint = re.sub(r"\\([0-7]{3})", lambda m: chr(int(m.group(1), 8)), fields[4])
                  if target == mountpoint or target.startswith(mountpoint.rstrip("/") + "/"):
                      after_fields = after.split()
                      matches.append((len(mountpoint), {
                          "mountpoint": mountpoint,
                          "filesystem": after_fields[0],
                          "source": after_fields[1] if len(after_fields) > 1 else "",
                      }))
              return max(matches, key=lambda match: match[0])[1] if matches else None

          def proc_record(pid, detailed=False):
              root = Path("/proc") / str(pid)
              try:
                  raw_stat = (root / "stat").read_text()
                  fields = raw_stat[raw_stat.rfind(")") + 2:].split()
                  exe = os.readlink(root / "exe")
                  record = {
                      "pid": pid,
                      "ppid": int(fields[1]),
                      "pgrp": int(fields[2]),
                      "sid": int(fields[3]),
                      "startTicks": int(fields[19]),
                      "uid": root.stat().st_uid,
                      "exe": exe,
                  }
                  if not detailed:
                      return record
                  env = {}
                  for item in (root / "environ").read_bytes().split(b"\0"):
                      key, separator, value = item.partition(b"=")
                      if separator and key in {b"APPIMAGE", b"DISPLAY", b"WAYLAND_DISPLAY", b"XDG_RUNTIME_DIR", b"XAUTHORITY"}:
                          env[key.decode()] = value.decode(errors="replace")
                  image_path = env.get("APPIMAGE")
                  record.update({
                      "exeSha256": hash_file(root / "exe"),
                      "argv": [x.decode(errors="replace") for x in (root / "cmdline").read_bytes().split(b"\0") if x],
                      "mount": mount_info(root, exe),
                      "appImagePath": image_path,
                      "appImageSha256": hash_file(image_path) if image_path and Path(image_path).is_file() else None,
                      "display": env.get("DISPLAY"),
                      "waylandDisplay": env.get("WAYLAND_DISPLAY"),
                      "runtimeDir": env.get("XDG_RUNTIME_DIR"),
                      "xauthorityPath": env.get("XAUTHORITY"),
                  })
                  return record
              except (OSError, ValueError, IndexError):
                  return None

          def all_processes(detailed=False):
              records = {}
              for entry in Path("/proc").iterdir():
                  if entry.name.isdigit():
                      record = proc_record(int(entry.name), detailed)
                      if record:
                          records[record["pid"]] = record
              return records


          def owned_tree(root_pid, records):
              root = records.get(root_pid)
              if not root:
                  return []
              children = {}
              for record in records.values():
                  if record["uid"] == root["uid"]:
                      children.setdefault(record["ppid"], []).append(record["pid"])
              selected = {root_pid}
              pending = [root_pid]
              while pending:
                  parent = pending.pop()
                  for child in children.get(parent, []):
                      if child not in selected:
                          selected.add(child)
                          pending.append(child)
              selected.update(record["pid"] for record in records.values()
                              if record["uid"] == root["uid"] and
                              (record["sid"] == root["sid"] or record["pgrp"] == root_pid))
              return [records[pid] for pid in sorted(selected) if pid in records]

          def write_json(path, value):
              Path(path).write_text(json.dumps(value, indent=2) + "\n")

          def version_hints(path):
              try:
                  return re.findall(r"current=([^ ]+)", Path(path).read_text())
              except OSError:
                  return []

          def find_display(shell_pid, shell_log, output):
              shell = proc_record(shell_pid)
              if not shell:
                  raise SystemExit("owned Mutter process is missing")
              log_matches = re.findall(r"Using public X11 display ([^,\s]+)", Path(shell_log).read_text())
              records = all_processes()
              members = owned_tree(shell_pid, records)
              candidates = []
              for basic in members:
                  try:
                      args = [arg.decode(errors="replace") for arg in (Path("/proc") / str(basic["pid"]) / "cmdline").read_bytes().split(b"\0") if arg]
                  except OSError:
                      continue
                  if Path(basic["exe"]).name != "Xwayland" and not any("Xwayland" in arg for arg in args):
                      continue
                  record = proc_record(basic["pid"], detailed=True)
                  if not record:
                      continue
                  args = record["argv"]
                  displays = [arg for arg in args if re.fullmatch(r":\d+(?:\.\d+)?", arg)]
                  auth = None
                  if "-auth" in args:
                      index = args.index("-auth")
                      if index + 1 < len(args):
                          auth = args[index + 1]
                  if not auth:
                      auth = record["xauthorityPath"]
                  candidates.append((record, displays[0] if displays else None, auth))
              if len(log_matches) != 1 or len(candidates) != 1:
                  raise SystemExit("could not uniquely identify the owned nested Xwayland display")
              xwayland, display, auth = candidates[0]
              if not display or display != log_matches[0] or xwayland["sid"] != shell["sid"]:
                  raise SystemExit("nested Xwayland display did not match the owned Mutter session")
              auth_path = Path(auth).resolve(strict=True) if auth else None
              if not auth_path or not auth_path.is_file() or auth_path.stat().st_uid != shell["uid"]:
                  raise SystemExit("owned nested Xwayland authority file is unavailable")
              display_number = display[1:].split(".", 1)[0]
              socket_path = Path("/tmp/.X11-unix") / f"X{display_number}"
              if not socket_path.exists() or not stat.S_ISSOCK(socket_path.stat().st_mode):
                  raise SystemExit("nested Xwayland socket is missing")
              info = {
                  "display": display,
                  "xwaylandPid": xwayland["pid"],
                  "xwaylandStartTicks": xwayland["startTicks"],
                  "xwaylandExe": xwayland["exe"],
                  "xauthorityPath": str(auth_path),
                  "xauthorityMode": oct(stat.S_IMODE(auth_path.stat().st_mode)),
                  "socketPath": str(socket_path),
                  "shellPid": shell_pid,
                  "shellStartTicks": shell["startTicks"],
              }
              write_json(output, info)
              print(json.dumps(info, sort_keys=True))

          def snapshot(root_pid, image_path, log_path, output):
              records = all_processes()
              members = owned_tree(root_pid, records)
              if not members:
                  raise SystemExit("AppImage root process disappeared before process snapshot")
              members = [proc_record(item["pid"], detailed=True) for item in members]
              members = [item for item in members if item]
              image_sha = hash_file(image_path)
              proof = {
                  "rootPid": root_pid,
                  "rootStartTicks": next(item["startTicks"] for item in members if item["pid"] == root_pid),
                  "appImagePath": image_path,
                  "appImageSha256": image_sha,
                  "reportedVersions": version_hints(log_path),
                  "processes": members,
              }
              write_json(output, proof)
              print(json.dumps({"rootPid": root_pid, "processCount": len(members),
                                "reportedVersions": proof["reportedVersions"],
                                "appImageSha256": image_sha}, sort_keys=True))

          def stop_tree(root_pid, baseline_path, output):
              baseline = json.loads(Path(baseline_path).read_text()) if Path(baseline_path).is_file() else {}
              expected_start = baseline.get("rootStartTicks")
              known = {
                  record["pid"]: {"startTicks": record["startTicks"], "uid": record["uid"]}
                  for record in baseline.get("processes", [])
              }

              def refresh():
                  records = all_processes()
                  current = owned_tree(root_pid, records)
                  root = next((item for item in current if item["pid"] == root_pid), None)
                  if root and expected_start is not None and root["startTicks"] != expected_start:
                      raise SystemExit("AppImage root PID was reused; refusing to signal it")
                  if root is None:
                      tracked = []
                      for pid, identity in known.items():
                          record = records.get(pid)
                          if record and record["startTicks"] == identity["startTicks"] and record["uid"] == identity["uid"]:
                              tracked.extend(owned_tree(pid, records))
                      current = list({record["pid"]: record for record in tracked}.values())
                  for record in current:
                      known.setdefault(record["pid"], {
                          "startTicks": record["startTicks"],
                          "uid": record["uid"],
                      })
                  return records, current

              def signal_known(records, sig):
                  for pid in sorted(known, key=lambda value: value == root_pid):
                      identity = known[pid]
                      record = records.get(pid)
                      if not record or record["startTicks"] != identity["startTicks"] or record["uid"] != identity["uid"]:
                          continue
                      if expected_start is not None and pid == root_pid and identity["startTicks"] != expected_start:
                          continue
                      try:
                          os.kill(pid, sig)
                      except ProcessLookupError:
                          pass

              def survivors_now():
                  records = all_processes()
                  return [
                      {"pid": pid, **identity, "exe": records[pid]["exe"]}
                      for pid, identity in known.items()
                      if pid in records and records[pid]["startTicks"] == identity["startTicks"] and
                      records[pid]["uid"] == identity["uid"]
                  ]

              records, current = refresh()
              signal_known(records, signal.SIGTERM)
              deadline = time.monotonic() + 5
              while time.monotonic() < deadline:
                  records, current = refresh()
                  if not current and not survivors_now():
                      break
                  signal_known(records, signal.SIGTERM)
                  time.sleep(0.2)
              records, current = refresh()
              signal_known(records, signal.SIGKILL)
              deadline = time.monotonic() + 5
              while time.monotonic() < deadline:
                  records, current = refresh()
                  survivors = survivors_now()
                  if not survivors and not current:
                      break
                  time.sleep(0.2)
              records, current = refresh()
              survivors = survivors_now()
              result = {"rootPid": root_pid, "trackedProcessCount": len(known),
                        "survivors": survivors, "remainingTree": current}
              write_json(output, result)
              print(json.dumps(result, sort_keys=True))
              if survivors or current:
                  raise SystemExit("owned AppImage processes survived bounded cleanup")

          if sys.argv[1] == "display":
              find_display(int(sys.argv[2]), sys.argv[3], sys.argv[4])
          elif sys.argv[1] == "snapshot":
              snapshot(int(sys.argv[2]), sys.argv[3], sys.argv[4], sys.argv[5])
          elif sys.argv[1] == "stop":
              stop_tree(int(sys.argv[2]), sys.argv[3], sys.argv[4])
          else:
              raise SystemExit("usage: process-audit.py display|snapshot|stop ...")
          PY
          chmod 700 "$proof_dir/process-audit.py"
          cat > "$proof_dir/validate-owned-window.py" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def validate(expected, current, properties, window_count, display):
              if window_count != 1 or display != expected["display"]:
                  raise ValueError("owned host display/window is not unique")
              if current["shell"] != expected["shell"] or current["xvfb"] != expected["xvfb"]:
                  raise ValueError("owned GNOME Shell or Xvfb process identity changed")
              if expected["shell"]["uid"] != expected["xvfb"]["uid"]:
                  raise ValueError("owned GNOME Shell and Xvfb run under different users")
              if Path(expected["shell"]["exe"]).name != "gnome-shell":
                  raise ValueError("owned shell executable is not gnome-shell")
              if Path(expected["xvfb"]["exe"]).name != "Xvfb" or display not in expected["xvfb"]["argv"]:
                  raise ValueError("host display is not owned by the expected Xvfb process")
              pid = re.search(r"_NET_WM_PID\(CARDINAL\)\s*=\s*(\d+)", properties)
              if not pid or int(pid.group(1)) != expected["shell"]["pid"]:
                  raise ValueError("window _NET_WM_PID does not match the owned shell")
              wm_class = re.search(r"WM_CLASS\(STRING\)\s*=\s*(.*)", properties)
              return {"display": display, "shell": expected["shell"], "xvfb": expected["xvfb"],
                      "wmClass": wm_class.group(1).strip() if wm_class else None,
                      "wmClassOptional": True}

          def process_identity(pid):
              root = Path("/proc") / str(pid)
              raw = (root / "stat").read_text()
              fields = raw[raw.rfind(")") + 2:].split()
              return {"pid": int(pid), "startTicks": int(fields[19]),
                      "uid": root.stat().st_uid, "exe": os.readlink(root / "exe"),
                      "argv": [arg.decode(errors="replace") for arg in (root / "cmdline").read_bytes().split(b"\0") if arg]}


          if sys.argv[1] == "self-test":
              shell = {"pid": 41, "startTicks": 100, "uid": 1000, "exe": "/usr/bin/gnome-shell", "argv": []}
              xvfb = {"pid": 42, "startTicks": 101, "uid": 1000, "exe": "/usr/bin/Xvfb", "argv": [":99"]}
              expected = {"display": ":99", "shell": shell, "xvfb": xvfb}
              assert validate(expected, expected, "_NET_WM_PID(CARDINAL) = 41", 1, ":99")["wmClass"] is None
              assert validate(expected, expected,
                              '_NET_WM_PID(CARDINAL) = 41\nWM_CLASS(STRING) = "gnome-shell", "Gnome-shell"',
                              1, ":99")["wmClass"] == '"gnome-shell", "Gnome-shell"'
              invalid = [
                  ("_NET_WM_PID(CARDINAL) = 43", 1, ":99", expected),
                  ("_NET_WM_PID(CARDINAL) = 41", 2, ":99", expected),
                  ("_NET_WM_PID(CARDINAL) = 41", 1, ":88", expected),
              ]
              for properties, count, display, current in invalid:
                  try:
                      validate(expected, current, properties, count, display)
                  except ValueError:
                      continue
                  raise AssertionError("invalid window identity was accepted")
              for field, value in (("startTicks", 99), ("uid", 1001), ("exe", "/usr/bin/not-shell")):
                  changed = {**expected, "shell": {**shell, field: value}}
                  try:
                      validate(expected, changed, "_NET_WM_PID(CARDINAL) = 41", 1, ":99")
                  except ValueError:
                      continue
                  raise AssertionError(f"changed shell {field} was accepted")
              print("owned host-window synthetic identity cases passed")
          elif sys.argv[1] == "capture":
              value = {"display": sys.argv[4], "shell": process_identity(sys.argv[2]),
                       "xvfb": process_identity(sys.argv[3])}
              if Path(value["shell"]["exe"]).name != "gnome-shell" or Path(value["xvfb"]["exe"]).name != "Xvfb":
                  raise SystemExit("owned shell/Xvfb executable identity mismatch")
              Path(sys.argv[5]).write_text(json.dumps(value, indent=2) + "\n")
          elif sys.argv[1] == "verify":
              expected = json.loads(Path(sys.argv[2]).read_text())
              current = {"shell": process_identity(expected["shell"]["pid"]),
                         "xvfb": process_identity(expected["xvfb"]["pid"])}
              result = validate(expected, current, Path(sys.argv[3]).read_text(),
                                int(sys.argv[4]), sys.argv[5])
              Path(sys.argv[6]).write_text(json.dumps(result, indent=2) + "\n")
              print(json.dumps(result, sort_keys=True))
          else:
              raise SystemExit("usage: validate-owned-window.py self-test|capture|verify")
          PY
          chmod 700 "$proof_dir/validate-owned-window.py"
          python3 "$proof_dir/validate-owned-window.py" self-test
          export OWNED_WINDOW_GUARD="$proof_dir/validate-owned-window.py"
          cat > "$proof_dir/enable-private-introspection.sh" <<'SH'
          enable_private_introspection() {
            local backend="$1" shell_pid="$2" host_display="$3" private_display="$4"
            local stem="$PROOF_DIR/introspection-$backend"
            local method="org.gnome.Shell.Introspect.GetWindows"
            local expression="global.context.unsafe_mode = true"
            local window_ids window_id window_properties focused identity_file
            local -a windows

            capture_failure() {
              env -u WAYLAND_DISPLAY -u XAUTHORITY DISPLAY="$host_display" \
                gnome-screenshot --file="$PROOF_DIR/introspection-$backend-failure-host.png" \
                >"$stem-screenshot.log" 2>&1 || true
            }
            run_host_display() {
              env -u XAUTHORITY DISPLAY="$host_display" "$@"
            }

            cat >"$stem-sources.txt" <<'REFS'
          Introspect access check: https://raw.githubusercontent.com/GNOME/gnome-shell/46.0/js/misc/introspect.js
          sender-checker authorization: https://raw.githubusercontent.com/GNOME/gnome-shell/46.0/js/misc/util.js
          unsafe_mode control: https://raw.githubusercontent.com/GNOME/gnome-shell/46.0/js/ui/lookingGlass.js
          REFS
            if timeout 10s gdbus call --session --dest org.gnome.Shell \
              --object-path /org/gnome/Shell/Introspect --method "$method" \
              >"$stem-before.txt" 2>"$stem-before.err"; then
              printf 'backend=%s status=already-accessible shellPid=%s privateDisplay=%s typedExpression=none\n' \
                "$backend" "$shell_pid" "$private_display" >"$stem-setup.txt"
              return 0
            fi
            if ! grep -Fq 'org.freedesktop.DBus.Error.AccessDenied' "$stem-before.err"; then
              printf 'backend=%s status=preflight-error shellPid=%s privateDisplay=%s\n' \
                "$backend" "$shell_pid" "$private_display" >"$stem-setup.txt"
              capture_failure
              return 1
            fi
            if [ "$backend" = wayland ]; then
              identity_file="$PROOF_DIR/introspection-$backend-owned-identity.json"
              if ! python3 "$OWNED_WINDOW_GUARD" capture "$shell_pid" "$HOST_XVFB_PID" \
                "$host_display" "$identity_file" >"$stem-identity-capture.log" 2>"$stem-identity-capture.err"; then
                printf 'backend=%s status=owned-shell-or-xvfb-identity-unavailable shellPid=%s\n' \
                  "$backend" "$shell_pid" >"$stem-setup.txt"
                capture_failure
                return 1
              fi
              window_ids=$(run_host_display xdotool search --onlyvisible --pid "$shell_pid" 2>"$stem-window-search.err" || true)
              windows=()
              if [ -n "$window_ids" ]; then
                mapfile -t windows <<<"$window_ids"
              fi
              if [ "${#windows[@]}" -ne 1 ]; then
                printf 'backend=%s status=owned-shell-window-not-unique count=%s shellPid=%s\n' \
                  "$backend" "${#windows[@]}" "$shell_pid" >"$stem-setup.txt"
                capture_failure
                return 1
              fi
              window_id="${windows[0]}"
              if ! window_properties=$(run_host_display xprop -id "$window_id" _NET_WM_PID WM_CLASS 2>"$stem-xprop.err"); then
                printf 'backend=%s status=owned-shell-window-properties-unavailable windowId=%s\n' \
                  "$backend" "$window_id" >"$stem-setup.txt"
                capture_failure
                return 1
              fi
              printf '%s\n' "$window_properties" >"$stem-shell-window.txt"
              if ! python3 "$OWNED_WINDOW_GUARD" verify "$identity_file" "$stem-shell-window.txt" \
                "${#windows[@]}" "$host_display" "$stem-shell-window-identity.json" \
                >"$stem-shell-window-identity.log" 2>"$stem-shell-window-identity.err"; then
                printf 'backend=%s status=host-window-identity-mismatch windowId=%s shellPid=%s\n' \
                  "$backend" "$window_id" "$shell_pid" >"$stem-setup.txt"
                capture_failure
                return 1
              fi
              if ! run_host_display xdotool windowfocus --sync "$window_id" ||
                ! focused=$(run_host_display xdotool getwindowfocus) ||
                [ "$focused" != "$window_id" ]; then
                printf 'backend=%s status=owned-shell-window-focus-failed windowId=%s focused=%s\n' \
                  "$backend" "$window_id" "${focused:-unknown}" >"$stem-setup.txt"
                capture_failure
                return 1
              fi
              if ! run_host_display xdotool key --clearmodifiers Escape ||
                ! focused=$(run_host_display xdotool getwindowfocus) ||
                [ "$focused" != "$window_id" ]; then
                printf 'backend=%s status=owned-shell-window-focus-lost-after-overview-dismissal windowId=%s focused=%s\n' \
                  "$backend" "$window_id" "${focused:-unknown}" >"$stem-setup.txt"
                capture_failure
                return 1
              fi
            elif [ "$backend" != x11 ] || [ "$private_display" != "$host_display" ]; then
              printf 'backend=%s status=unsupported-private-display-routing\n' "$backend" >"$stem-setup.txt"
              capture_failure
              return 1
            fi

            printf 'backend=%s status=access-denied; using Looking Glass in the disposable private GNOME session shellPid=%s privateDisplay=%s typedExpression=%s\n' \
              "$backend" "$shell_pid" "$private_display" "$expression" >"$stem-setup.txt"
            if ! run_host_display xdotool key --clearmodifiers Alt+F2 ||
              ! run_host_display xdotool type --clearmodifiers --delay 40 lg; then
              capture_failure
              return 1
            fi
            if ! run_host_display xdotool key Return; then
              capture_failure
              return 1
            fi
            sleep 2
            if ! run_host_display xdotool type --clearmodifiers --delay 10 "$expression"; then
              run_host_display xdotool key --clearmodifiers Escape || true
              capture_failure
              return 1
            fi
            if ! run_host_display xdotool key Return; then
              run_host_display xdotool key --clearmodifiers Escape || true
              capture_failure
              return 1
            fi
            sleep 1
            if ! run_host_display xdotool key --clearmodifiers Escape; then
              capture_failure
              return 1
            fi
            sleep 1
            if ! timeout 10s gdbus call --session --dest org.gnome.Shell \
              --object-path /org/gnome/Shell/Introspect --method "$method" \
              >"$stem-after.txt" 2>"$stem-after.err"; then
              printf 'backend=%s status=enablement-unverified\n' "$backend" >>"$stem-setup.txt"
              capture_failure
              return 1
            fi
            printf 'status=enabled-and-confirmed\n' >>"$stem-setup.txt"
          }
          SH
          chmod 700 "$proof_dir/enable-private-introspection.sh"
          export PRIVATE_INTROSPECTION_SCRIPT="$proof_dir/enable-private-introspection.sh"
          export PROCESS_AUDIT_SCRIPT="$proof_dir/process-audit.py"
          HOST_DISPLAY="${DISPLAY:-:99}"
          Xvfb "$HOST_DISPLAY" -screen 0 1280x800x24 -nolisten tcp > "$proof_dir/xvfb.log" 2>&1 &
          xvfb_pid=$!
          export HOST_XVFB_PID="$xvfb_pid"
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY="$HOST_DISPLAY"
          timeout 30s bash -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.25; done'
          glxinfo -B | tee "$proof_dir/host-software-renderer.txt"
          grep -Eiq 'llvmpipe|softpipe|swrast' "$proof_dir/host-software-renderer.txt"

          run_wayland_session() {
            local runtime="$profile/wayland-runtime"
            mkdir -p "$runtime"
            chmod 700 "$runtime"
            export XDG_RUNTIME_DIR="$runtime"
            # shellcheck disable=SC2016
            dbus-run-session -- bash -euo pipefail -c '
              host_display="$DISPLAY"
              setsid gnome-shell --wayland --nested --sm-disable >"$PROOF_DIR/gnome-wayland-shell.log" 2>&1 &
              shell_pid=$!
              app_pid=
              app_baseline=
              cleanup_app() {
                if [ -n "$app_pid" ]; then
                  python3 "$PROCESS_AUDIT_SCRIPT" stop "$app_pid" "$app_baseline" "$PROOF_DIR/$(basename "$app_baseline" .json)-cleanup.json" || return $?
                  wait "$app_pid" 2>/dev/null || true
                  app_pid=
                fi
              }
              cleanup() {
                status=0
                cleanup_app || status=$?
                kill -- "-$shell_pid" 2>/dev/null || true
                wait "$shell_pid" 2>/dev/null || true
                return "$status"
              }
              trap cleanup EXIT
              for attempt in $(seq 1 180); do
                compgen -G "$XDG_RUNTIME_DIR/wayland-*" >/dev/null && break
                sleep 0.25
              done
              wayland_socket=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name "wayland-*" -print -quit)
              test -n "$wayland_socket"
              export WAYLAND_DISPLAY="${wayland_socket##*/}"
              gnome-shell --version | tee "$PROOF_DIR/gnome-wayland-version.txt"
              display_json="$PROOF_DIR/nested-wayland-display.json"
              for attempt in $(seq 1 60); do
                if python3 "$PROCESS_AUDIT_SCRIPT" display "$shell_pid" "$PROOF_DIR/gnome-wayland-shell.log" "$display_json" \
                  >>"$PROOF_DIR/nested-display-discovery.log" 2>&1; then
                  break
                fi
                sleep 0.5
              done
              test -s "$display_json"
              nested_display=$(jq -er ".display" "$display_json")
              nested_auth=$(jq -er ".xauthorityPath" "$display_json")
              timeout 10s env DISPLAY="$nested_display" XAUTHORITY="$nested_auth" xdpyinfo >"$PROOF_DIR/nested-xdpyinfo.txt"
              timeout 30s env DISPLAY="$nested_display" XAUTHORITY="$nested_auth" glxinfo -B | tee "$PROOF_DIR/nested-software-renderer.txt"
              export DISPLAY="$nested_display" XAUTHORITY="$nested_auth"
              # shellcheck disable=SC1090
              source "$PRIVATE_INTROSPECTION_SCRIPT"
              enable_private_introspection wayland "$shell_pid" "$host_display" "$nested_display"
              start_app() {
                backend=$1
                logfile=$2
                app_baseline="$PROOF_DIR/$backend-process-before.json"
                shift 2
                setsid "$APPIMAGE_PATH" "$@" >"$logfile" 2>&1 &
                app_pid=$!
                python3 "$VERIFY_WINDOW_SCRIPT" --attempt "$backend" "$PROOF_DIR/proof.json"
                python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$logfile" "$app_baseline"
              }
              observe_app() {
                backend=$1
                expected_type=$2
                output="$PROOF_DIR/$backend-windows.txt"
                identity="$PROOF_DIR/$backend-window-identity.json"
                for attempt in $(seq 1 60); do
                  if gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell/Introspect \
                    --method org.gnome.Shell.Introspect.GetWindows >"$output" 2>"$output.err" \
                    && python3 "$VERIFY_WINDOW_SCRIPT" "$output" "$expected_type" "$backend" "$PROOF_DIR/proof.json" \
                      >"$PROOF_DIR/$backend-window-match.json" 2>"$PROOF_DIR/$backend-window-parser.err"; then
                    break
                  fi
                  sleep 0.5
                done
                test -s "$identity"
                python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-$backend.log" \
                  "$PROOF_DIR/$backend-process-after.json"
                cat "$output" >"$PROOF_DIR/$backend-window-observation.txt"
              }
              start_app wayland-default "$PROOF_DIR/devsy-wayland-default.log"
              observe_app wayland-default any
              default_client_type=$(jq -er ".matchingWindows[0].clientType" "$PROOF_DIR/wayland-default-window-identity.json")
              printf "backend=wayland client-type=%s launchargs=none(default) app_pid=%s\n" "$default_client_type" "$app_pid" \
                >"$PROOF_DIR/wayland-default-launch-mode.txt"
              if [ "$default_client_type" = 0 ]; then
                env -u WAYLAND_DISPLAY -u XAUTHORITY DISPLAY="$host_display" gnome-screenshot --file="$PROOF_DIR/wayland.png"
              elif [ "$default_client_type" = 1 ]; then
                cleanup_app
                start_app wayland-forced "$PROOF_DIR/devsy-wayland-forced.log" --ozone-platform=wayland --enable-features=UseOzonePlatform
                observe_app wayland-forced 0
                env -u WAYLAND_DISPLAY -u XAUTHORITY DISPLAY="$host_display" gnome-screenshot --file="$PROOF_DIR/wayland.png"
                printf "backend=wayland client-type=0 launchargs=--ozone-platform=wayland --enable-features=UseOzonePlatform (forced probe; not default behavior) app_pid=%s\n" "$app_pid" \
                  >"$PROOF_DIR/wayland-forced-launch-mode.txt"
              else
                echo "Unexpected default Wayland client-type: $default_client_type" >&2
                exit 1
              fi
              test -s "$PROOF_DIR/wayland.png"
              cleanup_app
            '
          }
          run_wayland_session

          run_x11_session() {
            local runtime="$profile/x11-runtime"
            mkdir -p "$runtime"
            chmod 700 "$runtime"
            export XDG_RUNTIME_DIR="$runtime"
            # shellcheck disable=SC2016
            dbus-run-session -- bash -euo pipefail -c '
              host_display="$DISPLAY"
              unset WAYLAND_DISPLAY
              setsid gnome-shell --x11 --display="$host_display" --sm-disable >"$PROOF_DIR/gnome-x11-shell.log" 2>&1 &
              shell_pid=$!
              app_pid=
              app_baseline=
              cleanup_app() {
                if [ -n "$app_pid" ]; then
                  python3 "$PROCESS_AUDIT_SCRIPT" stop "$app_pid" "$app_baseline" "$PROOF_DIR/x11-process-cleanup.json" || return $?
                  wait "$app_pid" 2>/dev/null || true
                  app_pid=
                fi
              }
              cleanup() {
                status=0
                cleanup_app || status=$?
                kill -- "-$shell_pid" 2>/dev/null || true
                wait "$shell_pid" 2>/dev/null || true
                return "$status"
              }
              trap cleanup EXIT
              sleep 8
              kill -0 "$shell_pid"
              gnome-shell --version | tee "$PROOF_DIR/gnome-x11-version.txt"
              # shellcheck disable=SC1090
              source "$PRIVATE_INTROSPECTION_SCRIPT"
              enable_private_introspection x11 "$shell_pid" "$host_display" "$host_display"
              setsid "$APPIMAGE_PATH" >"$PROOF_DIR/devsy-x11.log" 2>&1 &
              app_pid=$!
              app_baseline="$PROOF_DIR/x11-process-before.json"
              python3 "$VERIFY_WINDOW_SCRIPT" --attempt x11 "$PROOF_DIR/proof.json"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-x11.log" "$app_baseline"
              output="$PROOF_DIR/x11-windows.txt"
              identity="$PROOF_DIR/x11-window-identity.json"
              for attempt in $(seq 1 60); do
                if gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell/Introspect \
                  --method org.gnome.Shell.Introspect.GetWindows >"$output" 2>"$output.err" \
                  && python3 "$VERIFY_WINDOW_SCRIPT" "$output" 1 x11 "$PROOF_DIR/proof.json" \
                    >"$PROOF_DIR/x11-window-match.json" 2>"$PROOF_DIR/x11-window-parser.err"; then
                  break
                fi
                sleep 0.5
              done
              test -s "$identity"
              python3 "$PROCESS_AUDIT_SCRIPT" snapshot "$app_pid" "$APPIMAGE_PATH" "$PROOF_DIR/devsy-x11.log" "$PROOF_DIR/x11-process-after.json"
              cat "$output" >"$PROOF_DIR/x11-window-observation.txt"
              env -u WAYLAND_DISPLAY DISPLAY="$host_display" gnome-screenshot --file="$PROOF_DIR/x11.png"
              test -s "$PROOF_DIR/x11.png"
              printf "backend=x11 client-type=1 launchargs=none(default) app_pid=%s\n" "$app_pid" >"$PROOF_DIR/x11-launch-mode.txt"
              cleanup_app
            '
          }
          run_x11_session
          python3 - "$proof_dir/proof.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          proof_path = Path(sys.argv[1])
          proof = json.loads(proof_path.read_text())
          windows = proof.get("observedWindows", {})
          wayland_windows = windows.get("wayland-default", []) + windows.get("wayland-forced", [])
          if not any(window["clientType"] == 0 for window in wayland_windows):
              raise SystemExit("no actual Wayland client window was observed")
          if not any(window["clientType"] == 1 for window in windows.get("x11", [])):
              raise SystemExit("no actual X11 client window was observed")

          expected_hash = proof["appimage"]["sha256"]
          provenance = []
          errors = []
          for backend, observed in windows.items():
              if not observed:
                  continue
              before_path = proof_path.with_name(f"{backend}-process-before.json")
              after_path = proof_path.with_name(f"{backend}-process-after.json")
              if not before_path.is_file() or not after_path.is_file():
                  errors.append(f"{backend} is missing a before/after process snapshot")
                  continue
              before = json.loads(before_path.read_text())
              after = json.loads(after_path.read_text())
              before_root = next((item for item in before["processes"] if item["pid"] == before["rootPid"]), None)
              after_root = next((item for item in after["processes"] if item["pid"] == after["rootPid"]), None)
              same_process = bool(
                  before_root and after_root and
                  before["rootPid"] == after["rootPid"] and
                  before["rootStartTicks"] == after["rootStartTicks"] and
                  before_root["exe"] == after_root["exe"] and
                  before_root["exeSha256"] == after_root["exeSha256"] and
                  before_root["mount"] == after_root["mount"] and
                  before_root["appImageSha256"] == expected_hash and
                  after_root["appImageSha256"] == expected_hash
              )
              unexpected_app_processes = [
                  item for item in after["processes"]
                  if Path(item.get("exe", "")).name in {"devsy", "devsy-desktop"} and
                  item.get("appImageSha256") != expected_hash
              ]
              record = {
                  "backend": backend,
                  "windowIdentities": observed,
                  "rootPid": after.get("rootPid"),
                  "rootStartTicks": after.get("rootStartTicks"),
                  "rootExecutable": after_root.get("exe") if after_root else None,
                  "rootExecutableSha256": after_root.get("exeSha256") if after_root else None,
                  "mount": after_root.get("mount") if after_root else None,
                  "appImageSha256": after_root.get("appImageSha256") if after_root else None,
                  "sameAppImageProcessBeforeAndAfterWindow": same_process,
                  "unexpectedDevsyProcesses": unexpected_app_processes,
              }
              provenance.append(record)
              if not same_process or unexpected_app_processes:
                  errors.append(f"{backend} Devsy window is not associated with an unchanged process tree from the verified AppImage")
          proof["windowProcessProvenance"] = provenance
          if errors:
              proof["sessionResult"] = "window_observed_provenance_unverified"
              proof["scope"] = "Devsy window observed, but process snapshots do not establish an unchanged exact-AppImage process tree."
              proof_path.write_text(json.dumps(proof, indent=2) + "\n")
              raise SystemExit("; ".join(errors))
          proof["sessionResult"] = "passed"
          proof["scope"] = "The exact verified AppImage process tree remained unchanged across matching Devsy window observations in private GNOME Wayland and X11 sessions. GNOME 46 GetWindows exposes no PID; linkage is by process continuity and no updater-binary mismatch, not direct window PID. Software-rendered feasibility only, not the native desktop acceptance matrix."
          proof_path.write_text(json.dumps(proof, indent=2) + "\n")
          PY
          printf 'GNOME feasibility: verified AppImage process tree remained unchanged during Devsy Wayland client type 0 and X11 client type 1 observations; software-rendered private GNOME sessions; application not installed or released.\n' \
            | tee "$proof_dir/result.txt"

      - name: Upload bounded GNOME feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devsy-1652-gnome-feasibility
          path: ${{ runner.temp }}/gnome-feasibility-proof/
          if-no-files-found: warn
          retention-days: 7
