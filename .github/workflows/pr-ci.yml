            free-disk-space: false
            install-kind: false
            install-podman: true
            requires-secret: false
            test-timeout: 900s
            job-timeout-minutes: 20


    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job-timeout-minutes || 45 }}
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        background: true
        if: matrix.free-disk-space == true && runner.os == 'Linux' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        with:
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true'

      - name: install gnupg2
        if: runner.os == 'Linux' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        run: sudo apt-get install -y gnupg2

      - name: get operating system lowercase
        if: matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true'
        id: os
        shell: bash
        run: |
          OS=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          if [ "$OS" == "macos" ]; then
            OS="darwin"
          fi
          echo "runner_os=$OS" >> "$GITHUB_OUTPUT"

      - name: download Podman CI helper
        if: >
          (
            matrix.install-kind == true ||
            matrix.install-podman == true ||
            matrix.install-podman == 'rootless' ||
            matrix.install-podman == 'rootful'
          ) &&
          (runner.os == 'Windows' || runner.os == 'Linux') &&
          (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: devsy-ci-podman-${{ steps.os.outputs.runner_os }}
          path: ${{ runner.temp }}/devsy-ci-podman/

      - name: download CLI artifacts
        if: matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: devsy-${{ steps.os.outputs.runner_os }}
          path: ${{ runner.temp }}/devsy-bin/
          merge-multiple: true

      - name: download Linux CLI artifacts for Windows
        if: runner.os == 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: devsy-linux
          path: ${{ runner.temp }}/devsy-bin/
          merge-multiple: true

      - name: download e2e test binary
        if: matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-test-${{ steps.os.outputs.runner_os }}
          path: ./e2e/

      - name: setup executable
        if: matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true'
        shell: bash
        working-directory: ./e2e
        run: |
          TEMP_DIR="${{ runner.temp }}"
          if [ "${{ runner.os }}" == "Windows" ]; then
            TEMP_DIR="${TEMP_DIR//\\//}"
          fi

          ls -R "$TEMP_DIR/devsy-bin/"
          mkdir -p ./bin/
          find "$TEMP_DIR/devsy-bin/" -type f -name "devsy-*" -exec cp {} ./bin \;
          find ./bin -name "devsy-*" -exec chmod +x {} \;
          if [ "${{ runner.os }}" == "Linux" ]; then
            chmod +x ./e2e.test
          fi
          ls -R ./bin/

      - name: generate uuid
        if: matrix.install-kind == true && runner.os != 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        id: uuid
        shell: bash
        run: |
          UUID=$(python -c "import uuid; print(uuid.uuid4().hex)")
          echo "result=$UUID" >> "$GITHUB_OUTPUT"

      - name: cache podman installer (Windows)
        if: (matrix.install-kind == true || matrix.install-podman == true) && runner.os == 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        id: podman-cache-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/podman.msi
          key: ${{ runner.os }}-${{ runner.arch }}-podman-v5.8.2

      - name: setup WSL2 Ubuntu (docker-internal-buildkit)
        if: matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          use-cache: true

      - name: install docker-ce and sshd in WSL2 (docker-internal-buildkit)
        if: matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        shell: wsl-bash {0}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl openssh-server
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
          # The Docker API is reachable only through the UNIX socket, never TCP.
          sudo mkdir -p /etc/docker
          echo '{"hosts": ["unix:///var/run/docker.sock"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          # Ephemeral test user: Docker socket access via the docker group, key-only SSH.
          sudo useradd --create-home --shell /bin/bash --groups docker devsyci
          sudo usermod --password '*' devsyci
          sudo install -d -m 0700 -o devsyci -g devsyci /home/devsyci/.ssh
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/devsy_ci_host_ed25519
          sudo tee /etc/ssh/devsy_ci_sshd_config >/dev/null <<'EOF'
          Port 2222
          ListenAddress 0.0.0.0
          HostKey /etc/ssh/devsy_ci_host_ed25519
          PidFile /run/devsy-ci-sshd.pid
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          AllowUsers devsyci
          UsePAM no
          AuthorizedKeysFile .ssh/authorized_keys
          EOF

      - name: start docker daemon in WSL2 (docker-internal-buildkit)
        if: matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          wsl.exe -d Ubuntu-24.04 -u root -- sh -c "systemctl stop docker.service docker.socket 2>/dev/null; pkill -x dockerd; rm -f /var/run/docker.sock /var/run/docker.pid; true"
          Start-Process wsl.exe -WindowStyle Hidden -ArgumentList "-d","Ubuntu-24.04","-u","root","--","sh","-c","`"exec /usr/bin/dockerd >/tmp/dockerd.log 2>&1`""
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            wsl.exe -d Ubuntu-24.04 -u root -- docker info *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            wsl.exe -d Ubuntu-24.04 -u root -- sh -c "tail -50 /tmp/dockerd.log; ss -ltnp"
            throw "dockerd did not become ready on unix:///var/run/docker.sock in WSL2"
          }
          wsl.exe -d Ubuntu-24.04 -u root -- docker info

      - name: install docker CLI on Windows host (docker-internal-buildkit)
        if: matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $zip = "$env:RUNNER_TEMP\docker.zip"
          Invoke-WebRequest -Uri "https://download.docker.com/win/static/stable/x86_64/docker-29.9.0.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $expected = "e3ff5d2e4cd1ad7e1c9bcb76f0df28a84853c43416a915323f08659d8487ad83"
          if ($actual -ne $expected) { throw "SHA256 mismatch for docker CLI zip! Expected: $expected, Got: $actual" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\docker-cli"
          "$env:RUNNER_TEMP\docker-cli\docker" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          $dockerConfig = "$env:RUNNER_TEMP\docker-config"
          New-Item -ItemType Directory -Force -Path $dockerConfig | Out-Null
          "DOCKER_CONFIG=$dockerConfig" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: ssh to WSL2 docker over unix socket (docker-internal-buildkit)
        if: matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $port = 2222
          $user = "devsyci"
          $sshDir = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $key = Join-Path $env:RUNNER_TEMP "devsy_ci_ed25519"
          Remove-Item -Force -ErrorAction SilentlyContinue $key, "$key.pub"
          # Private key is generated on the Windows runner and never leaves it.
          ssh-keygen -q -t ed25519 -N "" -f $key
          if ($LASTEXITCODE -ne 0) { throw "ssh-keygen failed" }
          icacls $key /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          $pub = (Get-Content "$key.pub" -Raw).Trim()
          wsl.exe -d Ubuntu-24.04 -u root -- sh -c "printf '%s\n' '$pub' > /home/${user}/.ssh/authorized_keys && chown ${user}:${user} /home/${user}/.ssh/authorized_keys && chmod 600 /home/${user}/.ssh/authorized_keys"
          if ($LASTEXITCODE -ne 0) { throw "could not install authorized key" }

          Start-Process wsl.exe -WindowStyle Hidden -ArgumentList "-d","Ubuntu-24.04","-u","root","--","sh","-c","`"exec /usr/sbin/sshd -D -e -f /etc/ssh/devsy_ci_sshd_config >/tmp/sshd.log 2>&1`""

          # Pin the host key read from the WSL server; host key checking stays strict.
          $hostPub = ((wsl.exe -d Ubuntu-24.04 -u root -- cat /etc/ssh/devsy_ci_host_ed25519.pub) -join '').Trim()
          if (-not $hostPub) { throw "could not read WSL host key" }
          $hostKey = ($hostPub -split ' ')[0..1] -join ' '
          Write-Host "pinned host key: $hostKey"

          # Windows localhost forwarding to WSL2 is not guaranteed; fall back to the VM address.
          $vmIp = ((wsl.exe -d Ubuntu-24.04 -- hostname -I) -join ' ').Trim().Split(' ')[0]
          $address = $null
          foreach ($candidate in @("localhost", $vmIp)) {
            if (-not $candidate) { continue }
            for ($i = 0; $i -lt 30 -and -not $address; $i++) {
              $client = New-Object System.Net.Sockets.TcpClient
              try {
                $client.Connect($candidate, $port)
                $address = $candidate
              } catch {
                Start-Sleep -Seconds 1
              } finally {
                $client.Dispose()
              }
              if ($candidate -eq "localhost" -and $i -ge 4) { break }
            }
            if ($address) { break }
          }
          if (-not $address) {
            wsl.exe -d Ubuntu-24.04 -u root -- sh -c "cat /tmp/sshd.log; ss -ltnp"
            throw "BLOCKED: neither localhost:$port nor the WSL VM address ($vmIp) reaches sshd"
          }
          Write-Host "sshd reachable at ${address}:${port}"

          $known = Join-Path $sshDir "known_hosts"
          Set-Content -Path $known -Value "[${address}]:${port} $hostKey"
          $config = @(
            "Host $address",
            "  HostName $address",
            "  User $user",
            "  Port $port",
            "  IdentityFile $($key -replace '\\','/')",
            "  IdentitiesOnly yes",
            "  StrictHostKeyChecking yes",
            "  UserKnownHostsFile $($known -replace '\\','/')",
            "  PasswordAuthentication no"
          )
          Set-Content -Path (Join-Path $sshDir "config") -Value $config

          $sshHost = "ssh://${user}@${address}:${port}"
          $wslId = ((wsl.exe -d Ubuntu-24.04 -u root -- docker info --format '{{.ID}}') -join '').Trim()
          if (-not $wslId) { throw "could not read WSL daemon ID" }

          # Same daemon through SSH from Windows, and nothing reachable without it.
          $env:DOCKER_CONTEXT = ""
          $env:DOCKER_HOST = $sshHost
          $viaSsh = (docker info --format '{{.ID}}').Trim()
          if ($viaSsh -ne $wslId) { throw "daemon ID via SSH ($viaSsh) != WSL daemon ID ($wslId)" }
          $env:DOCKER_HOST = "npipe:////./pipe/devsy-ci-no-daemon"
          docker info *> $null
          if ($LASTEXITCODE -eq 0) { throw "a Docker daemon is reachable without SSH; the regression oracle would be void" }

          Write-Host "provider endpoint: $sshHost"
          Write-Host "WSL daemon ID:     $wslId"
          "DEVSY_E2E_SSH_DOCKER_HOST=$sshHost" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "DEVSY_E2E_WSL_DAEMON_ID=$wslId" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "DEVSY_CI_SSH_KEY=$key" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: install podman (Windows)
        if: (matrix.install-kind == true || matrix.install-podman == true) && runner.os == 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        shell: pwsh
        timeout-minutes: 5
        run: |
          $msiPath = "$env:RUNNER_TEMP\podman.msi"
          if ("${{ steps.podman-cache-windows.outputs.cache-hit }}" -ne "true") {
            $msiUrl = "https://github.com/containers/podman/releases/download/v5.8.2/podman-installer-windows-amd64.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
          }

          $expectedHash = "eda54f26f9695d198d9a679fa45ae24ba35b78444f432b5fe0c122c5a3624c57"
          $actualHash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "SHA256 mismatch for podman MSI! Expected: $expectedHash, Got: $actualHash"
          }
          Write-Host "Podman MSI checksum verified: $actualHash"

          $installDir = "C:\Program Files\RedHat\Podman"
          $logFile = "$env:RUNNER_TEMP\podman-install.log"
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msiPath`" /qn /norestart /l*v `"$logFile`" INSTALLDIR=`"$installDir`""
          Write-Host "MSI exit code: $($proc.ExitCode)"

          if (!(Test-Path "$installDir\podman.exe")) {
            Write-Host "--- MSI install log (last 50 lines) ---"
            Get-Content $logFile -Tail 50
            Write-Host "--- Searching for podman.exe ---"
            Get-ChildItem "C:\" -Filter "podman.exe" -Recurse -Depth 4 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw "podman.exe not found at $installDir"
          }

          echo "$installDir" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: start podman (Windows)
        if: (matrix.install-kind == true || matrix.install-podman == true) && runner.os == 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        shell: pwsh
        timeout-minutes: 5
        run: |
          & "$env:RUNNER_TEMP\devsy-ci-podman\devsy-ci-podman.exe" setup `
            --mode rootful `
            --podman-path "C:\Program Files\RedHat\Podman\podman.exe" `
            --bootstrap-timeout 270s

      - name: cache kind.exe (Windows)
        if: matrix.install-kind == true && runner.os == 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        id: kind-cache-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind.exe
          key: ${{ runner.os }}-${{ runner.arch }}-kind-v0.33.0

      - name: setup kind (Windows)
        if: matrix.install-kind == true && runner.os == 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        shell: bash
        env:
          KIND_EXPERIMENTAL_PROVIDER: podman
          DOCKER_HOST: npipe:////./pipe/podman-machine-default
        run: |
          if [ "${{ steps.kind-cache-windows.outputs.cache-hit }}" != "true" ]; then
            curl -Lo "$RUNNER_TEMP/kind.exe" "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-windows-amd64"
            expected="4b22adaa135368c5a465d56bbd8e520cbea87272a06ca00b6078e7b81515c9fc"
            actual=$(sha256sum "$RUNNER_TEMP/kind.exe" | awk '{print $1}' | sed 's/^[^a-f0-9]*//')
            if [ "$actual" != "$expected" ]; then
              echo "SHA256 mismatch for kind.exe! Expected: $expected, Got: $actual"
              exit 1
            fi
            echo "kind.exe checksum verified: $actual"
          fi

          export PATH="$RUNNER_TEMP:$PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

          CLUSTER_NAME=$(python -c "import uuid; print(uuid.uuid4().hex)")
          kind create cluster --name "$CLUSTER_NAME" --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed

      # NOTE: skevetter/setup-kind does not work on Windows runners
      - name: setup kind
        if: matrix.install-kind == true && runner.os != 'Windows' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        uses: skevetter/setup-kind@7febac2ed35df332069b3bb687c6b1fa00fc0883 # v1
        with:
          name: ${{ steps.uuid.outputs.result }}
          version: v0.33.0
          image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          skipClusterLogsExport: true

      - name: cache podman installer (Linux)
        if: (matrix.install-podman == 'rootless' || matrix.install-podman == 'rootful') && runner.os == 'Linux'
        id: podman-cache-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/podman-linux-amd64.tar.gz
          key: ${{ runner.os }}-${{ runner.arch }}-podman-static-v5.8.4-sha256-v2

      - name: install podman (Linux)
        if: (matrix.install-podman == 'rootless' || matrix.install-podman == 'rootful') && runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          archive="${{ runner.temp }}/podman-linux-amd64.tar.gz"
          if [ "${{ steps.podman-cache-linux.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL -o "$archive" \
              https://github.com/mgoltzsche/podman-static/releases/download/v5.8.4/podman-linux-amd64.tar.gz
          fi

          expectedHash="a58765fe8be6ab3fb79f892f1a027b4ce4a7e8eb589df1ef960c167cbde08d69"
          actualHash=$(sha256sum "$archive" | cut -d' ' -f1)
          if [ "$actualHash" != "$expectedHash" ]; then
            echo "::error::SHA256 mismatch for podman-static archive! Expected: $expectedHash, Got: $actualHash"
            exit 1
          fi

          tar -xzf "$archive" -C "${{ runner.temp }}"
          sudo cp -r "${{ runner.temp }}/podman-linux-amd64/usr" "${{ runner.temp }}/podman-linux-amd64/etc" /

          command -v newuidmap >/dev/null || sudo apt-get install -y uidmap

      - name: configure and verify podman (Linux)
        if: (matrix.install-podman == 'rootless' || matrix.install-podman == 'rootful') && runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: |
          chmod +x "${RUNNER_TEMP}/devsy-ci-podman/devsy-ci-podman"
          "${RUNNER_TEMP}/devsy-ci-podman/devsy-ci-podman" setup \
            --mode "${{ matrix.install-podman }}" \
            --podman-path /usr/local/bin/podman \
            --crun-path /usr/local/bin/crun \
            --bootstrap-timeout 270s

      - name: cache microsandbox release bundle (Linux)
        if: matrix.install-microsandbox == true && runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/microsandbox-linux-x86_64-v0.7.7.tar.gz
          key: ${{ runner.os }}-${{ runner.arch }}-microsandbox-bundle-v0.7.7

      - name: install checksum-pinned microsandbox (Linux)
        if: matrix.install-microsandbox == true && runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          archive="${RUNNER_TEMP}/microsandbox-linux-x86_64-v0.7.7.tar.gz"
          if [ ! -f "$archive" ]; then
            curl -fsSL --retry 3 -o "$archive" \
              https://github.com/superradcompany/microsandbox/releases/download/v0.7.7/microsandbox-linux-x86_64.tar.gz
          fi
          echo "b3cc4a5e3f52dfdd938a6f67ac4a9a959ddfe304bab56de4964044b8613f01bb  $archive" | sha256sum -c -
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          tar -xzf "$archive" -C "$staging"
          mkdir -p "$HOME/.microsandbox/bin" "$HOME/.microsandbox/lib" "$HOME/.local/bin"
          install -m 755 "$staging/msb" "$HOME/.microsandbox/bin/msb"
          install -m 644 "$staging/libkrunfw.so.5.6.1" "$HOME/.microsandbox/lib/"
          ln -sf libkrunfw.so.5.6.1 "$HOME/.microsandbox/lib/libkrunfw.so.5"
          ln -sf libkrunfw.so.5 "$HOME/.microsandbox/lib/libkrunfw.so"
          ln -sf "$HOME/.microsandbox/bin/msb" "$HOME/.local/bin/msb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/msb" --version
          sudo test -r /dev/kvm
          sudo test -w /dev/kvm

      - name: remove docker
        if: matrix.label == 'docker-install' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          sudo rm -rf /var/lib/docker /var/lib/containerd /usr/bin/docker /usr/bin/dockerd

      - name: configure insecure registry for snapshot tests (Linux)
        if: matrix.configure-insecure-registry == true && runner.os == 'Linux'
        run: |
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          sudo mkdir -p /etc/docker
          existing="$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')"
          echo "$existing" | jq '.["insecure-registries"] = ((.["insecure-registries"] // []) + ["host.docker.internal:15500"] | unique)' \
            | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
          timeout 30 bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

      - name: generate GitHub App token
        if: matrix.requires-secret == true && needs.can-read-secret.outputs.secret-set == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.DEVSY_GITHUB_APP_ID }}
          private-key: ${{ secrets.DEVSY_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: test Compose UID mapping as existing non-root runner
        if: runner.os == 'Linux' && matrix.label == 'up-docker-compose'
        shell: bash
        working-directory: ./e2e
        env:
          TEST_TIMEOUT: ${{ matrix.test-timeout || '1500s' }}
        run: |
          set -euo pipefail
          id
          test "$(id -u)" = 1001
          test "$(id -g)" = 1001
          getent passwd "$(id -u)"
          getent group "$(id -g)"
          test -d "$HOME" && test -w "$HOME"
          test "$(stat -c %u "$HOME")" = "$(id -u)"
          test -d "$RUNNER_TEMP" && test -w "$RUNNER_TEMP"
          docker info
          docker compose version
          printf 'checkout=%s\n' "$(git rev-parse HEAD)"
          sha256sum ./e2e.test ./bin/devsy-linux-amd64
          ./e2e.test -test.v -ginkgo.v -test.timeout "${TEST_TIMEOUT}" \
            -ginkgo.fail-on-empty -ginkgo.flake-attempts=1 \
            --ginkgo.label-filter=up-docker-compose \
            --ginkgo.focus='implements updateRemoteUserUID with root container user$' \
            --ginkgo.json-report="$RUNNER_TEMP/compose-uid-nonroot.json"
          python3 - "$RUNNER_TEMP/compose-uid-nonroot.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              suites = json.load(report)
          assert isinstance(suites, list) and len(suites) == 1, "unexpected suite report shape"
          suite = suites[0]
          assert suite["SuiteConfig"]["DryRun"] is False, "dry-run is not execution"
          assert suite["SuiteSucceeded"] is True, "suite failed"
          selected = [
              spec for spec in suite["SpecReports"]
              if spec.get("LeafNodeType") == "It" and spec.get("State") != "skipped"
          ]
          assert len(selected) == 1, f"expected one executed leaf, found {len(selected)}"
          spec = selected[0]
          assert spec["LeafNodeText"] == "implements updateRemoteUserUID with root container user", "wrong UID spec"
          assert spec["State"] == "passed", "UID spec did not pass"
          assert spec["NumAttempts"] == 1, "unexpected retries"
          print("one www-data UID spec passed in one attempt")
          PY

      - name: run test
        if: matrix.label != 'docker-internal-buildkit' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        shell: bash
        working-directory: ./e2e
        env:
          # NOTE: GitHub credentials are required for tests using private repos
          GH_USERNAME: ${{ github.repository_owner }}
          GH_ACCESS_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_CREDENTIAL_USERNAME: x-access-token
          TEST_TIMEOUT: ${{ matrix.test-timeout || '1500s' }}
          FLAKE_ATTEMPTS: ${{ matrix.flake-attempts || '1' }}
          DEVSY_REQUIRE_MICROSANDBOX: ${{ matrix.install-microsandbox == true && 'true' || 'false' }}
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            if [ "${{ matrix.install-podman || '' }}" = "rootless" ]; then
              echo "Podman rootless test identity:"
              id
              printf 'HOME=%s\n' "${HOME}"
              printf 'XDG_RUNTIME_DIR=%s\n' "${XDG_RUNTIME_DIR:-}"
              podman info
              GH_USERNAME="${GH_USERNAME}" \
                GH_ACCESS_TOKEN="${GH_ACCESS_TOKEN}" \
                GH_CREDENTIAL_USERNAME="${GH_CREDENTIAL_USERNAME}" \
                KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
                PATH="${PATH}" \
                ./e2e.test -test.v -ginkgo.v -test.timeout "${TEST_TIMEOUT}" -ginkgo.fail-on-empty -ginkgo.flake-attempts="${FLAKE_ATTEMPTS}" --ginkgo.label-filter="${{ matrix.label }}"
            else
              sudo \
                DEVSY_REQUIRE_MICROSANDBOX="${DEVSY_REQUIRE_MICROSANDBOX}" \
                GH_USERNAME="${GH_USERNAME}" \
                GH_ACCESS_TOKEN="${GH_ACCESS_TOKEN}" \
                GH_CREDENTIAL_USERNAME="${GH_CREDENTIAL_USERNAME}" \
                KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
                ${DOCKER_HOST:+DOCKER_HOST="${DOCKER_HOST}"} \
                PATH="${PATH}" \
                ./e2e.test -test.v -ginkgo.v -test.timeout "${TEST_TIMEOUT}" -ginkgo.fail-on-empty -ginkgo.flake-attempts="${FLAKE_ATTEMPTS}" --ginkgo.label-filter="${{ matrix.label }}"
            fi
          else
            GH_USERNAME="${GH_USERNAME}" \
              GH_ACCESS_TOKEN="${GH_ACCESS_TOKEN}" \
              GH_CREDENTIAL_USERNAME="${GH_CREDENTIAL_USERNAME}" \
              KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
              PATH="${PATH}" \
              DOCKER_HOST="npipe:////./pipe/podman-machine-default" \
              ./e2e.test.exe -test.v -ginkgo.v -test.timeout "${TEST_TIMEOUT}" -ginkgo.fail-on-empty -ginkgo.flake-attempts="${FLAKE_ATTEMPTS}" --ginkgo.label-filter="${{ matrix.label }}"
          fi

      - name: run test (docker-internal-buildkit)
        if: matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        shell: bash
        working-directory: ./e2e
        env:
          TEST_TIMEOUT: ${{ matrix.test-timeout || '1500s' }}
        run: |
          # The process daemon is deliberately a named pipe with no daemon behind
          # it (issue #1469); the provider selects the WSL daemon over SSH. The dead
          # DOCKER_HOST is scoped to this command only.
          DOCKER_HOST="npipe:////./pipe/devsy-ci-no-daemon" \
            DOCKER_CONTEXT="" \
            ./e2e.test.exe -test.v -ginkgo.v -test.timeout "${TEST_TIMEOUT}" -ginkgo.fail-on-empty --ginkgo.label-filter="docker-internal-buildkit" \
            --ginkgo.json-report=docker-internal-buildkit-report.json

      - name: assert executed specs (docker-internal-buildkit)
        if: matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        shell: pwsh
        working-directory: ./e2e
        run: |
          $suite = (Get-Content docker-internal-buildkit-report.json -Raw | ConvertFrom-Json)[0]
          $specs = $suite.SpecReports | Where-Object { $_.LeafNodeType -eq 'It' }
          $specs | ForEach-Object { Write-Host ("{0,-8} {1}" -f $_.State, $_.LeafNodeText) }
          $notPassed = @($specs | Where-Object { $_.State -ne 'passed' })
          if ($specs.Count -lt 4 -or $notPassed.Count -gt 0) {
            throw "expected 4 passed specs, got $($specs.Count) with $($notPassed.Count) not passed"
          }

      - name: tear down docker and sshd in WSL2 (docker-internal-buildkit)
        if: always() && matrix.label == 'docker-internal-buildkit' && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          wsl.exe -d Ubuntu-24.04 -u root -- sh -c "pkill -x sshd; pkill -x dockerd; rm -f /home/devsyci/.ssh/authorized_keys; true"
          if ($env:DEVSY_CI_SSH_KEY) { Remove-Item -Force -ErrorAction SilentlyContinue $env:DEVSY_CI_SSH_KEY, "$($env:DEVSY_CI_SSH_KEY).pub" }
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:USERPROFILE ".ssh\config"), (Join-Path $env:USERPROFILE ".ssh\known_hosts")
          $listening = @(wsl.exe -d Ubuntu-24.04 -u root -- ss -ltn) + @(netstat -an | Select-String 'LISTENING')
          $insecure = $listening | Select-String -Pattern ':2375\s'
          if ($insecure) { throw "unauthenticated Docker TCP listener found: $insecure" }

      - name: verify docker is installed
        if: matrix.label == 'docker-install' && (matrix.requires-secret == false || needs.can-read-secret.outputs.secret-set == 'true')
        run: docker --version && docker ps

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - precommit
      - lint
      - agent-skill
      - unit-tests
      - licenses
      - build-cli
      - integration-tests-unprivileged
      - integration-tests
    steps:
      - name: Check required jobs
        run: |
          go_changes="${{ needs.changes.outputs.go }}"

          check_result() {
            local name="$1"
            local result="$2"
            local skip_when_no_go_changes="$3"

            case "$result" in
              success)
                ;;
              skipped)
                if [[ "$skip_when_no_go_changes" != "true" || "$go_changes" == "true" ]]; then
                  echo "::error::$name ended with result=skipped unexpectedly"
                  return 1
                fi
                ;;
              *)
                echo "::error::$name ended with result=$result"
                return 1
                ;;
            esac
          }

          status=0
          check_result "changes" "${{ needs.changes.result }}" false || status=1
          check_result "precommit" "${{ needs.precommit.result }}" false || status=1
          check_result "lint" "${{ needs.lint.result }}" false || status=1
          check_result "agent-skill" "${{ needs.agent-skill.result }}" false || status=1
          check_result "unit-tests" "${{ needs.unit-tests.result }}" true || status=1
          check_result "licenses" "${{ needs.licenses.result }}" true || status=1
          check_result "build-cli" "${{ needs.build-cli.result }}" true || status=1
          check_result "integration-tests-unprivileged" "${{ needs.integration-tests-unprivileged.result }}" true || status=1
          check_result "integration-tests" "${{ needs.integration-tests.result }}" true || status=1

          exit "$status"
