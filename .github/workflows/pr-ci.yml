name: Pull Request

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.goreleaser.yml'
              - 'e2e/**'
              - '.github/workflows/pr-ci.yml'
              - 'hack/licenses/**'
              - 'hack/podman_ci/**'
              - 'THIRD_PARTY_LICENSES.md'

  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  agent-skill:
    name: Agent Skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Validate skill and installer compatibility
        run: ./hack/ci/validate-agent-skill.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          only-new-issues: true

  unit-tests:
    name: Unit Tests (${{ matrix.runner }})
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.runner }}
    # Leave room for race compilation and the existing crypto tests on macOS.
    timeout-minutes: ${{ matrix.runner == 'macos-latest' && 45 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: run unit tests with race detector
        shell: bash
        run: |
          set -euo pipefail

          packages="$(go list -f '{{.ImportPath}}|{{.Dir}}' ./... | awk -F '|' -v root="$PWD" '
            {
              if (index($2, root) != 1 || (length($2) > length(root) && substr($2, length(root) + 1, 1) != "/")) {
                print "Package directory is outside the repository: " $2 > "/dev/stderr"
                exit 1
              }

              relative = substr($2, length(root) + 1)
              if (relative !~ /(^|\/)(test|e2e)(\/|$)/) print $1
            }
          ')"

          if [[ -z "$packages" ]]; then
            echo "No unit-test packages found"
            exit 1
          fi

          printf '%s\n' "$packages" | xargs go test -race -short

      - name: test Compose UID expectation matrix
        shell: bash
        run: |
          set -euo pipefail
          go test ./e2e/tests/up-docker-compose -list '^TestExpectedUIDMapping$' \
            | grep -Fx 'TestExpectedUIDMapping'
          go test -race -short -count=1 -v ./e2e/tests/up-docker-compose \
            -run '^TestExpectedUIDMapping$'

  can-read-secret:
    name: Can Read Secret
    runs-on: ubuntu-latest
    outputs:
      secret-set: ${{ steps.check-secret.outputs.secret-set }}
    steps:
      - name: Check secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.DEVSY_GITHUB_APP_ID }}" ]; then
            echo "secret-set=false" >> "$GITHUB_OUTPUT"
          else
            echo "secret-set=true" >> "$GITHUB_OUTPUT"
          fi

  build-cli:
    name: Build CLI Binary on ${{ matrix.runner }}
    needs: [changes, precommit, lint]
    if: needs.changes.outputs.go == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: macos-latest
          - runner: windows-latest
            job_timeout_minutes: 30
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_timeout_minutes || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: get operating system lowercase
        id: os
        shell: bash
        run: |
          OS=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          if [ "$OS" == "macos" ]; then
            OS="darwin"
          fi
          echo "runner_os=$OS" >> "$GITHUB_OUTPUT"

      - name: test Podman CI helper
        run: go test ./hack/podman_ci

      - name: build Podman CI helper
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          OUT_DIR="${{ runner.temp }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            OUT_DIR="${OUT_DIR//\\//}"
          fi
          OUT="$OUT_DIR/devsy-ci-podman"
          if [ "${{ runner.os }}" = "Windows" ]; then
            OUT="${OUT}.exe"
          fi
          go build -trimpath -o "$OUT" ./hack/podman_ci

      - name: upload Podman CI helper
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devsy-ci-podman-${{ steps.os.outputs.runner_os }}
          path: ${{ runner.temp }}/devsy-ci-podman*

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --id devsy-${{ steps.os.outputs.runner_os }} --snapshot
        env:
          DEVSY_CLI_VERSION: v0.0.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devsy-${{ steps.os.outputs.runner_os }}
          path: dist/devsy-${{ steps.os.outputs.runner_os }}_*/devsy-${{ steps.os.outputs.runner_os }}-*

      - name: build e2e test binary
        if: matrix.runner == 'ubuntu-latest' || matrix.runner == 'windows-latest'
        shell: bash
        working-directory: ./e2e
        env:
          CGO_ENABLED: 0
        run: |
          OUT="e2e.test"
          if [ "${{ runner.os }}" == "Windows" ]; then
            OUT="e2e.test.exe"
          fi
          go test -c -o "$OUT" ./

      - name: upload e2e test binary
        if: matrix.runner == 'ubuntu-latest' || matrix.runner == 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-${{ steps.os.outputs.runner_os }}
          path: ./e2e/e2e.test*


  licenses:
    name: Third-party licenses
    needs: [changes, precommit, lint]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Check license policy and attribution
        run: go run ./hack/licenses --check

  integration-tests-unprivileged:
    name: Test ${{ matrix.label }} on ${{ matrix.runner }}
    needs: [changes, build-cli]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: context
            runner: ubuntu-latest

          - label: extends
            runner: ubuntu-latest

          - label: outdated
            runner: ubuntu-latest

          - label: machine
            runner: ubuntu-latest

          - label: self-update
            runner: ubuntu-latest

          - label: upgrade
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: get operating system lowercase
        id: os
        shell: bash
        run: |
          OS=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          echo "runner_os=$OS" >> "$GITHUB_OUTPUT"

      - name: download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: devsy-${{ steps.os.outputs.runner_os }}
          path: ${{ runner.temp }}/devsy-bin/
          merge-multiple: true

      - name: download e2e test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-test-${{ steps.os.outputs.runner_os }}
          path: ./e2e/

      - name: setup executable
        shell: bash
        working-directory: ./e2e
        run: |
          TEMP_DIR="${{ runner.temp }}"
          ls -R "$TEMP_DIR/devsy-bin/"
          mkdir -p ./bin/
          find "$TEMP_DIR/devsy-bin/" -type f -name "devsy-*" -exec cp {} ./bin \;
          find ./bin -name "devsy-*" -exec chmod +x {} \;
          chmod +x ./e2e.test
          ls -R ./bin/

      - name: run test
        shell: bash
        working-directory: ./e2e
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_ACCESS_TOKEN: ${{ github.token }}
          GH_CREDENTIAL_USERNAME: x-access-token
        run: |
          ./e2e.test -test.v -ginkgo.v -test.timeout 1500s -ginkgo.fail-on-empty --ginkgo.label-filter="${{ matrix.label }}"

  integration-tests:
    name: Test ${{ matrix.label }}${{ (matrix.install-podman == 'rootless' || matrix.install-podman == 'rootful') && format(' ({0})', matrix.install-podman) || '' }} on ${{ matrix.runner }}
    needs: [changes, can-read-secret, build-cli]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: docker-context
            runner: ubuntu-latest
            free-disk-space: false
            install-kind: false
            requires-secret: false
            test-timeout: 300s
            job-timeout-minutes: 10

          - label: ide
            runner: ubuntu-latest
            free-disk-space: false
            install-kind: false
            requires-secret: false

          - label: machine-provider
            runner: ubuntu-latest
            free-disk-space: false
            install-kind: false
            requires-secret: false

          - label: integration
