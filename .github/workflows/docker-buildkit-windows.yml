name: Docker BuildKit on Windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-buildkit:
    name: Windows WSL Docker
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: build CI helper
        run: go build -trimpath -o "$env:RUNNER_TEMP\devsy-ci.exe" ./e2e/cmd/devsy-ci

      - name: download Windows CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: devsy-windows
          path: ${{ runner.temp }}/devsy-buildkit-bin

      - name: download Linux agent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: devsy-linux
          path: ${{ runner.temp }}/devsy-buildkit-bin

      - name: download E2E test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-test-windows
          path: ./e2e

      - name: prepare CLI and agent binaries
        run: |
          New-Item -ItemType Directory -Force ./e2e/bin | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\devsy-buildkit-bin" -Recurse -File -Filter 'devsy-*' |
            Copy-Item -Destination ./e2e/bin

      - name: setup WSL2 Ubuntu
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          use-cache: true

      - name: provision Docker over WSL SSH
        timeout-minutes: 15
        run: >-
          & "$env:RUNNER_TEMP\devsy-ci.exe" docker-wsl setup
          --distribution Ubuntu-24.04 --timeout 4m
          --state-file "$env:RUNNER_TEMP\devsy-ci\docker-wsl-state.json"

      - name: run BuildKit regression specs
        working-directory: ./e2e
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_ACCESS_TOKEN: ${{ github.token }}
          GH_CREDENTIAL_USERNAME: x-access-token
          DOCKER_HOST: npipe:////./pipe/devsy-ci-no-daemon
          DOCKER_CONTEXT: ""
        run: |
          ./e2e.test.exe '-test.v' '-ginkgo.v' '-test.timeout=900s' `
            '-ginkgo.fail-on-empty' '-ginkgo.flake-attempts=1' `
            '-ginkgo.label-filter=docker-internal-buildkit' `
            '-ginkgo.json-report=docker-internal-buildkit-report.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\devsy-ci.exe" check-report `
            --report docker-internal-buildkit-report.json `
            --label docker-internal-buildkit --expected-specs 6

      - name: install pinned Windows Compose plugin
        run: |
          $pluginDir = Join-Path $env:USERPROFILE '.docker\cli-plugins'
          New-Item -ItemType Directory -Force $pluginDir | Out-Null
          $plugin = Join-Path $pluginDir 'docker-compose.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-windows-x86_64.exe' `
            -OutFile $plugin
          $expectedHash = '8aeaa0055e660e12cf07cd70680dc8333957fe6718528b91ec3da084eab62483'
          $actualHash = (Get-FileHash -Path $plugin -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) { throw 'Compose SHA256 mismatch' }

      - name: test real noninteractive WSLg discovery and Compose parity
        env:
          DEVSY_WSLG_TEST_DISTRO: Ubuntu-24.04
          DEVSY_WSLG_TEST_USER: devsyci
        run: |
          docker compose version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -v -timeout 3m ./pkg/wslg ./pkg/compose -run '^TestWSLg'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: run WSLg workspace regression specs
        working-directory: ./e2e
        env:
          DEVSY_WSLG_TEST_DISTRO: Ubuntu-24.04
          DEVSY_WSLG_TEST_USER: devsyci
          GH_USERNAME: ${{ github.repository_owner }}
          GH_ACCESS_TOKEN: ${{ github.token }}
          GH_CREDENTIAL_USERNAME: x-access-token
          DOCKER_HOST: npipe:////./pipe/devsy-ci-no-daemon
          DOCKER_CONTEXT: ""
        run: |
          ./e2e.test.exe '-test.v' '-ginkgo.v' '-test.timeout=600s' `
            '-ginkgo.fail-on-empty' '-ginkgo.flake-attempts=1' `
            '-ginkgo.label-filter=wslg' '-ginkgo.json-report=wslg-report.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\devsy-ci.exe" check-report `
            --report wslg-report.json --label wslg --expected-specs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: tear down Docker WSL SSH fixture
        if: always()
        timeout-minutes: 3
        run: |
          if (Test-Path "$env:RUNNER_TEMP\devsy-ci.exe") {
            & "$env:RUNNER_TEMP\devsy-ci.exe" docker-wsl cleanup `
              --state-file "$env:RUNNER_TEMP\devsy-ci\docker-wsl-state.json" --timeout 2m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: upload BuildKit report and setup or teardown diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-diagnostics-docker-internal-buildkit
          path: |
            e2e/docker-internal-buildkit-report.json
            e2e/wslg-report.json
            ${{ runner.temp }}/devsy-ci/docker-wsl-diagnostics.log
          if-no-files-found: warn
