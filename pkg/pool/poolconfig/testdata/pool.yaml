apiVersion: devsy.sh/v1alpha1
kind: Pool
metadata:
  name: api-agents
spec:
  source:
    repo: https://github.com/acme/api
    ref: main
    devcontainerPath: .devcontainer/devcontainer.json
  provider:
    name: docker
  capacity:
    maxConcurrent: 4
    maxQueued: 8
  lifecycle:
    idleTimeout: 15m
    ttl: 8h
  egress:
    allow:
      - host: registry.npmjs.org
      - host: "*.pythonhosted.org"
      - host: github.com
        ports: [443, 22]
      - cidr: 10.20.0.0/16
  agents:
    claude:
      command: [claude, -p, --output-format, stream-json, --verbose]
      env: {LOG_LEVEL: info}
    codex:
      command: [codex, exec]
      env: {LOG_LEVEL: info}
