// protoc -I . tunnel.proto  --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative
syntax = "proto3";

option go_package = "github.com/devsy-org/devsy/pkg/agent/tunnel";

package tunnel;

service Tunnel {
  rpc Ping(Empty) returns (Empty) {}
  rpc Log(LogMessage) returns (Empty) {}
  rpc Status(StatusUpdate) returns (Empty) {}
  rpc AppendSetupLogs(AppendSetupLogsRequest) returns (AppendSetupLogsResponse) {}
  rpc SendResult(Message) returns (Empty) {}

  rpc DockerCredentials(Message) returns (Message) {}
  rpc GitCredentials(Message) returns (Message) {}
  rpc GitHubCredentials(Empty) returns (Message) {}
  rpc GitSSHSignature(Message) returns (Message) {}
  rpc GitUser(Empty) returns (Message) {}
  rpc DevsyConfig(Message) returns (Message) {}
  rpc GPGPublicKeys(Message) returns (Message) {}
  rpc KubeConfig(Message) returns (Message) {}
  rpc Secrets(Empty) returns (SecretsResponse) {}

  rpc ForwardPort(ForwardPortRequest) returns (ForwardPortResponse) {}
  rpc StopForwardPort(StopForwardPortRequest) returns (StopForwardPortResponse) {}

  rpc StreamWorkspace(Empty) returns (stream Chunk) {}
  rpc StreamMount(StreamMountRequest) returns (stream Chunk) {}
  rpc StreamSnapshotVolumes(Empty) returns (stream Chunk) {}
}

message StreamMountRequest {
  string mount = 1;
}

message StopForwardPortRequest {
  string port = 1;
}

message StopForwardPortResponse {

}

message ForwardPortRequest {
  string port = 1;
}

message ForwardPortResponse {

}

message Message {
  string message = 1;
}

message Secret {
  string name = 1;
  string value = 2;
  bool mount = 3;
}

message SecretsResponse {
  repeated Secret secrets = 1;
}

message Chunk {
  bytes Content = 1;
}

enum LogLevel {
  DEBUG = 0;
  INFO = 1;
  DONE = 2;
  WARNING = 3;
  ERROR = 4;
}

message LogMessage {
  LogLevel logLevel = 1;
  string message = 2;
}

message StatusUpdate {
  string phase = 1;
  string step = 2;
  string state = 3;
  int64 duration_ms = 4;
  string operation_id = 5;
  string parent_operation_id = 6;
  StatusError error = 7;
}

message StatusError {
  string code = 1;
  string message = 2;
  string hint = 3;
  map<string, string> context = 4;
}

// AppendSetupLogsRequest carries one contiguous batch of a producer's records.
// Each record is a JSON encoded workspacelogs.Record. The encoded request is
// capped at 256 KiB.
message AppendSetupLogsRequest {
  uint32 schema_version = 1;
  string run_id = 2;
  string producer_id = 3;
  uint64 first_sequence = 4;
  uint64 last_sequence = 5;
  repeated bytes records = 6;
}

enum SetupLogResult {
  SETUP_LOG_RESULT_UNSPECIFIED = 0;
  SETUP_LOG_RESULT_ACCEPTED = 1;
  SETUP_LOG_RESULT_RETENTION_GAP = 2;
  SETUP_LOG_RESULT_REJECTED_INVALID = 3;
}

message AppendSetupLogsResponse {
  // Highest contiguous sequence persisted for the producer.
  uint64 accepted_sequence = 1;
  SetupLogResult result = 2;
  // Sequences the receiver will never hold, set for RETENTION_GAP.
  uint64 gap_first_sequence = 3;
  uint64 gap_last_sequence = 4;
  string detail = 5;
}

message Empty {

}
