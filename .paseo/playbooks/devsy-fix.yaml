title: Devsy Fix and PR Pipeline
description: Investigate, implement, validate, review, and merge a verified bug fix in Devsy.
concurrency: 1

inputs:
  fingerprint:
    type: string
    required: true
    description: Normalized failure fingerprint
  description:
    type: string
    required: true
    description: Description of the failure or issue
  failing_step:
    type: string
    default: unspecified
    description: Failing CI step or component

outputs:
  pr_url:
    type: string
    value: "{{ steps.implement.outputs.pr_url }}"
  commit_sha:
    type: string
    value: "{{ steps.implement.outputs.commit_sha }}"

steps:
  - id: investigate
    role: ci-investigator
    prompt: "Investigate failure: {{ inputs.description }}.\nFingerprint: {{ inputs.fingerprint }}.\nFailing step: {{ inputs.failing_step }}."
    inputs: [fingerprint, description, failing_step]
    outputs:
      root_cause: { type: string }
      repro_command: { type: string }
      fix_hypothesis: { type: string }

  - id: approve_plan
    needs: [investigate]
    gate: "Root cause identified. Approve fix hypothesis to begin implementation, or request changes."
    choices:
      approved: { label: Approve and Implement, color: success }
      rejected: { label: Request Changes, comment: required, color: danger }
    on:
      rejected: { goto: investigate }

  - id: implement
    needs: [approve_plan]
    role: fix-worker
    prompt: "Implement approved fix for {{ inputs.fingerprint }}.\nHypothesis: {{ inputs.fix_hypothesis }}.\nRoot cause: {{ inputs.root_cause }}.\nRepro: {{ inputs.repro_command }}."
    inputs:
      fingerprint: "{{ playbook.inputs.fingerprint }}"
      fix_hypothesis: "{{ steps.investigate.outputs.fix_hypothesis }}"
      root_cause: "{{ steps.investigate.outputs.root_cause }}"
      repro_command: "{{ steps.investigate.outputs.repro_command }}"
    outputs:
      pr_url: { type: string }
      commit_sha: { type: string }

  - id: approve_pr
    needs: [implement]
    gate: "Implementation complete and draft PR is ready. Review diff, CI, Greptile, and CodeRabbit. Approve to merge, or request changes."
    choices:
      approved: { label: Approve and Merge, color: success }
      changes_requested: { label: Request Changes, comment: required, color: danger }
    on:
      changes_requested: { goto: implement }

  - id: merge
    needs: [approve_pr]
    role: fix-worker
    prompt: "Merge pull request {{ inputs.pr_url }}. Run squash merge with one-line subject and empty body: gh pr merge {{ inputs.pr_url }} --squash --delete-branch --subject 'fix(scope): subject' --body ''. Verify commit message is single line."
    inputs:
      pr_url: "{{ steps.implement.outputs.pr_url }}"
    outputs:
      merge_status: { type: string }
