name: docker123
version: 0.0.1
description: |-
  Devsy on Kubernetes
options:
  NAMESPACE:
    description: The namespace to use
    default: devsy-e2e
  INACTIVITY_TIMEOUT:
    description: The timeout until the pod will be stopped
    default: 30s
agent:
  path: /usr/local/bin/devsy
  inactivityTimeout: ${INACTIVITY_TIMEOUT}
  exec:
    shutdown: |-
      kill 1
exec:
  command: |-
    docker exec -i devsy-${MACHINE_ID} sh -c "${COMMAND}"
  stop: |-
    docker stop devsy-${MACHINE_ID}
  start: |-
    docker start devsy-${MACHINE_ID}
    i=0
    until docker exec devsy-${MACHINE_ID} docker info >/dev/null 2>&1; do
      i=$((i+1))
      if [ $i -gt 60 ]; then
        echo "dockerd in devsy-${MACHINE_ID} did not become ready within 60s" >&2
        docker logs --tail 50 devsy-${MACHINE_ID} >&2 || true
        exit 1
      fi
      sleep 1
    done
  status: |-
    STATUS=$(docker inspect devsy-${MACHINE_ID} 2>/dev/null | ${DEVSY} internal json get "[0].State.Status" || true)
    if [ -z $STATUS ]; then
      echo "NOTFOUND"
    else
      if [ "$STATUS" = "exited" ]; then
        echo "STOPPED"
      elif [ "$STATUS" = "running" ]; then
        echo "RUNNING"
      else
        echo "BUSY"
      fi
    fi
  create: |-
    docker run -d --privileged --name devsy-${MACHINE_ID} docker
    docker exec devsy-${MACHINE_ID} mkdir /etc/init.d
    i=0
    until docker exec devsy-${MACHINE_ID} docker info >/dev/null 2>&1; do
      i=$((i+1))
      if [ $i -gt 60 ]; then
        echo "dockerd in devsy-${MACHINE_ID} did not become ready within 60s" >&2
        docker logs --tail 50 devsy-${MACHINE_ID} >&2 || true
        exit 1
      fi
      sleep 1
    done
  delete: |-
    docker stop devsy-${MACHINE_ID} && docker rm devsy-${MACHINE_ID}
