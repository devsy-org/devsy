name: docker
version: v1.0.0
icon: https://dl.devsy.sh/assets/docker.svg
home: https://github.com/devsy-org/devsy
description: |-
  Devsy on Docker
optionGroups:
  - options:
      - DOCKER_PATH
      - DOCKER_HOST
      - DOCKER_ELEVATION
      - INACTIVITY_TIMEOUT
      - DOCKER_BUILDER
    name: "Advanced Options"
options:
  INACTIVITY_TIMEOUT:
    description: "If defined, will automatically stop the container after the inactivity period. Examples: 10m, 1h"
  DOCKER_PATH:
    description: The path where to find the docker binary.
    default: docker
  DOCKER_ELEVATION:
    description: "Optionally run docker commands through a privilege-elevation helper for rootful daemons whose socket the current user cannot access. One of: pkexec, sudo, doas, or none. Note: pkexec targets local desktop sessions with a running polkit agent; use sudo or doas on headless/SSH hosts."
    default: none
  DOCKER_HOST:
    global: true
    description: The docker host to use.
  DOCKER_BUILDER:
    global: true
    description: The docker builder to use.
agent:
  containerInactivityTimeout: ${INACTIVITY_TIMEOUT}
  local: true
  docker:
    path: ${DOCKER_PATH}
    elevation: ${DOCKER_ELEVATION}
    builder: ${DOCKER_BUILDER}
    install: false
    env:
      DOCKER_HOST: ${DOCKER_HOST}
exec:
  command: |-
    "${DEVSY}" internal sh -c "${COMMAND}"
