name: kubernetes
version: v1.0.0
icon: https://dl.devsy.sh/assets/kubernetes.svg
home: https://github.com/devsy-org/devsy
description: |-
  Devsy on Kubernetes
optionGroups:
  - options:
      - KUBERNETES_NAMESPACE
      - DISK_SIZE
    name: "Options"
    defaultVisible: true
  - options:
      - KUBERNETES_CONTEXT
      - KUBERNETES_CONFIG
    name: "Kubernetes Config"
  - options:
      - CLUSTER_ROLE
      - SERVICE_ACCOUNT
      - CREATE_NAMESPACE
      - INACTIVITY_TIMEOUT
      - STORAGE_CLASS
      - PVC_ACCESS_MODE
      - PVC_ANNOTATIONS
      - RESOURCES
      - POD_MANIFEST_TEMPLATE
      - NODE_SELECTOR
      - LABELS
      - DOCKERLESS_DISABLED
      - DOCKERLESS_IMAGE
      - AGENT_SECURITY_CONTEXT
      - AGENT_INSTALL_PATH
      - KUBERNETES_USER_NAMESPACES
    name: "Advanced Options"
options:
  DISK_SIZE:
    description: The default size for the persistent volume to use.
    default: 10Gi
    global: true
  KUBERNETES_CONTEXT:
    description: The kubernetes context to use, e.g. my-kube-context
  KUBERNETES_CONFIG:
    description: The kubernetes config to use, e.g. /path/to/my/kube/config.yaml
  KUBERNETES_PULL_SECRETS_ENABLED:
    description: If true, Devsy will create Kubernetes pull secrets from your injected Docker credentials for private registries. This setting requires the global Docker credentials forwarding setting (SSH_INJECT_DOCKER_CREDENTIALS) to be enabled. If Docker credential injection is disabled, pull secrets cannot be created regardless of this setting.
    default: "true"
    type: boolean
    global: true
  KUBERNETES_NAMESPACE:
    description: The kubernetes namespace to use. Defaults to devsy.
    default: "devsy"
  CREATE_NAMESPACE:
    description: If true, Devsy will try to create the namespace.
    default: "true"
    type: boolean
    global: true
  CLUSTER_ROLE:
    description: If defined, Devsy will create a role binding for the given cluster role.
    global: true
  SERVICE_ACCOUNT:
    description: If defined, Devsy will use the given service account for the dev container.
    global: true
  INACTIVITY_TIMEOUT:
    description: "If defined, will automatically stop the pod after the inactivity period. Examples: 10m, 1h"
  POD_TIMEOUT:
    description: "Determines how long the provider waits for the workspace pod to come up. Examples: 10m, 1h"
    default: 10m
  STORAGE_CLASS:
    description: If defined, Devsy will use the given storage class to create the persistent volume claim. You will need to ensure the storage class exists in your cluster!
    global: true
  PVC_ACCESS_MODE:
    description: If defined, Devsy will use the given access mode to create the persistent volume claim. You will need to ensure the storage class supports the given access mode, e.g. RWO or ROX or RWX or RWOP
    global: true
  PVC_ANNOTATIONS:
    description: If defined, Devsy will use add the given annotations to the main workspace pvc
    global: true
  NODE_SELECTOR:
    description: The node selector to use for the workspace pod, e.g. my-label=value,my-label-2=value-2
    global: true
  RESOURCES:
    description: The resources to use for the workspace container, e.g. requests.cpu=500m,limits.memory=5Gi,limits.gpu-vendor.example/example-gpu=1
    global: true
  POD_MANIFEST_TEMPLATE:
    description: Pod manifest template file path used as template to build the devsy pod, e.g. /path/pod_manifest.yaml. Alternatively can be an inline yaml string.
    global: true
    type: multiline
  LABELS:
    description: The labels to use for the workspace pod, e.g. devsy.sh/example=value,devsy.sh/example2=value2
    global: true
  DOCKERLESS_IMAGE:
    description: The dockerless image to use.
    global: true
  DOCKERLESS_DISABLED:
    description: If dockerless should be disabled. Dockerless is the way Devsy uses to build images directly within Kubernetes. If dockerless is disabled and no image is specified, Devsy will fail instead.
    global: true
    default: "false"
  STRICT_SECURITY:
    description: Clears the injected containers' RunAsUser/RunAsGroup/RunAsNonRoot (letting the cluster assign a UID, e.g. an OpenShift SCC) unless POD_MANIFEST_TEMPLATE or AGENT_SECURITY_CONTEXT already set these fields. It also sets spec.hostUsers to false unless POD_MANIFEST_TEMPLATE explicitly sets it, as required by OpenShift restricted-v3. Capabilities and Privileged (from CapAdd/--privileged) are always kept.
    type: boolean
    default: false
  AGENT_SECURITY_CONTEXT:
    description: Inline YAML (or a file path) for a Kubernetes SecurityContext merged field by field onto the injected devsy and devsy-init containers. It can set run-as, capabilities, privilege escalation, seccomp, and other supported SecurityContext fields, e.g. to satisfy an OpenShift SCC's allocated UID range. Takes precedence over STRICT_SECURITY and the built-in root default. It does not enable user namespaces. A container matching the devsy/devsy-init name in POD_MANIFEST_TEMPLATE still takes precedence over this option.
    global: true
    type: multiline
  AGENT_INSTALL_PATH:
    description: Overrides where the agent binary is installed inside the devsy/devsy-init containers, e.g. a path under a writable mount such as WORKSPACE_VOLUME_MOUNT. The default (/usr/local/bin/devsy) requires root to write; set this when running non-root (e.g. with AGENT_SECURITY_CONTEXT or STRICT_SECURITY on an OpenShift restricted SCC) so delivery and the container's own entrypoint agree on a writable location.
    global: true
    type: string
  KUBERNETES_USER_NAMESPACES:
    description: Sets spec.hostUsers to false (unless POD_MANIFEST_TEMPLATE already set it), so the kubelet maps the workspace pod's UIDs into a Linux user namespace. Requires the cluster's UserNamespacesSupport feature gate (on by default only from Kubernetes 1.33) and node-level support (Linux kernel 6.3+, containerd 2.0+/CRI-O 1.25+); enabling this on a cluster without that support can get the pod rejected or mishandled. It is never inferred from AGENT_SECURITY_CONTEXT alone.
    type: boolean
    default: false
  WORKSPACE_VOLUME_MOUNT:
    description: Sets the path of the workspace volume mount. By default it is the root of your workspace source code, usually /workspaces/$WORKSPACE_ID. If you intend to create multi-repo workspaces or need additional files throughout the lifecycle of the workspace, set this option to a parent directory of the workspace mount.
    type: string
  ARCHITECTURE:
    description: The cpu architecture to use for the workspace pod, e.g. amd64, arm64, etc.
    type: string
agent:
  containerInactivityTimeout: ${INACTIVITY_TIMEOUT}
  local: true
  dockerless:
    disabled: ${DOCKERLESS_DISABLED}
    image: ${DOCKERLESS_IMAGE}
  driver: kubernetes
  kubernetes:
    kubernetesContext: ${KUBERNETES_CONTEXT}
    kubernetesConfig: ${KUBERNETES_CONFIG}
    kubernetesNamespace: ${KUBERNETES_NAMESPACE}
    podTimeout: ${POD_TIMEOUT}
    diskSize: ${DISK_SIZE}
    kubernetesPullSecretsEnabled: ${KUBERNETES_PULL_SECRETS_ENABLED}
    createNamespace: ${CREATE_NAMESPACE}
    clusterRole: ${CLUSTER_ROLE}
    serviceAccount: ${SERVICE_ACCOUNT}
    architecture: ${ARCHITECTURE}
    inactivityTimeout: ${INACTIVITY_TIMEOUT}
    storageClass: ${STORAGE_CLASS}
    pvcAccessMode: ${PVC_ACCESS_MODE}
    pvcAnnotations: ${PVC_ANNOTATIONS}
    nodeSelector: ${NODE_SELECTOR}
    resources: ${RESOURCES}
    workspaceVolumeMount: ${WORKSPACE_VOLUME_MOUNT}
    podManifestTemplate: ${POD_MANIFEST_TEMPLATE}
    labels: ${LABELS}
    strictSecurity: ${STRICT_SECURITY}
    agentSecurityContext: ${AGENT_SECURITY_CONTEXT}
    agentInstallPath: ${AGENT_INSTALL_PATH}
    kubernetesUserNamespaces: ${KUBERNETES_USER_NAMESPACES}
exec:
  command: |-
    "${DEVSY}" internal sh -c "${COMMAND}"
