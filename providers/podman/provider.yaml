name: podman
version: v1.0.0
icon: https://dl.devsy.sh/assets/podman.svg
home: https://github.com/devsy-org/devsy
description: |-
  Devsy on Podman
optionGroups:
  - options:
      - PODMAN_PATH
      - PODMAN_HOST
      - PODMAN_ELEVATION
      - INACTIVITY_TIMEOUT
    name: "Advanced Options"
options:
  INACTIVITY_TIMEOUT:
    description: "If defined, will automatically stop the container after the inactivity period. Examples: 10m, 1h"
  PODMAN_PATH:
    description: The path where to find the podman binary.
    default: podman
  PODMAN_ELEVATION:
    description: "Optionally run podman commands through a privilege-elevation helper for a rootful podman socket the current user cannot access. One of: pkexec, sudo, doas, or none. Leave as none for rootless podman: elevating would target the separate rootful podman instead. Note: pkexec targets local desktop sessions with a running polkit agent; use sudo or doas on headless/SSH hosts."
    default: none
  PODMAN_HOST:
    global: true
    description: The podman host to use.
agent:
  containerInactivityTimeout: ${INACTIVITY_TIMEOUT}
  local: true
  docker:
    path: ${PODMAN_PATH}
    elevation: ${PODMAN_ELEVATION}
    install: false
    runtime: podman
    env:
      DOCKER_HOST: ${PODMAN_HOST}
exec:
  command: |-
    "${DEVSY}" internal sh -c "${COMMAND}"
