pipeline:
  id: pipeline_devsy_org_devsy_build_9530
  name: pipeline_devsy_org_devsy_build_9530
  stages:
    - name: Build and Test
      id: build_test
      env:
        GOPATH: /harness/.cache/go
        GOMODCACHE: /harness/.cache/go/pkg/mod
        GOCACHE: /harness/.cache/go-build
      clone:
        enabled: true
      cache:
        enabled: true
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - name: Setup Go
          id: setup_go
          run:
            shell: bash
            script: |-
              # Verify Go is available and check version
              command -v go || { echo "Go not found, installing..."; exit 1; }
              go version

              # Create Go cache directories outside the workspace to avoid recursive discovery
              mkdir -p "$GOMODCACHE"
              mkdir -p "$GOCACHE"
        - name: Install Dependencies
          id: install_deps
          run:
            shell: bash
            script: go mod download
        - name: Run Unit Tests
          id: run_tests
          run-test:
            shell: bash
            script: |-
              mkdir -p .harness/reports .harness/coverage

              # Install go-junit-report for JUnit XML conversion
              go install github.com/jstemmer/go-junit-report/v2@v2.1.0

              # Run the unit tests with coverage using the repository's wrapper
              set +e
              go run ./hack/ci unit --coverprofile=.harness/coverage/coverage.out 2>&1 | tee .harness/reports/go-test.log
              test_status=${PIPESTATUS[0]}

              # Convert test output to JUnit XML
              "$(go env GOPATH)/bin/go-junit-report" -set-exit-code < .harness/reports/go-test.log > .harness/reports/junit.xml
              report_status=$?
              set -e

              # Fail if tests failed
              if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
              exit "$report_status"
            intelligence:
              disabled: true
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              test -s ".harness/coverage/coverage.out"
              hcli cov upload --file=".harness/coverage/coverage.out"
  tags:
    onboarding: "true"
