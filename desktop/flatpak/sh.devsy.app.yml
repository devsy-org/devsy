app-id: sh.devsy.app
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
command: devsy-wrapper

finish-args:
  # Wayland + X11 + GPU
  - --socket=wayland
  - --socket=x11
  - --device=dri
  # Network (required for workspace creation, provider communication)
  - --share=network
  # SSH agent forwarding
  - --socket=ssh-auth
  # Home directory (for ~/.devsy, ~/.ssh, workspace sources)
  - --filesystem=home
  # D-Bus for notifications and system tray
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Access to host commands via flatpak-spawn (for docker, kubectl, etc.)
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: devsy-desktop
    buildsystem: simple
    build-commands:
      # Extract the .deb package
      - ar x devsy-desktop.deb
      - tar xf data.tar.*
      # Install the Electron app
      - cp -r opt/Devsy /app/devsy
      # Install the CLI binary
      - install -Dm755 opt/Devsy/resources/bin/devsy /app/bin/devsy
      # Install desktop file, exported icons, and wrapper
      - install -Dm644 Devsy.desktop /app/share/applications/sh.devsy.app.desktop
      - install -Dm644 icon-32.png /app/share/icons/hicolor/32x32/apps/sh.devsy.app.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/sh.devsy.app.png
      - install -Dm755 devsy-wrapper /app/bin/devsy-wrapper
    sources:
      - type: file
        path: devsy-desktop.deb
      - type: file
        path: Devsy.desktop
      - type: file
        path: devsy-wrapper
      # Flatpak exports only icons up to 512x512 from share/icons/hicolor.
      - type: file
        path: ../resources/icons/32x32.png
        dest-filename: icon-32.png
      - type: file
        path: ../resources/icons/128x128.png
        dest-filename: icon-128.png
